<style>

body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);padding-bottom:80px}

.o{background:var(--y);color:#222;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;margin-left:6px}
.p{color:var(--g);font-weight:800}.n{color:var(--danger);font-weight:800}

</style></head><body>

<header><b>🥁 Mbolo Tam Tam</b><span id="bl">0.0 KC</span></header>
<main id="v"></main>
<div id="to"></div>
<nav id="nv"></nav>

<script type="module">
const E=new TextEncoder(),$=s=>document.querySelector(s),R=n=>Math.random().toString(36).slice(2,2+n).toUpperCase();
const AL={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'},DAY=864e5;

// --- ÉTAT LOCAL ---
let S; try{S=JSON.parse(localStorage.mtt)}catch(e){}
S=S||{me:null,bal:0,led:[],posts:[],mk:[],tun:{},msgs:[],used:{},relay:[],pub:null,adm:null,admId:null,until:0,bonus:0,cert:null,k:null};

// NETTOYAGE AUTO : Si les anciennes données sont corrompues, on réinitialise
if(S && !S.posts) S.posts = [];
if(S && !S.mk) S.mk = [];
if(S && !S.tun) S.tun = {};
if(S && !S.led) S.led = [];

const save=()=>{try{localStorage.mtt=JSON.stringify(S)}catch(e){toast('Sauvegarde impossible')}};

// --- FORMATAGE & UTILITAIRES ---
const kc=d=>(d/10).toFixed(1)+' KC',fc=d=>(d*10).toLocaleString('fr')+' FCFA';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>new Date(t).toLocaleString('fr',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const t=$('#to');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}

// --- CRYPTOGRAPHIE ---
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gen(){const k=await crypto.subtle.generateKey(AL,true,['sign','verify']);return{pub:await crypto.subtle.exportKey('jwk',k.publicKey),prv:await crypto.subtle.exportKey('jwk',k.privateKey)}}
const ik=(j,u)=>crypto.subtle.importKey('jwk',j,AL,false,[u]);
async function sign(o,prv){const p=JSON.stringify(o);return{p,s:b64(await crypto.subtle.sign(SG,await ik(prv,'sign'),E.encode(p)))}}
async function ver(it,pub){try{return await crypto.subtle.verify(SG,await ik(pub,'verify'),ub(it.s),E.encode(it.p))}catch(e){return false}}
async function tk(tid,pw){const m=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:E.encode(tid),iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(k,t){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,E.encode(t)))}
async function dec(k,c){try{const[a,b]=c.split('.');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(a)},k,ub(b)))}catch(e){return null}}

const TK={}; let tab='feed', openT=null;
const TABS=[['feed','🌐','Fil'],['mk','🏪','Marché'],['tun','🔒','Tunnels'],['w','💰','Wallet'],['ex','🔁','Échange']];

function nav(){
  $('#nv').innerHTML=TABS.concat(S.adm?[['adm','🛡️','Admin']]:[]).map(t=>`<a class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</a>`).join('');
  $('#bl').textContent=kc(S.bal);
}
window.go = t => {tab=t;openT=null;draw()};

async function draw(){
  try {
    nav(); const v=$('#v');
    if(!S.me){
      v.innerHTML=`<div class="k" style="text-align:center;padding:30px 16px">
        <h2 style="color:var(--g)">Mbolo ! 👋</h2>
        <p>Bienvenue sur le réseau du quartier.</p>
        <input id="nm" placeholder="Ton prénom ou pseudo" style="margin-top:20px">
        <button onclick="start()" style="width:100%;margin-top:10px">Commencer l'aventure</button>
        <div style="margin-top:20px;border-top:1px solid var(--l);padding-top:10px">
          <small class="m" onclick="resetApp()" style="text-decoration:underline;cursor:pointer">L'application bug ? Clique ici pour réparer</small>
        </div>
      </div>`; return;
    }
    v.innerHTML=await({feed:fFeed,mk:fMk,tun:fTun,w:fW,ex:fEx,adm:fAdm}[tab])();
  } catch (error) {
    $('#v').innerHTML = `<div class="k" style="text-align:center;border:2px solid var(--danger)">
      <h3 style="color:var(--danger)">⚠️ Oups, un petit bug !</h3>
      <p>L'application a rencontré une erreur.</p>
      <div style="font-size:12px;background:#ffebee;color:#b71c1c;padding:10px;border-radius:8px;margin:10px 0;text-align:left;overflow-x:auto">
        ${error.message || error}
      </div>
      <button class="danger" onclick="resetApp()" style="width:100%;margin-top:10px">Réparer l'application</button>
    </div>`;
    console.error(error);
  }
}

window.resetApp = () => {
  if (confirm("⚠️ ATTENTION : Cela va effacer tes données locales (solde, messages) pour réparer l'application. Continuer ?")) {
    localStorage.clear();
    location.reload();
  }
};

window.start = async () => {
  const n=$('#nm').value.trim(); if(!n)return toast('Entre un nom');
  S = {
    me: {id:'M'+R(5), name:n},
    k: null,
    bal: 50,
    led: [{ts:Date.now(), m:'Bonus de bienvenue', d:50}],
    posts: [], mk: [], tun: {}, msgs: [], used: {}, relay: [], adm: null, admId: null, until: 0, bonus: 0, cert: null
  };
  try {
    S.k = await gen();
  } catch(e) {
    console.error("Erreur crypto", e);
  }
  save(); draw();
};

// ---- ÉCHANGES & PAIEMENTS ----
function out(o){return sign(o,S.k.prv).then(it=>{if(S.cert)it.c=S.cert;S.used[o.id]=1;S.relay.push(it);S.relay=S.relay.slice(-300);return it})}
async function pay(to,d,m){
  if(!S.k) return toast('Erreur de sécurité, reconnecte-toi');
  if(d<=0||S.bal<d){toast('Solde insuffisant');return false}
  S.bal-=d; S.led.unshift({ts:Date.now(),m:'Envoi à '+to+(m?' · '+m:''),d:-d});
  await out({t:'x',id:R(10),f:S.me.id,to,d,m,ts:Date.now()}); save(); return true;
}

// ==========================================
// 1. FIL D'ACTUALITÉ (FIREBASE)
// ==========================================
async function fFeed(){
  const P=[...(S.posts||[])].filter(p => p && p.ts).sort((a,b)=>b.ts-a.ts);
  return `<div class="k">
    <textarea id="px" rows="3" placeholder="Partage une info avec le quartier..."></textarea>
    <button onclick="publierFirebase()" style="width:100%;margin-top:8px">🚀 Publier sur le réseau</button>
  </div>` +
  (P.map(p=>`<div class="k">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>${esc(p.n)}</b> <small>${ago(p.ts)}</small>
    </div>
    <div class="post-content">${esc(p.x)}</div>
    ${p.a==S.me.id?'':`
      <div style="margin-top:10px;border-top:1px solid var(--l);padding-top:10px">
        <button class="tip" onclick="tip('${p.a}','${esc(p.n)}',10)">🔥 1 KC</button>
        <button class="tip" onclick="tip('${p.a}','${esc(p.n)}',50)">💎 5 KC</button>
        <button class="tip" onclick="tip('${p.a}','${esc(p.n)}',100)">👑 10 KC</button>
      </div>
    `}
  </div>`).join('') || '<p class="m" style="text-align:center;padding:20px">Aucune publication pour le moment.</p>');
}

window.publierFirebase = async () => {
  const texte = $('#px').value.trim();
  if (!texte) return toast('Écris quelque chose');
  if (!window.FB) return toast('Connexion au réseau en cours...');
  
  const postData = { a: S.me.id, n: S.me.name, x: texte, ts: Date.now() };
  try {
    window.FB.push(window.FB.ref(window.FB.db, 'posts'), postData);
    $('#px').value = '';
    toast('Publié !');
  } catch (e) { toast('Erreur réseau'); }
};

function ecouterPosts() {
  if (!window.FB) return;
  const postsRef = window.FB.ref(window.FB.db, 'posts');
  window.FB.onChildAdded(postsRef, (snapshot) => {
    const post = snapshot.val();
    if (!post) return;
    if (!S.posts) S.posts = [];
    if (!S.posts.find(p => p.ts === post.ts)) {
      S.posts.push({ id: snapshot.key, a: post.a, n: post.n, x: post.x, ts: post.ts });
      if (tab === 'feed') draw(); 
    }
  });
}

window.tip = async (authorId, authorName, amount) => {
  if(S.bal < amount) return toast('Solde insuffisant');
  if(await pay(authorId, amount, 'Pourboire à '+authorName)) {
    toast('Merci envoyé à ' + authorName + ' 🙏');
    draw();
  }
}

// ==========================================
// 2. MARCHÉ (FIREBASE)
// ==========================================
async function fMk(){
  const M = [...(S.mk||[])].filter(m => m && m.ts).sort((a,b)=>b.ts-a.ts);
  return `<div class="k">
    <h3>Mettre en vente</h3>
    <input id="mt" placeholder="Produit ou service">
    <input id="mp" type="number" step="1" placeholder="Prix en KC">
    <textarea id="md" rows="2" placeholder="Description rapide..."></textarea>
    <button onclick="sell()" style="width:100%">Publier l'annonce</button>
  </div>` +
  (M.map(l=>`<div class="k">
    <b>${esc(l.t)}</b> <span class="p" style="float:right">${kc(l.d)}</span><br>
    <small>Vendeur : ${esc(l.n)}</small>
    <p style="margin:8px 0;font-size:14px">${esc(l.x)}</p>
    ${l.a==S.me.id?'<small class="m">C\'est ton annonce</small>':`<button onclick="buy('${l.id}','${l.a}','${esc(l.t)}',${l.d})" style="margin-top:8px">Acheter</button>`}
  </div>`).join('') || '<p class="m" style="text-align:center">Aucune annonce.</p>');
}

window.sell = async () => {
  const t=$('#mt').value.trim(), p=parseFloat($('#mp').value), x=$('#md').value.trim();
  if(!t || !p || p<=0) return toast('Titre et prix valides requis');
  if (!window.FB) return toast('Connexion au réseau en cours...');
  const d = Math.round(p*10); 
  
  const item = { id: R(8), a: S.me.id, n: S.me.name, t, d, x, ts: Date.now() };
  try {
    window.FB.push(window.FB.ref(window.FB.db, 'marketplace'), item);
    S.mk.push(item); save(); draw(); toast('Annonce publiée !');
  } catch(e) { toast('Erreur réseau'); }
}

function ecouterMarche() {
  if (!window.FB) return;
  const mkRef = window.FB.ref(window.FB.db, 'marketplace');
  window.FB.onChildAdded(mkRef, (snapshot) => {
    const item = snapshot.val();
    if (!item) return;
    if (!S.mk) S.mk = [];
    if (!S.mk.find(m => m.ts === item.ts)) {
      S.mk.push(item);
      if (tab === 'mk') draw(); 
    }
  });
}

window.buy = async (id, sellerId, title, price) => {
  if(confirm(`Acheter "${title}" pour ${kc(price)} ?`)) {
    if(await pay(sellerId, price, 'Achat: '+title)) {
      toast('Achat effectué ! Contacte le vendeur.');
    }
  }
}

// ==========================================
// 3. TUNNELS CHIFFRÉS (FIREBASE)
// ==========================================
async function fTun(){
  if(openT) return chat();
  return `<div class="k">
    <h3>Créer un tunnel privé</h3>
    <input id="tn" placeholder="Nom du tunnel">
    <input id="tp" type="password" placeholder="Clé secrète (mot de passe)">
    <button onclick="mkT()" style="width:100%">Créer le tunnel</button>
  </div>
  <div class="k">
    <h3>Rejoindre un tunnel</h3>
    <input id="ti" placeholder="ID du tunnel (ex. T-ABC12)">
    <input id="tq" type="password" placeholder="Clé secrète">
    <button onclick="joinT()" style="width:100%">Rejoindre</button>
  </div>` +
  Object.entries(S.tun||{}).map(([i,n])=>`<div class="k" onclick="op('${i}')" style="cursor:pointer;border-left:4px solid var(--g)">
    <b>🔒 ${esc(n)}</b><br><small>ID : ${i}</small>
  </div>`).join('');
}

window.mkT = async () => {
  const n=$('#tn').value.trim(), p=$('#tp').value;
  if(!n || !p) return toast('Nom et clé requis');
  const i='T-'+R(5);
  S.tun[i]=n; TK[i]=await tk(i,p); save(); toast('ID à partager : '+i); op(i);
}

window.joinT = async () => {
  const i=$('#ti').value.trim().toUpperCase(), p=$('#tq').value;
  if(!i || !p) return;
  S.tun[i]=S.tun[i]||'Tunnel '+i; TK[i]=await tk(i,p); save(); op(i);
}

window.op = async (i) => {
  if(!TK[i]){
    const p=prompt('Entrez la clé secrète de ce tunnel');
    if(!p) return; TK[i]=await tk(i,p);
  }
  openT=i; draw();
  
  if (!window.FB) return;
  window.FB.onChildAdded(window.FB.ref(window.FB.db, 'tunnels/'+i), (snap) => {
    const m = snap.val();
    if(!m) return;
    if(!S.msgs) S.msgs = [];
    if(!S.msgs.find(x=>x.ts === m.ts)) {
      S.msgs.push({ i, ts: m.ts, n: m.n, c: m.c });
      if(openT === i) draw();
    }
  });
}

async function chat(){
  const i=openT, M=[];
  const list = S.msgs.filter(m=>m.i==i).sort((a,b)=>a.ts-b.ts);
  
  for(const m of list){
    const t = await dec(TK[i], m.c);
    M.push(`<div style="margin-bottom:12px;text-align:${m.n===S.me.name?'right':'left'}">
      <small style="display:block;margin-bottom:4px">${esc(m.n)} · ${new Date(m.ts).toLocaleTimeString()}</small>
      <div style="display:inline-block;padding:10px 14px;border-radius:12px;background:${m.n===S.me.name?'var(--g)':'var(--l)'};color:${m.n===S.me.name?'#fff':'var(--t)'};max-width:80%">
        ${t==null?'<i class="m">🔒 Clé incorrecte</i>':esc(t)}
      </div>
    </div>`);
  }
  
  return `<div class="k" style="height:65vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <button class="s" onclick="go('tun')">← Retour</button>
      <b style="align-self:center">🔒 ${esc(S.tun[i])}</b>
      <div></div>
    </div>
    <div style="flex:1;overflow-y:auto;padding-right:5px" id="chat-box">
      ${M.join('') || '<p class="m" style="text-align:center;margin-top:20px">Début de la conversation chiffrée.</p>'}
    </div>
    <div style="display:flex;margin-top:10px;gap:8px">
      <input id="cm" placeholder="Message chiffré..." style="margin:0" onkeypress="if(event.key==='Enter')snd()">
      <button onclick="snd()" style="margin:0;padding:10px 16px">Envoyer</button>
    </div>
  </div>`;
}

window.snd = async () => {
  const t=$('#cm').value.trim(); if(!t)return;
  if (!window.FB) return toast('Connexion en cours...');
  const c = await enc(TK[openT], t);
  const m = { ts: Date.now(), n: S.me.name, c };
  
  window.FB.push(window.FB.ref(window.FB.db, 'tunnels/'+openT), m);
  $('#cm').value='';
  if(!S.msgs.find(x=>x.ts === m.ts)) { S.msgs.push({ i: openT, ...m }); draw(); }
  setTimeout(()=>{const cb=$('#chat-box'); if(cb)cb.scrollTop=cb.scrollHeight;},100);
}

// ==========================================
// 4. WALLET & PROFIL
// ==========================================
async function fW(){
  return `<div class="k" style="text-align:center;background:var(--g);color:#fff">
    <h2 style="margin:0;font-size:32px">${kc(S.bal)}</h2>
    <small style="color:rgba(255,255,255,0.8)">≈ ${fc(S.bal)}</small>
    <div style="margin-top:16px">
      <button class="s" onclick="bonus()">🎁 Bonus du jour</button>
    </div>
  </div>
  
  <div class="k">
    <h3>Mon identifiant</h3>
    <p>Donne ce code à un ami ou au relais pour recevoir des KC :</p>
    <textarea readonly rows="2" onclick="this.select()" style="font-size:12px;text-align:center">${S.me.id}</textarea>
    <button class="s" onclick="navigator.clipboard&&navigator.clipboard.writeText('${S.me.id}');toast('Copié')" style="width:100%">Copier mon ID</button>
  </div>

  <div class="k">
    <h3>Envoyer des KC</h3>
    <input id="wt" placeholder="ID du destinataire (ex. MAB12C)">
    <input id="wd" type="number" step="0.1" placeholder="Montant (ex: 1.5)">
    <button onclick="send()" style="width:100%">Envoyer</button>
  </div>

  <div class="k">
    <h3>Historique</h3>
    ${(S.led||[]).filter(l=>l && l.ts).map(l=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:8px 0">
      <small>${ago(l.ts)}<br>${esc(l.m)}</small> 
      <b class="${l.d>0?'p':'n'}" style="align-self:center">${l.d>0?'+':''}${kc(l.d)}</b>
    </div>`).join('') || '<small class="m">Aucun mouvement.</small>'}
  </div>`;
}

window.bonus = () => {
  if(Date.now()-S.bonus < DAY) return toast('Reviens demain');
  S.bonus=Date.now(); S.bal+=10; 
  S.led.unshift({ts:Date.now(),m:'Bonus quotidien',d:10});
  save(); draw(); toast('+1 KC reçu !');
}

window.send = async () => {
  const to=$('#wt').value.trim().toUpperCase(), d=Math.round(parseFloat($('#wd').value)*10);
  if(!to || !d || d<=0) return toast('ID et montant valides requis');
  if(await pay(to, d, 'Transfert')){ toast('Envoi réussi !'); draw(); }
}

// ==========================================
// 5. ÉCHANGE (BLUETOOTH / SAUVEGARDE)
// ==========================================
const bundle=()=>JSON.stringify({v:1,me:S.me,bal:S.bal,led:S.led,posts:S.posts,msgs:S.msgs});
async function fEx(){
  return `<div class="k">
    <h3>Sauvegarder / Transférer</h3>
    <p class="m">Génère un fichier texte avec ton historique et ton solde pour le transférer sur un autre téléphone.</p>
    <button onclick="shareB()" style="width:100%">📤 Partager ma valise</button>
    <button class="s" onclick="dl()" style="width:100%">⬇️ Télécharger le fichier</button>
  </div>
  <div class="k">
    <h3>Importer une valise</h3>
    <input type="file" id="fi" onchange="rf(this)">
    <textarea id="ft" rows="3" placeholder="Ou colle le texte ici..."></textarea>
    <button onclick="imp($('#ft').value)" style="width:100%">Importer</button>
  </div>`;
}

window.shareB = async () => {
  const f=new File([bundle()],'valise-tamtam.txt',{type:'text/plain'});
  try{ if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:'Ma valise'}); else dl(); }catch(e){}
}
window.dl = () => {
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bundle()],{type:'text/plain'})); a.download='valise-tamtam.txt'; a.click();
}
window.rf = (i) => { const r=new FileReader(); r.onload=()=>imp(r.result); r.readAsText(i.files[0]); }
window.imp = (t) => {
  try {
    const b=JSON.parse(t);
    if(b.me) S.me=b.me;
    if(b.bal) S.bal=b.bal;
    if(b.led) S.led=b.led;
    save(); draw(); toast('Valise importée avec succès !');
  } catch(e){ toast('Fichier invalide'); }
}
