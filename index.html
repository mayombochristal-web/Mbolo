// --- CRYPTOGRAPHIE ---
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gen(){const k=await crypto.subtle.generateKey(AL,true,['sign','verify']);return{pub:await crypto.subtle.exportKey('jwk',k.publicKey),prv:await crypto.subtle.exportKey('jwk',k.privateKey)}}
const ik=(j,u)=>crypto.subtle.importKey('jwk',j,AL,false,[u]);
async function sign(o,prv){const p=JSON.stringify(o);return{p,s:b64(await crypto.subtle.sign(SG,await ik(prv,'sign'),E.encode(p)))}}
async function tk(tid,pw){const m=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:E.encode(tid),iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(k,t){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,E.encode(t)))}
async function dec(k,c){try{const[a,b]=c.split('.');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(a)},k,ub(b)))}catch(e){return null}}

// --- UPLOAD IMAGE LÉGER & SÉCURISÉ ---
// Génère une miniature compressée pour Firebase
function generateThumbnail(file) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) {
      // Si c'est un PDF, on renvoie null (on affichera une icône PDF)
      resolve(null); return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 400;
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.5)); // Compression à 50%
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Upload le fichier lourd (chiffré ou non) sur le serveur
async function uploadFile(file, shouldEncrypt) {
  if(!file) return { url: null, fname: '' };
  toast('Envoi du fichier sur le serveur...');
  
  let fileToUpload = file;
  let fname = file.name;

  if (shouldEncrypt) {
    // Chiffrement binaire du fichier
    try {
      const arrayBuffer = await file.arrayBuffer();
      const key = await tk('file_encryption', 'mbolo-secret-key-2024'); // Clé de démo
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, arrayBuffer);
      fileToUpload = new Blob([iv, encrypted], { type: 'application/octet-stream' });
      fname = fname + '.enc';
    } catch(e) { toast('Erreur chiffrement fichier'); return { url: null, fname: '' }; }
  }

  const formData = new FormData();
  formData.append('reqtype', 'fileupload');
  formData.append('fileToUpload', fileToUpload, fname);

  try {
    const res = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: formData });
    const url = await res.text();
    return { url: url, fname: fname };
  } catch(e) { toast('Erreur upload'); return { url: null, fname: '' }; }
}

// --- AUTHENTIFICATION ---

async function fAuth(){

    <h2 style="color:var(--g);text-align:center;margin-bottom:20px">Mbolo V9</h2>
    <div class="auth-tabs">

    </div>
    ${msgHtml}
    <input id="authUser" placeholder="Ton pseudo (ex: aldo)" autocomplete="username">
    <input id="authPass" type="password" placeholder="Ton mot de passe" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
    ${!isLogin ? `<input id="authRef" placeholder="Code parrain (optionnel)">` : ''}
    <button id="btnLogin" onclick="loginUser()" style="width:100%;margin-top:15px">
      ${isLogin ? 'Se connecter' : 'Créer mon compte'}
    </button>

}

window.loginUser = async () => {
  const pseudo = $('#authUser').value.trim().toLowerCase();
  const pass = $('#authPass').value;
  const refCode = $('#authRef')?.value.trim() || '';
  const btn = $('#btnLogin');
  
  if(!pseudo || pass.length < 6) { authMsg = { type: 'error', text: 'Pseudo et mot de passe (6 car. min) requis' }; draw(); return; }
  
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Chargement...'; authMsg = { type: '', text: '' };
  const email = `${pseudo}@mbolo.app`;
  const isLogin = authMode === 'login';

  try {
    if(!isLogin) {
      const userCred = await window.FB.createUserWithEmailAndPassword(window.FB.auth, email, pass);
      const uid = userCred.user.uid;
      await window.FB.set(window.FB.ref(window.FB.db, 'users/' + uid), { name: pseudo, bal: 0, joined: Date.now(), refCode: refCode });
      if(refCode) {
        const allUsers = await window.FB.get(window.FB.ref(window.FB.db, 'users'));
        if(allUsers.exists()) {
          const users = allUsers.val();
          const parrainId = Object.keys(users).find(k => k === refCode);
          if(parrainId) {
            await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + parrainId), (curr) => { if(curr) curr.bal = (curr.bal || 0) + 50; return curr; });
            await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + uid), (curr) => { if(curr) curr.bal = (curr.bal || 0) + 50; return curr; });
          }
        }
      }
      authMsg = { type: 'success', text: 'Compte créé avec succès !' };
    } else {
      await window.FB.signInWithEmailAndPassword(window.FB.auth, email, pass);
    }
  } catch (error) {
    btn.disabled = false; btn.textContent = isLogin ? 'Se connecter' : 'Créer mon compte';
    let errMsg = 'Une erreur est survenue.';
    if (error.code === 'auth/email-already-in-use') errMsg = '❌ Ce pseudo est déjà pris.';
    else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') errMsg = '❌ Pseudo ou mot de passe incorrect.';
    else if (error.code === 'auth/weak-password') errMsg = '❌ Mot de passe trop faible.';
    authMsg = { type: 'error', text: errMsg }; draw();
  }
};

window.FB.onAuthStateChanged(window.FB.auth, async (user) => {
  if(user) {
    S.uid = user.uid;
    const snap = await window.FB.get(window.FB.ref(window.FB.db, 'users/' + user.uid));
    if(snap.exists()) {
      const data = snap.val();
      S.me = { id: user.uid.substring(0,6).toUpperCase(), name: data.name };
      S.bal = data.bal || 0;
    } else {
      const fallbackName = user.email.split('@')[0];
      await window.FB.set(window.FB.ref(window.FB.db, 'users/' + user.uid), { name: fallbackName, bal: 0, joined: Date.now() });
      S.me = { id: user.uid.substring(0,6).toUpperCase(), name: fallbackName };
      S.bal = 0;
    }
    S.posts = []; S.mk = [];
    save(); draw();
    ecouterPosts(); ecouterMarche(); ecouterAnnuaire();

    S.me = null; S.uid = null; S.posts = []; S.mk = []; save(); draw();

});

// --- TRANSFERT SÉCURISÉ ---
async function transferKC(toUid, amountKc, reason) {
  if(!S.uid) return false;
  if(S.bal < amountKc) { toast('Solde insuffisant'); return false; }
  const amountToSend = Math.round(amountKc);
  try {
    await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + S.uid), (curr) => { if (curr && curr.bal >= amountToSend) curr.bal -= amountToSend; return curr; });
    await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + toUid), (curr) => { if (curr) { curr.bal = (curr.bal || 0) + amountToSend; } return curr; });
    window.FB.push(window.FB.ref(window.FB.db, 'transactions'), { from: S.uid, to: toUid, amount: amountToSend, reason: reason, ts: Date.now() });
    S.led.unshift({ts:Date.now(), m:'Envoi ('+reason+')', d:-amountToSend}); save(); return true;
  } catch(e) { toast('Erreur réseau'); return false; }
}

async function fFeed(){
  let P=[...(S.posts||[])].filter(p => p && p.ts);
  if (feedFilter === 'edu') P = P.filter(p => p.cat === 'edu');
  if (feedFilter === 'com') P = P.filter(p => p.cat === 'com');

  const filterHTML = `<div class="filters">
      <button class="${feedFilter==='all'?'on':'s'}" onclick="setFilter('all')">Tout</button>
      <button class="${feedFilter==='edu'?'on':'s'}" onclick="setFilter('edu')">📚 Éducation</button>
      <button class="${feedFilter==='com'?'on':'s'}" onclick="setFilter('com')">🛍️ Commerce</button>
    </div>`;

  const postForm = `<div class="k">
    <textarea id="px" rows="2" placeholder="Partage une info..."></textarea>
    <input type="file" id="pimg" accept="image/*,application/pdf" style="font-size:12px;margin-bottom:5px">
    <select id="pcat" style="margin-bottom:8px">
      <option value="gen">Discussion Générale</option>
      <option value="edu">📚 Éducation / Cours</option>
      <option value="com">🛍️ Commerce / Promo</option>
    </select>
    <button onclick="publierFirebase()" style="width:100%">🚀 Publier</button>
  </div>`;

  const postList = P.map(p=>{
    let badge = p.cat === 'edu' ? '<span class="badge-edu">📚 Éducation</span>' : (p.cat === 'com' ? '<span class="badge-com">🛍️ Commerce</span>' : '');
    
    // Affichage de la miniature
    let thumbHtml = '';
    if (p.thumb) {
      thumbHtml = `<img src="${p.thumb}" class="post-thumb" alt="Miniature">`;
    } else if (p.isPdf) {
      thumbHtml = `<div class="pdf-thumb"><span style="font-size:40px">📄</span> <span style="margin-left:10px;font-weight:bold">Document PDF</span></div>`;
    }

    // Bouton de téléchargement
    let dlBtn = '';
    if (p.fileUrl) {
      dlBtn = `<a href="${p.fileUrl}" target="_blank" download class="dl-btn">📥 Télécharger le fichier original</a>`;
    }

    return `<div class="k">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <div><b>${esc(p.n)}</b> ${badge}</div><small>${ago(p.ts)}</small>
      </div>
      <div class="post-content">${esc(p.x)}</div>
      ${thumbHtml}
      ${dlBtn}
      ${p.a==S.uid?'':`<div style="margin-top:10px;border-top:1px solid var(--l);padding-top:10px">
          <button class="tip" onclick="tip('${p.a}','${esc(p.n)}',10)">🔥 1 KC</button>
          <button class="tip" onclick="tip('${p.a}','${esc(p.n)}',50)">💎 5 KC</button>
          <button class="tip" onclick="tip('${p.a}','${esc(p.n)}',100)">👑 10 KC</button>
        </div>`}
    </div>`;
  }).join('') || '<p class="m" style="text-align:center;padding:20px">Aucune publication.</p>';

  return filterHTML + postForm + postList;
}

window.publierFirebase = async () => {
  const texte = $('#px').value.trim();
  const cat = $('#pcat').value;
  const file = $('#pimg').files[0];
  if (!texte && !file) return toast('Écris un texte ou ajoute un fichier');

  let thumb = null, fileUrl = null, isPdf = false;
  
  if (file) {
    isPdf = file.type === 'application/pdf';
    thumb = await generateThumbnail(file); // Miniature (ou null si PDF)
    const uploadRes = await uploadFile(file, false); // Pas chiffré pour le fil public
    fileUrl = uploadRes.url;
  }

  const postData = { 
    a: S.uid, n: S.me.name, x: texte, cat: cat, 
    thumb: thumb, fileUrl: fileUrl, isPdf: isPdf, ts: Date.now() 
  };
  try {
    window.FB.push(window.FB.ref(window.FB.db, 'posts'), postData);
    $('#px').value = ''; $('#pimg').value = ''; toast('Publié !');
  } catch (e) { toast('Erreur réseau'); }
};

function ecouterPosts() {
  if (!window.FB) return;
  window.FB.onChildAdded(window.FB.ref(window.FB.db, 'posts'), (snapshot) => {
    const p = snapshot.val(); if (!p) return;
    if (!S.posts) S.posts = [];
    if (!S.posts.find(x => x.ts === p.ts)) {
      S.posts.push({ id: snapshot.key, ...p });
      if (tab === 'feed') draw(); 
    }
  });
}

// ==========================================
// 2. MARCHÉ
// ==========================================
async function fMk(){
  const M = [...(S.mk||[])].filter(m => m && m.ts).sort((a,b)=>b.ts-a.ts);
  return `<div class="k">
    <h3>Mettre en vente</h3>
    <input id="mt" placeholder="Nom du produit">
    <input id="mp" type="number" step="1" placeholder="Prix en KC">
    <textarea id="md" rows="2" placeholder="Description..."></textarea>
    <input type="file" id="mimg" accept="image/*,application/pdf" style="font-size:12px;margin-bottom:5px">
    <button onclick="sell()" style="width:100%">Publier l'annonce</button>
  </div>` +
  (M.map(l=>{
    let thumbHtml = l.thumb ? `<img src="${l.thumb}" class="post-thumb">` : (l.isPdf ? `<div class="pdf-thumb"><span style="font-size:30px">📄</span> Document</div>` : '');
    let dlBtn = l.fileUrl ? `<a href="${l.fileUrl}" target="_blank" class="dl-btn">📥 Voir / Télécharger</a>` : '';
    return `<div class="k">
      <div style="display:flex;justify-content:space-between"><b>${esc(l.t)}</b> <span class="p">${kc(l.d)}</span></div>
      <small>Vendeur : ${esc(l.n)}</small>
      <p style="margin:8px 0;font-size:14px">${esc(l.x)}</p>
      ${thumbHtml}
      ${dlBtn}
      ${l.a==S.uid?'<small class="m">C\'est ton annonce</small>':`<button onclick="buy('${l.id}','${l.a}','${esc(l.t)}',${l.d})" style="margin-top:8px">Acheter</button>`}
    </div>`;
  }).join('') || '<p class="m" style="text-align:center">Aucune annonce.</p>');
}

window.sell = async () => {
  const t=$('#mt').value.trim(), p=parseFloat($('#mp').value), x=$('#md').value.trim(), file=$('#mimg').files[0];
  if(!t || !p || p<=0) return toast('Titre et prix requis');
  
  let thumb = null, fileUrl = null, isPdf = false;
  if (file) {
    isPdf = file.type === 'application/pdf';
    thumb = await generateThumbnail(file);
    const uploadRes = await uploadFile(file, false);
    fileUrl = uploadRes.url;
  }

  const d = Math.round(p*10); 
  const item = { id: R(8), a: S.uid, n: S.me.name, t, d, x, thumb, fileUrl, isPdf, ts: Date.now() };
  try {
    window.FB.push(window.FB.ref(window.FB.db, 'marketplace'), item);
    S.mk.push(item); save(); draw(); toast('Annonce publiée !');
  } catch(e) { toast('Erreur réseau'); }
}

function ecouterMarche() {
  if (!window.FB) return;
  window.FB.onChildAdded(window.FB.ref(window.FB.db, 'marketplace'), (snapshot) => {
    const l = snapshot.val(); if (!l) return;
    if (!S.mk) S.mk = [];
    if (!S.mk.find(m => m.ts === l.ts)) { S.mk.push({ id: snapshot.key, ...l }); if (tab === 'mk') draw(); }
  });
}

window.buy = async (id, sellerUid, title, price) => {
  if(confirm(`Acheter "${title}" pour ${kc(price)} ?`)) {
    const commission = Math.round(price * COMMISSION_RATE);
    const amountForSeller = price - commission;
    if(S.bal < price) return toast('Solde insuffisant');
    if(await transferKC(sellerUid, amountForSeller, 'Achat: '+title)) {
      const adminUsers = await window.FB.get(window.FB.ref(window.FB.db, 'users'));
      if(adminUsers.exists()) {
        const adminId = Object.keys(adminUsers.val()).find(k => adminUsers.val()[k].name === 'admin');
        if(adminId) await transferKC(adminId, commission, 'Commission');
      }
      toast('Achat effectué !');
    }
  }
}

// ==========================================
// 3. TUNNELS (AVEC FICHIERS CHIFFRÉS)
// ==========================================
async function fTun(){
  if(openT) return chat();
  return `
  <div class="k" style="border-left:4px solid #0d47a1">
    <h3>📚 Créer une Classe</h3>
    <input id="tn_edu" placeholder="Nom (ex: Maths 6ème)">
    <input id="tp_edu" type="password" placeholder="Clé secrète">
    <button onclick="mkT('edu')" style="width:100%;background:#0d47a1">Créer la classe</button>
  </div>
  <div class="k" style="border-left:4px solid #1b5e20">
    <h3>🛍️ Créer une Boutique</h3>
    <input id="tn_com" placeholder="Nom (ex: Boutique Mode)">
    <input id="tp_com" type="password" placeholder="Clé secrète">
    <button onclick="mkT('com')" style="width:100%;background:#1b5e20">Créer la boutique</button>
  </div>
  <div class="k">
    <h3>🔑 Rejoindre un tunnel</h3>
    <input id="ti" placeholder="ID du tunnel">
    <input id="tq" type="password" placeholder="Clé secrète">
    <button onclick="joinT()" style="width:100%">Rejoindre</button>
  </div>
  <h3 style="margin-top:20px;margin-bottom:10px">Mes Tunnels</h3>` +
  Object.entries(S.tun||{}).map(([i, t])=>{
    let icon = t.type === 'com' ? '🛍️' : '📚'; let color = t.type === 'com' ? '#1b5e20' : '#0d47a1';
    return `<div class="k" onclick="op('${i}')" style="cursor:pointer;border-left:4px solid ${color};margin-bottom:8px;padding:12px">
      <b>${icon} ${esc(t.n)}</b><br><small>ID : ${i}</small>
    </div>`;
  }).join('');
}

window.mkT = async (type) => {
  const isEdu = type === 'edu';
  const n = $(`#tn_${type}`).value.trim(), p = $(`#tp_${type}`).value;
  if(!n || !p) return toast('Nom et clé requis');
  const i = (isEdu ? 'CLS-' : 'BQT-') + R(4);
  S.tun[i] = { n: n, type: type, owner: S.uid }; 
  TK[i] = await tk(i, p); save(); toast('Créé ! ID : ' + i); op(i);
}

window.joinT = async () => {
  const i=$('#ti').value.trim().toUpperCase(), p=$('#tq').value;
  if(!i || !p) return;
  if(!S.tun[i]) S.tun[i] = { n: 'Tunnel ' + i, type: 'edu' };
  TK[i]=await tk(i,p); save(); op(i);
}

window.op = async (i) => {
  if(!TK[i]){ const p=prompt('Entrez la clé secrète'); if(!p) return; TK[i]=await tk(i,p); }
  openT=i; draw();
  if (!window.FB) return;
  window.FB.onChildAdded(window.FB.ref(window.FB.db, 'tunnels/'+i), (snap) => {
    const m = snap.val(); if(!m) return;
    if(!S.msgs) S.msgs = [];
    if(!S.msgs.find(x=>x.ts === m.ts)) { S.msgs.push({ i, ...m }); if(openT === i) draw(); }
  });
}

async function chat(){
  const i=openT, M=[], tunnelData = S.tun[i] || { n: 'Inconnu', type: 'edu' };
  for(const m of S.msgs.filter(x=>x.i==i).sort((a,b)=>a.ts-b.ts)){
    if (m.fileUrl) {
      M.push(`<div style="margin-bottom:12px;text-align:${m.n===S.me.name?'right':'left'}">
        <small style="display:block;margin-bottom:4px">${esc(m.n)} · ${new Date(m.ts).toLocaleTimeString()}</small>
        <div style="display:inline-block;padding:10px 14px;border-radius:12px;background:${m.n===S.me.name?'var(--g)':'var(--l)'};color:${m.n===S.me.name?'#fff':'var(--t)'};max-width:80%">
          <div>📄 Fichier sécurisé</div>
          <a href="${m.fileUrl}" target="_blank" class="dl-btn" style="padding:8px;font-size:12px;margin-top:5px;background:#fff;color:#000">📥 Télécharger (Chiffré)</a>
        </div>
      </div>`);
    } else {
      const t = await dec(TK[i], m.c);
      M.push(`<div style="margin-bottom:12px;text-align:${m.n===S.me.name?'right':'left'}">
        <small style="display:block;margin-bottom:4px">${esc(m.n)} · ${new Date(m.ts).toLocaleTimeString()}</small>
        <div style="display:inline-block;padding:10px 14px;border-radius:12px;background:${m.n===S.me.name?'var(--g)':'var(--l)'};color:${m.n===S.me.name?'#fff':'var(--t)'};max-width:80%">
          ${t==null?'<i class="m">🔒 Clé incorrecte</i>':esc(t)}
        </div>
      </div>`);
    }
  }
  const inviteTxt = encodeURIComponent(`Salut ! Rejoins mon espace "${tunnelData.n}" sur Mbolo. L'ID est : ${i}.`);
  return `<div class="k" style="height:70vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <button class="s" onclick="go('tun')">← Retour</button><b style="align-self:center">${esc(tunnelData.n)}</b><div></div>
    </div>
    <a href="https://wa.me/?text=${inviteTxt}" target="_blank" style="text-decoration:none"><button class="wa" style="background:#128C7E">📤 Inviter par WhatsApp</button></a>
    
    <div style="flex:1;overflow-y:auto;padding-right:5px;margin-top:10px" id="chat-box">${M.join('') || '<p class="m" style="text-align:center;margin-top:20px">Début de la conversation.</p>'}</div>
    
    <div style="margin-top:10px;background:var(--bg);padding:10px;border-radius:10px;border:1px solid var(--l)">
      <input type="file" id="tfile" accept="image/*,application/pdf" style="font-size:12px;margin-bottom:8px">
      <div style="display:flex;gap:8px">
        <input id="cm" placeholder="Message..." style="margin:0" onkeypress="if(event.key==='Enter')snd()">
        <button onclick="snd()" style="margin:0;padding:10px 16px">Envoyer</button>
      </div>
    </div>
  </div>`;
}

window.snd = async () => {
  const t=$('#cm').value.trim(); 
  const file = $('#tfile').files[0];
  if(!t && !file) return;

  if (file) {
    // Si c'est un fichier, on le chiffre !
    const uploadRes = await uploadFile(file, true);
    if(uploadRes.url) {
      const m = { ts: Date.now(), n: S.me.name, fileUrl: uploadRes.url };
      window.FB.push(window.FB.ref(window.FB.db, 'tunnels/'+openT), m);
      if(!S.msgs.find(x=>x.ts === m.ts)) { S.msgs.push({ i: openT, ...m }); draw(); }
    }
    $('#tfile').value = '';
  } else {
    // Texte normal
    const c = await enc(TK[openT], t);
    const m = { ts: Date.now(), n: S.me.name, c };
    window.FB.push(window.FB.ref(window.FB.db, 'tunnels/'+openT), m);
    $('#cm').value='';
    if(!S.msgs.find(x=>x.ts === m.ts)) { S.msgs.push({ i: openT, ...m }); draw(); }
  }
  setTimeout(()=>{const cb=$('#chat-box'); if(cb)cb.scrollTop=cb.scrollHeight;},100);
}

// ==========================================
// 4. WALLET
// ==========================================
async function fW(){
  const buyLink = `https://wa.me/${AIRTEL_NUMBER}?text=${encodeURIComponent(`Bonjour Admin Mbolo, je souhaite acheter des KC. Mon ID est : ${S.me.id}. Montant FCFA envoyé : `)}`;
  return `<div class="k" style="text-align:center;background:var(--g);color:#fff;padding:30px 16px">
    <h2 style="margin:0;font-size:36px">${kc(S.bal)}</h2>
    <small style="color:rgba(255,255,255,0.8)">≈ ${fc(S.bal)}</small>
  </div>
  <div class="k" style="border-left:4px solid var(--y)">
    <h3>🛒 Acheter des KC</h3>
    <p class="m" style="margin-bottom:10px">1 KC = 100 FCFA. Envoyez par Airtel Money au <b>${AIRTEL_NUMBER}</b>, puis cliquez sur WhatsApp.</p>
    <a href="${buyLink}" target="_blank" style="text-decoration:none"><button class="wa">💬 Envoyer la demande (WhatsApp)</button></a>
  </div>
  <div class="k">
    <h3>Envoyer des KC</h3>
    <input id="wt" placeholder="ID destinataire (ex: ABCD12)">
    <input id="wd" type="number" step="0.1" placeholder="Montant en KC">
    <button onclick="sendUser()" style="width:100%">Envoyer</button>
  </div>
  <div class="k">
    <h3>Mon ID Mbolo (Parrainage)</h3>
    <p class="m" style="margin-bottom:5px">Partage ton code pour gagner des KC :</p>
    <textarea readonly rows="1" onclick="this.select()" style="font-size:14px;text-align:center;font-weight:bold">${S.uid}</textarea>
    <button class="s" onclick="navigator.clipboard&&navigator.clipboard.writeText('${S.uid}');toast('Copié')" style="width:100%">Copier mon code</button>
  </div>
  <div class="k">
    <h3>Historique local</h3>
    ${(S.led||[]).filter(l=>l && l.ts).map(l=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:8px 0">
      <small>${ago(l.ts)}<br>${esc(l.m)}</small> <b class="${l.d>0?'p':'n'}" style="align-self:center">${l.d>0?'+':''}${kc(l.d)}</b>
    </div>`).join('') || '<small class="m">Aucun mouvement.</small>'}
  </div>
  <button class="danger" onclick="window.FB.signOut(window.FB.auth)" style="width:100%;margin-top:20px">Se déconnecter</button>`;
}

window.sendUser = async () => {
  const to=$('#wt').value.trim().toUpperCase(), d=Math.round(parseFloat($('#wd').value)*10);
  if(!to || !d || d<=0) return toast('ID et montant valides requis');
  if(to === S.me.id) return toast('Tu ne peux pas t\'envoyer des KC');
  const snap = await window.FB.get(window.FB.ref(window.FB.db, 'users'));
  let targetUid = null;
  if(snap.exists()){
    const users = snap.val();
    targetUid = Object.keys(users).find(k => k.substring(0,6).toUpperCase() === to);
  }
  if(!targetUid) return toast('Destinataire introuvable');
  if(await transferKC(targetUid, d, 'Transfert privé')){ toast('Envoi réussi !'); draw(); }
}

// ==========================================
// 5. CONTACT / ANNUAIRE
// ==========================================
async function fContact(){
  const D = [...(S.directory||[])].sort((a,b)=>b.ts-a.ts);
  const registerForm = `<div class="k">
    <h3>📇 S'enregistrer</h3>
    <input id="dn" placeholder="Nom / Boutique">
    <select id="dcat"><option value="edu">📚 Enseignant</option><option value="com">🛍️ Commerçant</option></select>
    <input id="dqu" placeholder="Quartier / Ville">
    <input id="dwa" type="tel" placeholder="Numéro WhatsApp">
    <button onclick="registerDir()" style="width:100%">Publier ma carte</button>
  </div>`;
  const contactList = D.map(c => {
    let badge = c.cat === 'edu' ? '<span class="badge-edu">📚 Prof</span>' : '<span class="badge-com">🛍️ Commerce</span>';
    let cleanWa = c.wa ? c.wa.replace(/\D/g,'') : '';
    let waBtn = cleanWa ? `<a href="https://wa.me/${cleanWa}" target="_blank" style="text-decoration:none"><button class="wa">💬 WhatsApp</button></a>` : '';
    return `<div class="k"><b>${esc(c.n)}</b> ${badge}<br><small>📍 ${esc(c.qu)}</small>${waBtn}</div>`;
  }).join('') || '<p class="m" style="text-align:center">Annuaire vide.</p>';
  return registerForm + `<h3 style="margin-top:20px;margin-bottom:10px">Annuaire</h3>` + contactList;
}

window.registerDir = async () => {
  const n = $('#dn').value.trim(), cat = $('#dcat').value, qu = $('#dqu').value.trim(), wa = $('#dwa').value.trim();
  if(!n || !wa) return toast('Nom et WhatsApp requis');
  const item = { a: S.uid, n: n, cat: cat, qu: qu, wa: wa, ts: Date.now() };
  try {
    window.FB.push(window.FB.ref(window.FB.db, 'directory'), item);
    S.directory.push(item); save(); draw(); toast('Inscrit !');
  } catch(e) { toast('Erreur réseau'); }
}

function ecouterAnnuaire() {
  if (!window.FB) return;
  window.FB.onChildAdded(window.FB.ref(window.FB.db, 'directory'), (snapshot) => {
    const item = snapshot.val(); if (!item) return;
    if (!S.directory) S.directory = [];
    if (!S.directory.find(d => d.ts === item.ts)) { S.directory.push(item); if (tab === 'contact') draw(); }
  });
}

// ==========================================
// 6. ADMIN
// ==========================================
async function fAdm(){
  if(S.me.name !== 'admin') return '<div class="k"><h3>Accès refusé</h3></div>';
  return `<div class="k"><h3>🛡️ Dashboard Admin</h3><div id="admin-recharges"><p class="m">Chargement...</p></div></div>`;
}

async function loadAdminRecharges() {
  if(!window.FB) return;
  window.FB.onValue(window.FB.ref(window.FB.db, 'recharges'), (snap) => {
    const data = snap.val(); const container = $('#admin-recharges');
    if(!container) return;
    if(!data) { container.innerHTML = '<p class="m">Aucune demande.</p>'; return; }
    const reqs = Object.keys(data).map(k => ({ key: k, ...data[k] })).filter(r => r.status === 'pending');
    if(reqs.length === 0) { container.innerHTML = '<p class="m">Aucune demande.</p>'; return; }
    container.innerHTML = reqs.map(r => `
      <div class="k" style="border:1px solid var(--y)">
        <b>Client : ${esc(r.name)}</b><br><small>ID : ${r.userId.substring(0,6).toUpperCase()}</small><br>
        <small>${r.amountFCFA} FCFA (${r.amountKC/10} KC)</small><br><small>${ago(r.ts)}</small>
        <div style="margin-top:10px">
          <button onclick="validateRecharge('${r.key}', '${r.userId}', ${r.amountKC})" style="background:var(--g)">✅ Valider</button>
          <button onclick="rejectRecharge('${r.key}')" class="danger">❌ Refuser</button>
        </div>
      </div>
    `).join('');
  });
}

window.validateRecharge = async (reqKey, userId, amountKC) => {
  if(!confirm(`Créditer ${amountKC/10} KC ?`)) return;
  await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + userId), (curr) => {
    if(curr) curr.bal = (curr.bal || 0) + amountKC;
    return curr;
  });
  await window.FB.update(window.FB.ref(window.FB.db, 'recharges/' + reqKey), { status: 'validated' });
  toast('Recharge validée !');
}

window.rejectRecharge = async (reqKey) => {
  await window.FB.update(window.FB.ref(window.FB.db, 'recharges/' + reqKey), { status: 'rejected' });
  toast('Refusé.');
}

const originalDraw = draw;
window.draw = async function() {
  await originalDraw();
  if(tab === 'adm') loadAdminRecharges();
}

// ==========================================
// LANCEMENT
// ==========================================
draw();
setTimeout(() => { ecouterPosts(); ecouterMarche(); ecouterAnnuaire(); }, 1000);

</script>
