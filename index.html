<style>

body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);padding-bottom:80px}

main{padding:16px;max-width:640px;margin:auto}

input:focus,textarea:focus{border-color:var(--g)}
button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;margin:4px 4px 4px 0;cursor:pointer;box-shadow:0 2px 5px rgba(11,107,58,0.3);transition:transform 0.1s}

<header><b>🥁 Mbolo V12</b><span id="bl">0.0 KC</span></header>
<main id="v"></main>
<div id="to"></div>
<nav id="nv"></nav>

<script type="module">
const E=new TextEncoder(),$=s=>document.querySelector(s),R=n=>Math.random().toString(36).slice(2,2+n).toUpperCase();
const AL={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'},DAY=864e5;

const AIRTEL_NUMBER = '24177765496';
const COMMISSION_RATE = 0.03;

const CLOUDINARY_CLOUD_NAME = "vmqquxa8"; 
const CLOUDINARY_PRESET = "mbolo_preset";

let S; try{S=JSON.parse(localStorage.mtt)}catch(e){}
S=S||{me:null,uid:null,code:null,bal:0,isAdmin:false,isMod:false,isSuspended:false,suspendWhy:'',freeze:false,posts:[],mk:[],directory:[]};

if(!S.posts) S.posts = [];
if(!S.mk) S.mk = [];
if(!S.directory) S.directory = [];

const save=()=>{try{localStorage.mtt=JSON.stringify(S)}catch(e){toast('Sauvegarde impossible')}};

const kc=d=>(d/10).toFixed(1)+' KC',fc=d=>(d*10).toLocaleString('fr')+' FCFA';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>new Date(t).toLocaleString('fr',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const t=$('#to');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}

const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tk(tid,pw){const m=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:E.encode(tid),iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(k,t){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,E.encode(t)))}
async function dec(k,c){try{const[a,b]=c.split('.');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(a)},k,ub(b)))}catch(e){return null}}

const TK={}; let tab='feed', openT=null, feedFilter='all';
let TABS=[['feed','🌐','Fil'],['mk','🏪','Marché'],['tun','🔒','Tunnels'],['w','💰','Wallet'],['contact','📞','Contact']];

async function uploadFile(file) {
  if (!file) return null;
  toast('Envoi de l\'image...');
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_PRESET);

  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: 'POST', body: formData
    });
    const data = await res.json();
    return data.secure_url;
  } catch (e) { toast('Erreur image'); return null; }
}

function nav(){
  TABS = [['feed','🌐','Fil'],['mk','🏪','Marché'],['tun','🔒','Tunnels'],['w','💰','Wallet'],['contact','📞','Contact']];
  if(S.isAdmin || S.isMod) { TABS.push(['adm','🛡️','Admin']); }
  $('#nv').innerHTML=TABS.map(t=>`<a class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</a>`).join('');
  $('#bl').textContent=kc(S.bal);
}
window.go = t => {tab=t;openT=null;draw()};
window.setFilter = f => {feedFilter=f; draw()};

let authMode = 'login', authMsg = { type: '', text: '' };

window.switchAuthTab = (mode) => { authMode = mode; authMsg = { type: '', text: '' }; draw(); };

async function fAuth(){
  let msgHtml = authMsg.text ? `<div class="msg-box ${authMsg.type === 'success' ? 'msg-success' : 'msg-error'}">${authMsg.text}</div>` : '';
  const isLogin = authMode === 'login';

  return `<div class="k" style="padding:20px">
    <h2 style="color:var(--g);text-align:center;margin-bottom:20px">Mbolo V12</h2>
    <div class="auth-tabs">
      <button class="${isLogin ? 'active' : ''}" onclick="switchAuthTab('login')">Se connecter</button>
      <button class="${!isLogin ? 'active' : ''}" onclick="switchAuthTab('register')">Créer un compte</button>
    </div>
    ${msgHtml}
    <input id="authUser" placeholder="Pseudo (lettres/chiffres, 3-20 car.)">
    <input id="authPass" type="password" placeholder="Mot de passe (6 car. min)">
    ${!isLogin ? `
      <label style="display:flex;align-items:flex-start;margin-top:10px;font-size:13px">
        <input type="checkbox" id="tosCheck" style="width:auto;margin-right:8px;margin-top:3px">
        <span>J'accepte les Conditions d'Utilisation et la charte de bonne conduite de Mbolo.</span>
      </label>
    ` : ''}
    <button id="btnLogin" onclick="loginUser()" style="width:100%;margin-top:15px">${isLogin ? 'Se connecter' : 'Créer mon compte'}</button>
  </div>`;
}

window.loginUser = async () => {
  const pseudo = $('#authUser').value.trim().toLowerCase();
  const pass = $('#authPass').value;
  const btn = $('#btnLogin');
  const isLogin = authMode === 'login';
  
  if(!pseudo.match(/^[a-z0-9_]{3,20}$/)) return toast('Pseudo invalide (3-20 car.)');
  if(pass.length < 6) return toast('Mot de passe trop court');
  if(!isLogin && !$('#tosCheck').checked) return toast('Tu dois accepter les conditions d\'utilisation');
  
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Chargement...';
  const email = `${pseudo}@mbolo.app`;

  try {
    if(!isLogin) {
      const userCred = await window.FB.createUserWithEmailAndPassword(window.FB.auth, email, pass);
      const uid = userCred.user.uid;
      const code = R(6);
      
      // Création du profil avec les champs requis par les règles (dont 'tos')
      await window.FB.set(window.FB.ref(window.FB.db, 'users/' + uid), { 
        name: pseudo, code: code, bal: 0, joined: Date.now(), tos: Date.now() 
      });
      await window.FB.set(window.FB.ref(window.FB.db, 'ids/' + code), uid);
      
      authMsg = { type: 'success', text: 'Compte créé ! Ton code : ' + code };
    } else {
      await window.FB.signInWithEmailAndPassword(window.FB.auth, email, pass);
    }
  } catch (error) {
    btn.disabled = false; btn.textContent = isLogin ? 'Se connecter' : 'Créer mon compte';
    authMsg = { type: 'error', text: error.code || error.message }; draw();
  }
};

window.FB.onAuthStateChanged(window.FB.auth, async (user) => {
  if(user) {
    S.uid = user.uid;
    
    // Vérification du statut Admin / Modo / Suspendu / Gel
    const adminSnap = await window.FB.get(window.FB.ref(window.FB.db, 'admins/' + user.uid));
    const modSnap = await window.FB.get(window.FB.ref(window.FB.db, 'moderators/' + user.uid));
    const suspSnap = await window.FB.get(window.FB.ref(window.FB.db, 'suspended/' + user.uid));
    const configSnap = await window.FB.get(window.FB.ref(window.FB.db, 'config/freeze'));

    S.isAdmin = adminSnap.exists() && adminSnap.val() === true;
    S.isMod = modSnap.exists();
    S.isSuspended = suspSnap.exists();
    S.suspendWhy = S.isSuspended ? suspSnap.val().why : '';
    S.freeze = configSnap.val() === true;

    const snap = await window.FB.get(window.FB.ref(window.FB.db, 'users/' + user.uid));
    if(snap.exists()) {
      const data = snap.val();
      S.me = { name: data.name };
      S.code = data.code;
      
      window.FB.onValue(window.FB.ref(window.FB.db, 'users/' + user.uid + '/bal'), (balSnap) => {
        S.bal = balSnap.val() || 0;
        $('#bl').textContent = kc(S.bal);
        save();
        if(tab === 'w') draw();
      });
    }
    
    S.posts = []; S.mk = []; S.directory = [];
    save(); draw();
    ecouterPosts(); ecouterMarche(); ecouterAnnuaire();
    
    if(S.isAdmin || S.isMod) attachAdminListeners();
  } else {
    S.me = null; S.uid = null; S.isAdmin = false; S.isMod = false; S.isSuspended = false; S.freeze = false;
    S.posts = []; S.mk = []; S.directory = []; save(); draw();
  }
});

async function draw(){
  try {
    nav(); const v=$('#v');
    
    // Écran de suspension
    if(S.isSuspended) {
      v.innerHTML = `<div class="suspend-screen">
        <h2 style="font-size:40px">🚫</h2>
        <h2>Compte Suspendu</h2>
        <p>Motif : <strong>${esc(S.suspendWhy)}</strong></p>
        <p class="m" style="color:#ffcdd2">Contacte l'administrateur pour plus d'informations.</p>
        <button class="danger" onclick="window.FB.signOut(window.FB.auth)" style="margin-top:20px;background:white;color:var(--danger)">Se déconnecter</button>
      </div>`;
      return;
    }

    if(!S.me){ v.innerHTML = await fAuth(); return; }
    v.innerHTML=await({feed:fFeed,mk:fMk,tun:fTun,w:fW,contact:fContact,adm:fAdm}[tab])();
    
    if(tab === 'adm' && (S.isAdmin || S.isMod)) attachAdminListeners();
  } catch (error) {
    $('#v').innerHTML = `<div class="k" style="text-align:center;border:2px solid var(--danger)">
      <h3 style="color:var(--danger)">⚠️ Erreur</h3>
      <div style="font-size:12px;background:#ffebee;color:#b71c1c;padding:10px;border-radius:8px;margin:10px 0;">${error.message}</div>
      <button class="danger" onclick="window.FB.signOut(window.FB.auth)">Se déconnecter</button>
    </div>`;
  }
}

// --- SYSTEME DE SIGNALEMENT ---
window.reportContent = async (kind, refId) => {
  const why = prompt("Pourquoi signalez-vous ce contenu ? (Soyez précis)");
  if(!why || why.length < 3) return toast('Motif trop court');
  
  try {
    await window.FB.push(window.FB.ref(window.FB.db, 'reports'), {
      by: S.uid, kind: kind, ref: refId, why: why, s: 'open', ts: Date.now()
    });
    toast('Signalement transmis aux modérateurs.');
  } catch(e) { toast('Erreur'); }
}

// ==========================================
// 1. FIL D'ACTUALITÉ
// ==========================================
async function fFeed(){
  let P=[...(S.posts||[])].filter(p => p && p.ts);
  if (feedFilter === 'edu') P = P.filter(p => p.cat === 'edu');
  if (feedFilter === 'com') P = P.filter(p => p.cat === 'com');
  P.sort((a,b)=>b.ts-a.ts);

  const filterHTML = `<div class="filters">
      <button class="${feedFilter==='all'?'on':'s'}" onclick="setFilter('all')">Tout</button>
      <button class="${feedFilter==='edu'?'on':'s'}" onclick="setFilter('edu')">📚 Éducation</button>
      <button class="${feedFilter==='com'?'on':'s'}" onclick="setFilter('com')">🛍️ Commerce</button>
    </div>`;

  const postForm = !S.freeze ? `<div class="k">
    <textarea id="px" rows="2" placeholder="Partage une info..." maxlength="1000"></textarea>
    <input type="file" id="pimg" accept="image/*" style="font-size:12px;margin-bottom:5px">
    <select id="pcat" style="margin-bottom:8px">
      <option value="gen">Discussion Générale</option>
      <option value="edu">📚 Éducation / Cours</option>
      <option value="com">🛍️ Commerce / Promo</option>
      ${S.isAdmin ? `<option value="ann">📢 Annonce Officielle</option>` : ''}
    </select>
    <button onclick="publierFirebase()" style="width:100%">🚀 Publier</button>
  </div>` : '<div class="k" style="text-align:center;color:var(--danger)">Le réseau est actuellement gelé par l'administration.</div>';

  const postList = P.map(p=>{
    let badge = p.cat === 'edu' ? '<span class="badge-edu">📚 Éducation</span>' : (p.cat === 'com' ? '<span class="badge-com">🛍️ Commerce</span>' : (p.cat === 'ann' ? '<span class="badge-edu" style="background:#fcd116;color:#000">📢 Officiel</span>' : ''));
    let thumbHtml = p.thumb ? `<img src="${p.thumb}" class="post-thumb">` : '';
    let delBtn = (p.a === S.uid || S.isAdmin || S.isMod) ? `<button class="s" onclick="deletePost('${p.id}')" style="color:var(--danger)">🗑️ Supprimer</button>` : '';
    let repBtn = (p.a !== S.uid) ? `<button class="report-btn" onclick="reportContent('post', '${p.id}')">🚩 Signaler</button>` : '';

    return `<div class="k">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <div><b>${esc(p.n)}</b> ${badge}</div><small>${ago(p.ts)}</small>
      </div>
      <div class="post-content">${esc(p.x)}</div>
      ${thumbHtml}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <div>${delBtn}</div>
        <div>${repBtn}</div>
      </div>
    </div>`;
  }).join('') || '<p class="m" style="text-align:center;padding:20px">Aucune publication.</p>';

  return filterHTML + postForm + postList;
}

window.publierFirebase = async () => {
  if(S.freeze) return;
  const texte = $('#px').value.trim(), cat = $('#pcat').value, file = $('#pimg').files[0];
  if (!texte && !file) return toast('Écris quelque chose');
  
  let imgUrl = null;
  if (file) imgUrl = await uploadFile(file);

  const postData = { a: S.uid, n: S.me.name, x: texte, cat: cat, thumb: imgUrl, ts: Date.now() };
  try {
    window.FB.push(window.FB.ref(window.FB.db, 'posts'), postData);
    $('#px').value = ''; $('#pimg').value = ''; toast('Publié !');
  } catch (e) { toast('Erreur réseau'); }
};

window.deletePost = async (id) => {
  if(!confirm("Supprimer cette publication ?")) return;
  await window.FB.remove(window.FB.ref(window.FB.db, 'posts/' + id));
  toast('Supprimé');
}

function ecouterPosts() {
  const q = window.FB.query(window.FB.ref(window.FB.db, 'posts'), window.FB.limitToLast(30));
  window.FB.onValue(q, (snapshot) => {
    const data = snapshot.val(); S.posts = [];
    if(data) Object.keys(data).forEach(key => S.posts.push({ id: key, ...data[key] }));
    save(); if (tab === 'feed') draw(); 
  });
}

// ==========================================
// 2. MARCHÉ (Prix minimum 5 KC)
// ==========================================
async function fMk(){
  const M = [...(S.mk||[])].filter(m => m && m.ts).sort((a,b)=>b.ts-a.ts);
  const form = !S.freeze ? `<div class="k">
    <h3>Mettre en vente</h3>
    <input id="mt" placeholder="Nom du produit" maxlength="60">
    <input id="mp" type="number" step="1" min="5" placeholder="Prix en KC (Minimum 5 KC)">
    <textarea id="md" rows="2" placeholder="Description..." maxlength="500"></textarea>
    <input type="file" id="mimg" accept="image/*" style="font-size:12px;margin-bottom:5px">
    <button onclick="sell()" style="width:100%">Publier l'annonce</button>
  </div>` : '';

  return form +
  (M.map(l=>{
    let thumbHtml = l.thumb ? `<img src="${l.thumb}" class="post-thumb">` : '';
    let delBtn = (l.a === S.uid || S.isAdmin || S.isMod) ? `<button class="s" onclick="deleteMk('${l.id}')" style="color:var(--danger)">🗑️ Retirer</button>` : `<button onclick="buy('${l.id}','${l.a}','${esc(l.t)}',${l.d})">Acheter</button>`;
    return `<div class="k">
      <div style="display:flex;justify-content:space-between"><b>${esc(l.t)}</b> <span class="p">${kc(l.d)}</span></div>

}

window.sell = async () => {

  if(!t || !p || p < 5) return toast('Titre et prix valide requis (Min 5 KC)');

    window.FB.push(window.FB.ref(window.FB.db, 'marketplace'), item);

window.deleteMk = async (id) => {
  if(!confirm("Retirer cette annonce ?")) return;
  await window.FB.remove(window.FB.ref(window.FB.db, 'marketplace/' + id));
  toast('Retiré');
}

function ecouterMarche() {
  const q = window.FB.query(window.FB.ref(window.FB.db, 'marketplace'), window.FB.limitToLast(30));
  window.FB.onValue(q, (snapshot) => {
    const data = snapshot.val(); S.mk = [];
    if(data) Object.keys(data).forEach(key => S.mk.push({ id: key, ...data[key] }));

window.buy = async (id, sellerUid, title, price) => {
  if(S.freeze) return toast('Le système est gelé');
  if(confirm(`Acheter "${title}" pour ${kc(price)} ?`)) {
    try {

      });

// 3. TUNNELS
// ==========================================
async function fTun(){
  if(openT) return chat();
  return `
  <div class="k" style="border-left:4px solid #0d47a1">
    <h3>📚 Créer une Classe</h3>
    <input id="tn_edu" placeholder="Nom (ex: Maths 6ème)">
    <input id="tp_edu" type="password" placeholder="Clé secrète">
    <button onclick="mkT('edu')" style="width:100%;background:#0d47a1">Créer la classe</button>
  </div>
  <div class="k" style="border-left:4px solid #1b5e20">
    <h3>🛍️ Créer une Boutique</h3>
    <input id="tn_com" placeholder="Nom (ex: Boutique Mode)">
    <input id="tp_com" type="password" placeholder="Clé secrète">
    <button onclick="mkT('com')" style="width:100%;background:#1b5e20">Créer la boutique</button>
  </div>
  <div class="k">
    <h3>🔑 Rejoindre un tunnel</h3>
    <input id="ti" placeholder="ID du tunnel (ex: CLS-AB12)">
    <input id="tq" type="password" placeholder="Clé secrète">
    <button onclick="joinT()" style="width:100%">Rejoindre</button>
  </div>
  <h3 style="margin-top:20px;margin-bottom:10px">Mes Tunnels</h3>` +
  Object.entries(S.tun||{}).map(([i, t])=>{
    let icon = t.type === 'com' ? '🛍️' : '📚'; let color = t.type === 'com' ? '#1b5e20' : '#0d47a1';
    return `<div class="k" onclick="op('${i}')" style="cursor:pointer;border-left:4px solid ${color};margin-bottom:8px;padding:12px">
      <b>${icon} ${esc(t.n)}</b><br><small>ID : ${i}</small>
    </div>`;
  }).join('');
}

window.mkT = async (type) => {
  const n = $(`#tn_${type}`).value.trim(), p = $(`#tp_${type}`).value;
  if(!n || !p) return toast('Nom et clé requis');
  const i = (type === 'edu' ? 'CLS-' : 'BQT-') + R(4);
  S.tun[i] = { n: n, type: type }; 
  TK[i] = await tk(i, p); save(); toast('Créé ! ID : ' + i); op(i);
}

window.joinT = async () => {
  const i=$('#ti').value.trim().toUpperCase(), p=$('#tq').value;
  if(!i || !p) return;
  if(!S.tun[i]) S.tun[i] = { n: 'Tunnel ' + i, type: 'edu' };
  TK[i]=await tk(i,p); save(); op(i);
}

window.op = async (i) => {
  if(!TK[i]){ const p=prompt('Entrez la clé secrète'); if(!p) return; TK[i]=await tk(i,p); }
  openT=i; draw();
  window.FB.onChildAdded(window.FB.ref(window.FB.db, 'tunnels/'+i), (snap) => {
    const m = snap.val(); if(!m) return;
    if(!S.msgs) S.msgs = [];
    if(!S.msgs.find(x=>x.ts === m.ts)) { S.msgs.push({ id: snap.key, i, ...m }); if(openT === i) draw(); }
  });
}

async function chat(){
  const i=openT, M=[], tunnelData = S.tun[i] || { n: 'Inconnu', type: 'edu' };
  for(const m of S.msgs.filter(x=>x.i==i).sort((a,b)=>a.ts-b.ts)){
    const t = await dec(TK[i], m.c);
    const delBtn = (m.n === S.me.name || S.isAdmin || S.isMod) ? `<button class="report-btn" onclick="delMsg('${i}','${m.ts}')" style="color:#fff">🗑️</button>` : '';
    M.push(`<div style="margin-bottom:12px;text-align:${m.n===S.me.name?'right':'left'}">
      <small style="display:block;margin-bottom:4px">${esc(m.n)} · ${new Date(m.ts).toLocaleTimeString()} ${delBtn}</small>
      <div style="display:inline-block;padding:10px 14px;border-radius:12px;background:${m.n===S.me.name?'var(--g)':'var(--l)'};color:${m.n===S.me.name?'#fff':'var(--t)'};max-width:80%">
        ${t==null?'<i class="m">🔒 Clé incorrecte</i>':esc(t)}
      </div>
    </div>`);
  }
  return `<div class="k" style="height:70vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <button class="s" onclick="go('tun')">← Retour</button><b style="align-self:center">${esc(tunnelData.n)}</b><div></div>
    </div>
    <div style="flex:1;overflow-y:auto;padding-right:5px;margin-top:10px" id="chat-box">${M.join('') || '<p class="m" style="text-align:center">Début de la conversation.</p>'}</div>
    <div style="display:flex;margin-top:10px;gap:8px">
      <input id="cm" placeholder="Message..." style="margin:0" onkeypress="if(event.key==='Enter')snd()">
      <button onclick="snd()" style="margin:0;padding:10px 16px">Envoyer</button>
    </div>
  </div>`;
}

window.delMsg = async (tid, ts) => {
  if(!confirm("Supprimer ce message ?")) return;
  const snap = await window.FB.get(window.FB.ref(window.FB.db, 'tunnels/'+tid));
  const msgs = snap.val();
  for(let k in msgs){ if(msgs[k].ts == ts) { await window.FB.remove(window.FB.ref(window.FB.db, 'tunnels/'+tid+'/'+k)); break; } }
  toast('Message supprimé');
}

window.snd = async () => {
  const t=$('#cm').value.trim(); if(!t)return;
  const c = await enc(TK[openT], t);
  const m = { ts: Date.now(), n: S.me.name, c };
  window.FB.push(window.FB.ref(window.FB.db, 'tunnels/'+openT), m);
  $('#cm').value='';
  setTimeout(()=>{const cb=$('#chat-box'); if(cb)cb.scrollTop=cb.scrollHeight;},100);
}

// 4. WALLET (Gelé si config.freeze)
// ==========================================
async function fW(){
  const buyLink = `https://wa.me/${AIRTEL_NUMBER}?text=${encodeURIComponent(`Bonjour Admin Mbolo, je souhaite acheter des KC. Mon Code est : ${S.code}.`)}`;
  const freezeMsg = S.freeze ? '<div class="k" style="background:#ffebee;color:#b71c1c;text-align:center;font-weight:bold">⚠️ Transactions suspendues temporairement par l\'administration.</div>' : '';

  return freezeMsg + `<div class="k" style="text-align:center;background:var(--g);color:#fff;padding:30px 16px">
    <h2 style="margin:0;font-size:36px">${kc(S.bal)}</h2>
    <small style="color:rgba(255,255,255,0.8)">≈ ${fc(S.bal)}</small>
    <button class="s" onclick="refreshBalance()" style="margin-top:15px;background:rgba(255,255,255,0.2);color:#fff;border:1px solid #fff">🔄 Rafraîchir</button>
  </div>
  <div class="k" style="border-left:4px solid var(--y)">
    <h3>🛒 Acheter des KC</h3>
    <a href="${buyLink}" target="_blank" style="text-decoration:none"><button class="wa" ${S.freeze?'disabled':''}>💬 Envoyer la demande (WhatsApp)</button></a>

      <button class="s" onclick="requestRecharge()" style="width:100%" ${S.freeze?'disabled':''}>Déclarer la recharge</button>
    </div>
  </div>
  <div class="k">
    <h3>Demander un transfert</h3>
    <input id="wt" placeholder="Code ami (6 car.)" ${S.freeze?'disabled':''}>

  </div>
  <div class="k">
    <h3>Mon Code Mbolo</h3>
    <textarea readonly rows="1" onclick="this.select()" style="font-weight:bold;text-align:center">${S.code}</textarea>
  </div>
  <button class="danger" onclick="window.FB.signOut(window.FB.auth)" style="width:100%;margin-top:20px">Se déconnecter</button>`;

window.requestRecharge = async () => {
  if(S.freeze) return;
  const amt = parseInt($('#reqAmt').value);
  if(!amt || amt < 500 || amt % 10 !== 0) return toast('Montant invalide');
  await window.FB.push(window.FB.ref(window.FB.db, 'recharges'), { uid: S.uid, name: S.me.name, amountFCFA: amt, amountKC: amt/10, status: 'pending', ts: Date.now() });
  toast('Demande envoyée.');
}

window.requestTransfer = async () => {
  if(S.freeze) return;
  const to=$('#wt').value.trim().toUpperCase(), d=Math.round(parseFloat($('#wd').value)*10);
  if(!to.match(/^[A-Z0-9]{6}$/)) return toast('Code invalide');
  if(d > S.bal) return toast('Solde insuffisant');
  
  await window.FB.push(window.FB.ref(window.FB.db, 'transfer_requests'), {
    t: 'tr', f: S.uid, fn: S.me.name, to: to, a: d, m: 'Transfert', s: 'p', ts: Date.now()
  });
  toast('Demande envoyée.');
}

    <h3>📇 Ma Carte de visite</h3>

window.registerDir = async () => {

  if(!n || wa.length < 8) return toast('Champs invalides');

    await window.FB.set(window.FB.ref(window.FB.db, 'directory/' + S.uid), item);
    toast('Carte publiée !');
  } catch(e) { toast('Erreur'); }
}

function ecouterAnnuaire() {
  window.FB.onValue(window.FB.ref(window.FB.db, 'directory'), (snapshot) => {
    const data = snapshot.val(); S.directory = [];
    if(data) Object.keys(data).forEach(key => S.directory.push(data[key]));
    save(); if (tab === 'contact') draw();
  });

// ==========================================
// 6. ADMIN / MODERATION (Tableau de bord complet)
// ==========================================
let isAdminListenerAttached = false;

function attachAdminListeners() {
  if(isAdminListenerAttached) return;
  isAdminListenerAttached = true;

  // 1. Recharges
  window.FB.onValue(window.FB.ref(window.FB.db, 'recharges'), (snap) => {
    const data = snap.val(); const c = $('#adm-recharges'); if(!c) return;
    if(!data) { c.innerHTML = '<p class="m">Aucune demande.</p>'; return; }
    const reqs = Object.keys(data).map(k => ({ key: k, ...data[k] })).filter(r => r.status === 'pending');
    if(!reqs.length) { c.innerHTML = '<p class="m">Aucune demande.</p>'; return; }
    
    c.innerHTML = reqs.map(r => `
      <div class="k" style="border:1px solid var(--y);padding:10px">
        <b>${esc(r.name)}</b> - ${r.amountFCFA} FCFA<br>
        <button onclick="validateRecharge('${r.key}', '${r.uid}', ${r.amountKC}, this)" class="s" style="background:var(--g);color:#fff">✅ Valider</button>
        <button onclick="rejectRecharge('${r.key}')" class="danger">❌</button>
      </div>`).join('');
  });

  // 2. Transferts
  window.FB.onValue(window.FB.ref(window.FB.db, 'transfer_requests'), (snap) => {
    const data = snap.val(); const c = $('#adm-transfers'); if(!c) return;
    if(!data) { c.innerHTML = '<p class="m">Aucune demande.</p>'; return; }
    const reqs = Object.keys(data).map(k => ({ key: k, ...data[k] })).filter(r => r.s === 'p');
    if(!reqs.length) { c.innerHTML = '<p class="m">Aucune demande.</p>'; return; }
    
    c.innerHTML = reqs.map(r => {
      let txt = r.t === 'wd' ? `Achat de ${r.fn} (${r.a/10} KC)` : `Transfert de ${r.fn} (${r.a/10} KC)`;
      return `<div class="k" style="border:1px solid #0d47a1;padding:10px">
        <b>${txt}</b><br>
        <button onclick="validateTransfer('${r.key}', '${r.f}', '${r.to}', ${r.a}, '${r.t}', this)" class="s" style="background:var(--g);color:#fff">✅ Valider</button>
        <button onclick="rejectTransfer('${r.key}')" class="danger">❌</button>
      </div>`;
    }).join('');
  });

  // 3. Signalements (Reports)
  window.FB.onValue(window.FB.ref(window.FB.db, 'reports'), (snap) => {
    const data = snap.val(); const c = $('#adm-reports'); if(!c) return;
    if(!data) { c.innerHTML = '<p class="m">Aucun signalement.</p>'; return; }
    const reqs = Object.keys(data).map(k => ({ key: k, ...data[k] })).filter(r => r.s === 'open');
    if(!reqs.length) { c.innerHTML = '<p class="m">Aucun signalement en attente.</p>'; return; }
    
    c.innerHTML = reqs.map(r => `
      <div class="k" style="border:1px solid var(--danger);padding:10px">
        <b>${r.kind.toUpperCase()} signalé</b> (ID: ${r.ref})<br>
        <small>Motif: ${esc(r.why)}</small><br>
        <button onclick="resolveReport('${r.key}', 'done')" class="s" style="background:var(--g);color:#fff;margin-top:5px">✔️ Marquer traité</button>
      </div>`).join('');
  });

  // 4. Config (Gel)
  window.FB.onValue(window.FB.ref(window.FB.db, 'config/freeze'), (snap) => {
    const isFrozen = snap.val() === true;
    const btn = $('#btnFreeze');
    if(btn) {
      btn.textContent = isFrozen ? '🔴 Dégeler le système' : '🟢 Tout est normal';
      btn.className = isFrozen ? 'danger' : 's';
    }
  });
}

async function fAdm(){
  if(!S.isAdmin && !S.isMod) return '<div class="k">Accès refusé</div>';
  
  let adminTools = '';
  if(S.isAdmin) {
    adminTools = `
      <div class="k">
        <h3>⚙️ Configuration Système</h3>
        <button id="btnFreeze" onclick="toggleFreeze()" style="width:100%">Chargement...</button>
      </div>
      <div class="k">
        <h3>🚫 Suspendre un utilisateur</h3>
        <input id="suspId" placeholder="Code Mbolo (ex: A1B2C3)">
        <input id="suspWhy" placeholder="Motif de la suspension">
        <button onclick="suspendUser()" class="danger" style="width:100%">Suspendre</button>
      </div>
    `;
  }

  return adminTools + `
    <div class="k"><h3>📥 Recharges en attente</h3><div id="adm-recharges"></div></div>
    <div class="k"><h3>🔄 Transferts en attente</h3><div id="adm-transfers"></div></div>
    <div class="k"><h3>🚩 Signalements</h3><div id="adm-reports"></div></div>
  `;
}

window.toggleFreeze = async () => {
  const snap = await window.FB.get(window.FB.ref(window.FB.db, 'config/freeze'));
  const current = snap.val() === true;
  await window.FB.set(window.FB.ref(window.FB.db, 'config/freeze'), !current);
  toast(!current ? 'Système gelé' : 'Système dégelé');
}

window.suspendUser = async () => {
  const code = $('#suspId').value.trim().toUpperCase();
  const why = $('#suspWhy').value.trim();
  if(!code || !why) return toast('Code et motif requis');
  
  const idSnap = await window.FB.get(window.FB.ref(window.FB.db, 'ids/' + code));
  if(!idSnap.exists()) return toast('Utilisateur introuvable');
  
  await window.FB.set(window.FB.ref(window.FB.db, 'suspended/' + idSnap.val()), { why: why, ts: Date.now() });
  toast('Utilisateur suspendu.');
}

window.resolveReport = async (key, status) => {
  await window.FB.update(window.FB.ref(window.FB.db, 'reports/' + key), { s: status });
  toast('Signalement traité.');
}

// Récupération des fonctions Admin existantes (valider, refuser)
window.validateRecharge = async (reqKey, userId, amountKC, btn) => {
  if(!confirm(`Créditer ${amountKC/10} KC ?`)) return;
  btn.disabled = true;
  await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + userId + '/bal'), (curr) => (curr || 0) + amountKC);
  await window.FB.update(window.FB.ref(window.FB.db, 'recharges/' + reqKey), { status: 'validated' });
  toast('Validé');
}
window.rejectRecharge = async (reqKey) => { await window.FB.update(window.FB.ref(window.FB.db, 'recharges/' + reqKey), { status: 'rejected' }); toast('Refusé'); }
window.validateTransfer = async (reqKey, sId, rCode, amount, type, btn) => {
  if(!confirm(`Effectuer l'opération ?`)) return;
  btn.disabled = true;
  const rSnap = await window.FB.get(window.FB.ref(window.FB.db, 'ids/' + rCode));
  if(!rSnap.exists()) return toast('Destinataire introuvable');
  const rId = rSnap.val();
  
  await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + sId + '/bal'), (curr) => curr - amount);
  let commission = 0;
  if(type === 'wd') { commission = Math.round(amount * 0.03); }
  const toCredit = amount - commission;

  await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + rId + '/bal'), (curr) => (curr || 0) + toCredit);
  if(commission > 0) await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + S.uid + '/bal'), (curr) => (curr || 0) + commission);
  
  await window.FB.update(window.FB.ref(window.FB.db, 'transfer_requests/' + reqKey), { s: 'ok' });
  toast('Validé');
}
window.rejectTransfer = async (reqKey) => { await window.FB.update(window.FB.ref(window.FB.db, 'transfer_requests/' + reqKey), { s: 'no' }); toast('Refusé'); }

// LANCEMENT

draw();
</script>
