<style>

<main id="v"></main><div id="to"></div><nav id="nv"></nav>

<script type="module">
const FB = window.FB, { ref, push, set, update, get, remove, onValue, query, limitToLast, db, auth } = FB;
const $ = s => document.querySelector(s);
const CFG = { AIRTEL: "24177765496", FEE_TR: 0.03, FEE_WD: 0.03, CLOUD: "vmqquxa8", PRESET: "mbolo_preset" };
const VAPID_KEY = "BBmQn1YW75r9L2S1FltmzwcA0MWX22RzOWQT_qDkX0zvztBz6_24tQmjyKMygEps2_YL8fhnIZc59-SgrkuafvU"; 
const ERR = { "auth/email-already-in-use": "Ce pseudo est déjà pris.", "auth/invalid-credential": "Pseudo ou mot de passe incorrect.", "auth/weak-password": "Mot de passe trop faible.", "auth/network-request-failed": "Pas de connexion internet." };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kc = d => (d / 10).toFixed(1) + " KC", fc = d => (d * 10).toLocaleString("fr") + " FCFA";
const ago = t => new Date(t).toLocaleString("fr", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
let tt; function toast(m) { const t = $("#to"); t.textContent = m; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 3000); }
const toArr = s => { const v = s.val() || {}; return Object.keys(v).map(k => ({ id: k, ...v[k] })); };
const genCode = () => { const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; return [...crypto.getRandomValues(new Uint8Array(6))].map(x => a[x % a.length]).join(""); };
const nid = p => push(ref(db, p)).key;
const fresh = () => ({ uid: null, name: "", code: "", bal: 0, admin: false, mod: false, susp: null, freeze: false, posts: [], mk: [], dir: [], msgs: [], tun: {}, hist: [], notifs: [] });

let S = fresh(), A = { rech: {}, tr: {}, rep: {} }, OFF = [], tunOff = null, tab = "feed", openT = null, feedF = "all", TK = {}, mode = "login", amsg = "", ready = false, dirSearch = "";
const listen = (q, cb) => OFF.push(onValue(q, cb, e => console.warn("listen", e.code)));
const clearL = () => { OFF.forEach(f => f()); OFF = []; if (tunOff) { tunOff(); tunOff = null; } };
const busy = () => /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
const soft = t => { if (tab === t && !busy()) draw(); };

const E = new TextEncoder(), b64 = u => { u = new Uint8Array(u); let s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); }, ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tk(id, pw) { const m = await crypto.subtle.importKey("raw", E.encode(pw), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({ name: "PBKDF2", salt: E.encode(id), iterations: 100000, hash: "SHA-256" }, m, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); }
async function enc(k, t) { const iv = crypto.getRandomValues(new Uint8Array(12)); return b64(iv) + "." + b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, E.encode(t))); }
async function dec(k, c) { try { const [a, b] = c.split("."); return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(a) }, k, ub(b))); } catch (e) { return null; } }

const shrink = f => new Promise(res => { const im = new Image(); im.onload = () => { const r = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = im.width * r; c.height = im.height * r; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src); c.toBlob(b => res(b || f), "image/jpeg", 0.8); }; im.onerror = () => res(f); im.src = URL.createObjectURL(f); });
async function upImg(f) {
  toast("Envoi de l'image…");
  try {
    const fd = new FormData(); fd.append("file", await shrink(f)); fd.append("upload_preset", CFG.PRESET);
    const j = await (await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD}/image/upload`, { method: "POST", body: fd })).json();
    if (!j.secure_url) throw 0; return j.secure_url;
  } catch (e) { toast("Échec de l'envoi de l'image"); return null; }
}
const img = u => u ? `<img class="th" loading="lazy" src="${esc(String(u).replace("/upload/", "/upload/w_800,q_auto,f_auto/"))}">` : "";

function nav() {
  const T = [["feed", "🌐", "Fil"], ["mk", "🏪", "Marché"], ["tun", "🔒", "Tunnels"], ["w", "💰", "Wallet"], ["contact", "📞", "Contact"]];
  if (S.admin || S.mod) T.push(["adm", "🛡️", "Admin"]);
  $("#nv").innerHTML = S.uid && S.name && !S.susp ? T.map(t => `<a class="${tab == t[0] ? "on" : ""}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</a>`).join("") : "";
  $("#bl").textContent = kc(S.bal);
}
function go(t) { tab = t; openT = null; if (tunOff) { tunOff(); tunOff = null; } draw(); }
const errBox = e => `<div class="k err">⚠️ ${esc(e.message || e)}<br><button onclick="out()">Se déconnecter</button></div>`;
const out = () => FB.signOut(auth);

async function draw() {
  nav(); const v = $("#v");
  try {
    if (!ready) { v.innerHTML = "<p class='m' style='text-align:center;padding:40px'>Chargement…</p>"; return; }
    if (!S.uid) { v.innerHTML = fAuth(); return; }
    if (S.susp) { v.innerHTML = `<div class="k" style="text-align:center;border:2px solid var(--d)"><h2>🚫 Compte suspendu</h2><p>Motif : <b>${esc(S.susp.why)}</b></p><p class="m">Contacte l'administrateur sur WhatsApp.</p><button onclick="out()">Se déconnecter</button></div>`; return; }
    if (!S.name) { v.innerHTML = `<div class="k" style="text-align:center"><p>Préparation de ton compte…</p><button class="s" onclick="out()">Se déconnecter</button></div>`; return; }
    v.innerHTML = await ({ feed: fFeed, mk: fMk, tun: fTun, w: fW, contact: fContact, adm: fAdm }[tab] || fFeed)();
    if (tab === "tun" && openT) { const c = $("#cm"); if (c) c.onkeydown = e => { if (e.key === "Enter") snd(); }; renderMsgs(); }
  } catch (e) { console.error(e); v.innerHTML = errBox(e); }
}

const setMode = m => { mode = m; amsg = ""; draw(); };
function fAuth() {
  const L = mode === "login";
  return `<div class="k"><h2 style="color:var(--g);text-align:center">Mbolo</h2>
  <div class="tabs"><button class="${L ? "" : "s"}" onclick="setMode('login')">Se connecter</button><button class="${L ? "s" : ""}" onclick="setMode('reg')">Créer un compte</button></div>
  ${amsg ? `<div class="err">${esc(amsg)}</div>` : ""}
  <input id="au" placeholder="Pseudo (a-z, 0-9, _ ; 3 à 20)" autocapitalize="none" autocomplete="username">
  <input id="ap" type="password" placeholder="Mot de passe (6 minimum)" autocomplete="${L ? "current-password" : "new-password"}">
  ${L ? "" : `<details><summary class="m">Lire la charte</summary><small>Respecte les autres. Aucun contenu illégal, trompeur ou offensant. Les KC sont du crédit prépayé interne (1 KC = 100 FCFA), avec une commission de ${CFG.FEE_TR * 100} %. L'administration peut retirer un contenu ou suspendre un compte en cas d'abus. Ton numéro WhatsApp n'est visible que si tu t'inscris à l'annuaire.</small></details>
  <label class="m" style="display:flex;gap:8px;margin-top:8px"><input type="checkbox" id="tos" style="width:auto"> J'accepte la charte de Mbolo</label>`}
  <button id="ab" onclick="submitAuth()" style="width:100%;margin-top:12px">${L ? "Se connecter" : "Créer mon compte"}</button></div>`;
}
async function submitAuth() {
  const p = $("#au").value.trim().toLowerCase(), w = $("#ap").value, reg = mode === "reg";
  if (!/^[a-z0-9_]{3,20}$/.test(p) || (reg && ["admin", "support"].includes(p))) return toast("Pseudo invalide");
  if (w.length < 6) return toast("Mot de passe trop court");
  if (reg && !$("#tos").checked) return toast("Accepte la charte pour continuer");
  $("#ab").disabled = true;
  try { await (reg ? FB.createUserWithEmailAndPassword : FB.signInWithEmailAndPassword)(auth, p + "@mbolo.app", w); }
  catch (e) { amsg = ERR[e.code] || e.code; draw(); }
}

async function createProfile(u) {
  const name = u.email.split("@")[0];
  for (let i = 0; i < 5; i++) {
    const code = genCode(), prof = { name, code, bal: 0, joined: Date.now(), tos: Date.now() };
    try { await update(ref(db), { ["users/" + u.uid]: prof, ["ids/" + code]: u.uid }); return prof; } catch (e) { console.warn("profil", e.code); }
  }
  return null;
}

async function initUser(u) {
  clearL(); S = fresh(); S.uid = u.uid;
  const g = async p => { try { return (await get(ref(db, p))).val(); } catch (e) { return null; } };
  S.admin = (await g("admins/" + u.uid)) === true; S.mod = (await g("moderators/" + u.uid)) === true; S.susp = await g("suspended/" + u.uid);
  const p = (await g("users/" + u.uid)) || await createProfile(u);
  if (!p) { toast("Impossible de créer ton profil"); draw(); return; }
  S.name = p.name; S.code = p.code;
  try { S.tun = JSON.parse(localStorage["mbolo_tun_" + u.uid] || "{}"); } catch (e) { }
  listen(ref(db, "users/" + u.uid + "/bal"), s => { S.bal = s.val() || 0; nav(); soft("w"); });
  listen(ref(db, "users/" + u.uid + "/hist"), s => { S.hist = toArr(s).sort((a,b) => b.ts - a.ts).slice(0, 20); soft("w"); });
  listen(ref(db, "inbox/" + u.uid), s => { 
    const n = toArr(s).sort((a,b) => b.ts - a.ts);
    if(n.length > S.notifs.length && S.notifs.length > 0) { toast("🔔 Nouvelle notification !"); }
    S.notifs = n; soft("w"); 
  });
  listen(ref(db, "config/freeze"), s => { S.freeze = s.val() === true; soft("w"); soft("adm"); });
  listen(query(ref(db, "posts"), limitToLast(30)), s => { S.posts = toArr(s); soft("feed"); });
  listen(query(ref(db, "marketplace"), limitToLast(30)), s => { S.mk = toArr(s); soft("mk"); });
  listen(ref(db, "directory"), s => { S.dir = toArr(s); soft("contact"); });
  if (S.admin) {
    listen(ref(db, "recharges"), s => { A.rech = s.val() || {}; soft("adm"); });
    listen(ref(db, "transfer_requests"), s => { A.tr = s.val() || {}; soft("adm"); });
  }
  if (S.admin || S.mod) listen(ref(db, "reports"), s => { A.rep = s.val() || {}; soft("adm"); });

  // --- FCM : RÉCUPÉRATION DU TOKEN PUSH ---
  try {
    if ("Notification" in window) {
      const permission = await Notification.requestPermission();
      console.log("Permission notification :", permission);
      
      if (permission === "granted") {
        const token = await FB.getToken(FB.messaging, { vapidKey: VAPID_KEY });
        console.log("Token FCM généré :", token);
        
        if (token) {
          await update(ref(db, "users/" + u.uid), { fcmToken: token });
          console.log("✅ FCM Token sauvegardé dans Firebase !");
          toast("🔔 Notifications activées !");
        } else {
          console.warn("⚠️ Aucun token généré. Vérifie la clé VAPID.");
        }
      } else {
        console.warn("⚠️ Notifications bloquées par l'utilisateur.");
      }
    }
    FB.onMessage(FB.messaging, (payload) => {
      toast("🔔 " + (payload.notification?.title || "Notification") + " : " + (payload.notification?.body || ""));
    });
  } catch(e) { 
    console.error("❌ Erreur FCM :", e); 
  }

  draw();
}
FB.onAuthStateChanged(auth, u => {
  ready = true;
  if (u) { S.uid = u.uid; draw(); initUser(u).catch(e => { console.error(e); toast("Erreur de chargement"); }); }
  else { clearL(); S = fresh(); draw(); }
});

const setF = f => { feedF = f; draw(); };
const badge = c => c === "edu" ? '<span class="b">📚 Éducation</span>' : c === "com" ? '<span class="b c">🛍️ Commerce</span>' : c === "ann" ? '<span class="b a">📢 Officiel</span>' : "";
function fFeed() {
  const P = S.posts.filter(p => feedF === "all" || p.cat === feedF).sort((a, b) => b.ts - a.ts);
  return `<div class="tabs"><button class="${feedF === "all" ? "" : "s"}" onclick="setF('all')">Tout</button><button class="${feedF === "edu" ? "" : "s"}" onclick="setF('edu')">📚 Éducation</button><button class="${feedF === "com" ? "" : "s"}" onclick="setF('com')">🛍️ Commerce</button></div>
  <div class="k"><textarea id="px" rows="2" maxlength="1000" placeholder="Partage une info…"></textarea>
  <input type="file" id="pimg" accept="image/*">
  <select id="pcat"><option value="gen">Discussion générale</option><option value="edu">📚 Éducation / Cours</option><option value="com">🛍️ Commerce / Promo</option>${S.admin ? '<option value="ann">📢 Annonce officielle</option>' : ""}</select>
  <button id="pb" onclick="pub()" style="width:100%">🚀 Publier</button></div>` +
    (P.map(p => `<div class="k"><div class="row"><span><b>${esc(p.n)}</b>${badge(p.cat)}</span><small>${ago(p.ts)}</small></div>
    <div style="margin:8px 0;white-space:pre-wrap">${esc(p.x)}</div>${img(p.thumb)}
    <div class="row">${p.a === S.uid || S.admin || S.mod ? `<button class="l" onclick="delPost('${p.id}')">🗑️ Supprimer</button>` : "<span></span>"}${p.a !== S.uid ? `<button class="l" onclick="report('post','${p.id}')">🚩 Signaler</button>` : ""}</div></div>`).join("") || "<p class='m' style='text-align:center'>Aucune publication.</p>");
}
async function pub() {
  const x = $("#px").value.trim(), f = $("#pimg").files[0];
  if (!x) return toast("Écris un texte");
  $("#pb").disabled = true;
  try {
    const d = { a: S.uid, n: S.name, x, cat: $("#pcat").value, ts: Date.now() };
    if (f) { const u = await upImg(f); if (u) d.thumb = u; }
    await push(ref(db, "posts"), d); toast("Publié !");
  } catch (e) { toast("Refusé : " + (e.code || e.message)); }
  draw();
}
async function delPost(id) { if (confirm("Supprimer cette publication ?")) try { await remove(ref(db, "posts/" + id)); } catch (e) { toast("Refusé"); } }
async function report(kind, id) {
  const why = prompt("Pourquoi signaler ce contenu ?"); if (!why || why.trim().length < 3) return toast("Motif trop court");
  try { await push(ref(db, "reports"), { by: S.uid, kind, ref: id, why: why.trim().slice(0, 300), s: "open", ts: Date.now() }); toast("Signalement transmis"); } catch (e) { toast("Erreur"); }
}

function fMk() {
  return `<div class="k"><h3>Mettre en vente</h3><input id="mt" maxlength="60" placeholder="Produit ou service"><input id="mp" type="number" min="5" step="1" placeholder="Prix en KC (minimum 5)"><textarea id="md" rows="2" maxlength="500" placeholder="Description…"></textarea><input type="file" id="mimg" accept="image/*"><button id="mb" onclick="sell()" style="width:100%">Publier l'annonce</button></div>` +
    (S.mk.sort((a, b) => b.ts - a.ts).map(l => `<div class="k"><div class="row"><b>${esc(l.t)}</b><b style="color:var(--g)">${kc(l.d)}</b></div><small>Vendeur : ${esc(l.n)}</small><p>${esc(l.x)}</p>${img(l.thumb)}
    <div class="row">${l.a === S.uid ? '<small class="m">Ton annonce</small>' : `<button onclick="buy('${l.id}')">Acheter</button>`}${l.a === S.uid || S.admin || S.mod ? `<button class="l" onclick="delMk('${l.id}')">🗑️ Retirer</button>` : `<button class="l" onclick="report('listing','${l.id}')">🚩 Signaler</button>`}</div></div>`).join("") || "<p class='m' style='text-align:center'>Aucune annonce.</p>");
}
async function sell() {
  const t = $("#mt").value.trim(), p = parseFloat($("#mp").value), f = $("#mimg").files[0];
  if (t.length < 3 || !(p >= 5)) return toast("Titre (3+ car.) et prix (5 KC min.) requis");
  $("#mb").disabled = true;
  try {
    const d = { a: S.uid, n: S.name, t, d: Math.round(p * 10), x: $("#md").value.trim(), ts: Date.now() };
    if (f) { const u = await upImg(f); if (u) d.thumb = u; }
    await push(ref(db, "marketplace"), d); toast("Annonce publiée !");
  } catch (e) { toast("Refusé : " + (e.code || e.message)); }
  draw();
}
async function delMk(id) { if (confirm("Retirer cette annonce ?")) try { await remove(ref(db, "marketplace/" + id)); } catch (e) { toast("Refusé"); } }
async function buy(id) {
  const l = S.mk.find(m => m.id === id); if (!l) return;
  if (S.freeze) return toast("Opérations d'argent suspendues");
  if (l.d > S.bal) return toast("Solde insuffisant");
  if (!confirm(`Acheter « ${l.t} » pour ${kc(l.d)} ?`)) return;
  try {
    const to = (await get(ref(db, "users/" + l.a + "/code"))).val();
    await push(ref(db, "transfer_requests"), { t: "tr", f: S.uid, fn: S.name, to, a: l.d, m: ("Achat: " + l.t).slice(0, 100), s: "p", ts: Date.now() });
    toast("Demande envoyée, en attente de validation");
  } catch (e) { toast("Refusé : " + (e.code || e.message)); }
}

const saveTun = () => localStorage.setItem("mbolo_tun_" + S.uid, JSON.stringify(S.tun));
const TID = /^(CLS|BQT)-[A-Z0-9]{4}$/;
function fTun() {
  if (openT) return chat();
  const box = (t, c, ti, lab) => `<div class="k" style="border-left:4px solid ${c}"><h3>${lab}</h3><input id="tn_${t}" maxlength="40" placeholder="Nom"><input id="tp_${t}" type="password" placeholder="Clé secrète"><button onclick="mkT('${t}')" style="width:100%;background:${c}">${ti}</button></div>`;
  return box("edu", "#0d47a1", "Créer la classe", "📚 Créer une classe") + box("com", "#1b5e20", "Créer la boutique", "🛍️ Créer une boutique") +
    `<div class="k"><h3>🔑 Rejoindre</h3><input id="ti" placeholder="ID (ex. CLS-AB12)" maxlength="8"><input id="tq" type="password" placeholder="Clé secrète"><button onclick="joinT()" style="width:100%">Rejoindre</button></div><h3>Mes tunnels</h3>` +
    (Object.entries(S.tun).map(([i, t]) => `<div class="k" onclick="op('${i}')" style="cursor:pointer"><b>${t.type === "com" ? "🛍️" : "📚"} ${esc(t.n)}</b><br><small>ID : ${esc(i)}</small></div>`).join("") || "<p class='m'>Aucun tunnel.</p>");
}
async function mkT(type) {
  const n = $("#tn_" + type).value.trim(), p = $("#tp_" + type).value; if (!n || !p) return toast("Nom et clé requis");
  const i = (type === "edu" ? "CLS-" : "BQT-") + genCode().slice(0, 4);
  S.tun[i] = { n, type }; saveTun(); TK[i] = await tk(i, p); toast("Créé ! ID : " + i); op(i);
}
async function joinT() {
  const i = $("#ti").value.trim().toUpperCase(), p = $("#tq").value;
  if (!TID.test(i) || !p) return toast("ID ou clé invalide");
  if (!S.tun[i]) { S.tun[i] = { n: "Tunnel " + i, type: i.startsWith("BQT") ? "com" : "edu" }; saveTun(); }
  TK[i] = await tk(i, p); op(i);
}
async function op(i) {
  if (!TK[i]) { const p = prompt("Clé secrète de cet espace"); if (!p) return; TK[i] = await tk(i, p); }
  openT = i; S.msgs = []; if (tunOff) tunOff();
  tunOff = onValue(query(ref(db, "tunnels/" + i), limitToLast(50)), s => { 
    const newMsgs = toArr(s);
    const oldCount = S.msgs.length;
    S.msgs = newMsgs.sort((a, b) => a.ts - b.ts);
    if (S.msgs.length > oldCount && oldCount > 0 && S.msgs[S.msgs.length-1].n !== S.name) {
      dec(TK[i], S.msgs[S.msgs.length-1].c).then(t => { if(t) new Notification("Nouveau message", { body: S.msgs[S.msgs.length-1].n + " : " + t.slice(0,50) }); });
    }
    renderMsgs(); 
  }, () => toast("Accès refusé"));
  draw();
}
function chat() {
  const t = S.tun[openT] || { n: "?" };
  return `<div class="k" style="height:72vh;display:flex;flex-direction:column"><div class="row"><button class="s" onclick="go('tun')">←</button><b>${esc(t.n)}</b><a href="https://wa.me/?text=${encodeURIComponent("Rejoins « " + t.n + " » sur Mbolo. ID : " + openT + " (la clé te sera donnée en privé)")}" target="_blank"><button class="wa" style="width:auto;margin:0">📤</button></a></div>
  <div id="cb" style="flex:1;overflow-y:auto;margin:10px 0"></div><div class="row"><input id="cm" maxlength="1500" placeholder="Message chiffré…" style="margin:0"><button onclick="snd()" style="margin:0">➤</button></div></div>`;
}
async function renderMsgs() {
  const b = $("#cb"); if (!b || !openT) return; const h = [];
  for (const m of S.msgs) {
    const t = await dec(TK[openT], m.c), me = m.n === S.name;
    h.push(`<div style="margin-bottom:10px;text-align:${me ? "right" : "left"}"><small>${esc(m.n)} · ${new Date(m.ts).toLocaleTimeString("fr", { hour: "2-digit", minute: "2-digit" })}${me || S.admin || S.mod ? ` <a onclick="delMsg('${m.id}')">🗑️</a>` : ""}</small><br><span style="display:inline-block;padding:9px 13px;border-radius:12px;max-width:85%;text-align:left;background:${me ? "var(--g)" : "var(--l)"};color:${me ? "#fff" : "var(--t)"}">${t == null ? "<i>🔒 Clé incorrecte</i>" : esc(t)}</span></div>`);
  }
  b.innerHTML = h.join("") || "<p class='m' style='text-align:center'>Début de la conversation.</p>"; b.scrollTop = b.scrollHeight;
}
async function snd() {
  const i = $("#cm"), t = i.value.trim(); if (!t || !TK[openT]) return; i.value = "";
  try { await push(ref(db, "tunnels/" + openT), { ts: Date.now(), n: S.name, c: await enc(TK[openT], t) }); } catch (e) { toast("Envoi refusé"); }
}
async function delMsg(id) { if (confirm("Supprimer ce message ?")) try { await remove(ref(db, "tunnels/" + openT + "/" + id)); } catch (e) { toast("Refusé"); } }

function fW() {
  const fz = S.freeze ? " disabled" : "";
  const histHtml = S.hist.length ? S.hist.map(h => {
    const c = h.t === "topup" ? "var(--g)" : (h.a > 0 ? "var(--g)" : "var(--d)");
    return `<div class="h-item"><div><b>${esc(h.txt)}</b><br><small class="m">${ago(h.ts)}</small></div><div style="color:${c};font-weight:bold">${h.a > 0 ? '+' : ''}${kc(h.a)}</div></div>`;
  }).join("") : "<p class='m'>Aucune transaction.</p>";

  const notifHtml = S.notifs.length ? S.notifs.map(n => `
    <div class="notif">
      <div class="row">
        <span>${esc(n.txt)}</span>
        <button class="l" onclick="readNotif('${n.id}')" style="color:var(--m)">✔</button>
      </div>
      <small>${ago(n.ts)}</small>
    </div>`).join("") : "<p class='m'>Aucune notification.</p>";

  return (S.freeze ? '<div class="err">⚠️ Opérations d\'argent suspendues par l\'administration.</div>' : "") +
    `<div class="k" style="text-align:center;background:var(--g);color:#fff"><h2 style="margin:0;font-size:34px">${kc(S.bal)}</h2><small style="color:#ffffffcc">≈ ${fc(S.bal)} · 1 KC = 100 FCFA</small></div>
  
  <div class="k" style="border-left:4px solid var(--y)"><h3>🔔 Mes Notifications</h3>${notifHtml}</div>
  
  <div class="k" style="border-left:4px solid var(--y)"><h3>🛒 Acheter des KC</h3><p class="m">Envoie les FCFA par Airtel Money au +${CFG.AIRTEL}, puis déclare ta recharge.</p>
  <input id="ra" type="number" step="10" placeholder="Montant envoyé (FCFA, min. 500)"><input id="rr" maxlength="40" placeholder="Référence Airtel Money (optionnel)"><button onclick="reqRech()"${fz} style="width:100%">Déclarer ma recharge</button>
  <a href="https://wa.me/${CFG.AIRTEL}?text=${encodeURIComponent("Bonjour, je souhaite acheter des KC. Mon code Mbolo : " + S.code)}" target="_blank"><button class="wa">💬 Prévenir sur WhatsApp</button></a></div>
  <div class="k"><h3>Envoyer des KC</h3><input id="wt" maxlength="6" placeholder="Code du destinataire (6 car.)"><input id="wd" type="number" step="0.1" placeholder="Montant en KC"><button onclick="reqTr()"${fz} style="width:100%">Demander l'envoi</button></div>
  <div class="k"><h3>💸 Retirer en FCFA</h3><input id="xk" type="number" step="0.1" placeholder="Montant en KC (min. 5)"><input id="xn" type="tel" maxlength="20" placeholder="Ton numéro Airtel Money"><button onclick="reqWd()"${fz} style="width:100%">Demander le retrait (comm. ${CFG.FEE_WD * 100} %)</button></div>
  <div class="k" style="text-align:center"><h3>Mon code Mbolo</h3><b style="font-size:22px;letter-spacing:3px">${esc(S.code)}</b></div>
  
  <div class="k"><h3>📜 Relevé de compte</h3>${histHtml}</div>
  
  <div class="k"><button class="s" onclick="delAcc()">⚠️ Supprimer mon compte (0 KC requis)</button></div>
  <button class="r" onclick="out()" style="width:100%">Se déconnecter</button>`;
}
async function readNotif(id) { try { await remove(ref(db, "inbox/" + S.uid + "/" + id)); } catch(e){} }
async function send(path, d, msg) { if (S.freeze) return toast("Opérations suspendues"); try { await push(ref(db, path), d); toast(msg); draw(); } catch (e) { toast("Refusé : " + (e.code || e.message)); } }
function reqRech() {
  const a = parseInt($("#ra").value); if (!(a >= 500) || a % 10) return toast("Montant invalide (500 min., multiple de 10)");
  const d = { uid: S.uid, name: S.name, amountFCFA: a, amountKC: a / 10, status: "pending", ts: Date.now() }, r = $("#rr").value.trim(); if (r) d.ref = r;
  send("recharges", d, "Recharge déclarée. L'admin va vérifier.");
}
function reqTr() {
  const to = $("#wt").value.trim().toUpperCase(), a = Math.round(parseFloat($("#wd").value) * 10);
  if (!/^[A-Z0-9]{6}$/.test(to) || to === S.code) return toast("Code invalide"); if (!(a >= 1) || a > S.bal) return toast("Montant ou solde invalide");
  send("transfer_requests", { t: "tr", f: S.uid, fn: S.name, to, a, m: "Transfert", s: "p", ts: Date.now() }, "Demande envoyée.");
}
function reqWd() {
  const a = Math.round(parseFloat($("#xk").value) * 10), n = $("#xn").value.trim();
  if (!(a >= 50) || a > S.bal) return toast("Minimum 5 KC et solde suffisant"); if (n.replace(/\D/g, "").length < 8) return toast("Numéro invalide");
  send("transfer_requests", { t: "wd", f: S.uid, fn: S.name, a, m: n, s: "p", ts: Date.now() }, "Retrait demandé.");
}
async function delAcc() {
  if (S.bal > 0) return toast("Tu dois avoir 0 KC pour supprimer ton compte.");
  if (!confirm("Supprimer DÉFINITIVEMENT ton compte et toutes tes données ?")) return;
  const u = auth.currentUser;
  try {
    await update(ref(db), { ["users/" + S.uid]: null, ["ids/" + S.code]: null, ["directory/" + S.uid]: null, ["suspended/" + S.uid]: null });
    await u.delete();
    toast("Compte supprimé. Adieu !");
  } catch (e) { toast("Erreur (reconnecte-toi et réessaie)."); }
}

const setSearch = v => { dirSearch = v.toLowerCase(); draw(); };
function fContact() {
  const me = S.dir.find(d => d.id === S.uid) || {};
  let D = S.dir;
  if (dirSearch) D = D.filter(d => (d.n||"").toLowerCase().includes(dirSearch) || (d.qu||"").toLowerCase().includes(dirSearch) || d.cat.includes(dirSearch));
  
  return `<div class="k"><h3>📇 Ma carte</h3><input id="dn" maxlength="40" placeholder="Nom / Boutique" value="${esc(me.n)}"><select id="dc"><option value="edu">📚 Enseignant</option><option value="com"${me.cat === "com" ? " selected" : ""}>🛍️ Commerçant</option></select><input id="dq" maxlength="40" placeholder="Quartier / Ville" value="${esc(me.qu)}"><input id="dw" type="tel" placeholder="WhatsApp (ex. 24177…)" value="${esc(me.wa)}">
  <label class="m" style="display:flex;gap:8px"><input type="checkbox" id="dk" style="width:auto"> J'accepte que mon numéro soit visible des membres</label><button onclick="regDir()">Publier</button>${me.id ? '<button class="s" onclick="delDir()">Retirer ma carte</button>' : ""}</div>
  <h3>Annuaire</h3>
  <input placeholder="🔍 Rechercher un prof, un commerce, un quartier…" oninput="setSearch(this.value)" value="${esc(dirSearch)}">
  ` +
  (D.sort((a, b) => b.ts - a.ts).map(c => `<div class="k"><b>${esc(c.n)}</b>${badge(c.cat)}<br><small>📍 ${esc(c.qu)}</small><a href="https://wa.me/${esc(c.wa)}" target="_blank"><button class="wa">💬 WhatsApp</button></a></div>`).join("") || "<p class='m'>Aucun résultat.</p>");
}
async function regDir() {
  const n = $("#dn").value.trim(), wa = $("#dw").value.replace(/\D/g, "");
  if (n.length < 2 || wa.length < 8 || wa.length > 15) return toast("Nom et WhatsApp valides requis"); if (!$("#dk").checked) return toast("Coche l'autorisation d'affichage");
  try { await set(ref(db, "directory/" + S.uid), { n, cat: $("#dc").value, qu: $("#dq").value.trim(), wa, ok: true, ts: Date.now() }); toast("Carte publiée !"); } catch (e) { toast("Refusé"); }
}
async function delDir() { try { await remove(ref(db, "directory/" + S.uid)); toast("Carte retirée"); } catch (e) { toast("Erreur"); } }

function fAdm() {
  const rech = Object.entries(A.rech).filter(([k, r]) => r.status === "pending"), tr = Object.entries(A.tr).filter(([k, r]) => r.s === "p"), rep = Object.entries(A.rep).filter(([k, r]) => r.s === "open");
  let h = "";
  if (S.admin) {
    h += `<div class="k"><h3>⚙️ Système</h3><button class="${S.freeze ? "r" : "s"}" onclick="toggleFreeze()" style="width:100%">${S.freeze ? "🔴 Dégeler les opérations d'argent" : "🟢 Geler les opérations d'argent"}</button></div>
    <div class="k"><h3>📢 Envoyer une notification</h3><input id="nc" maxlength="6" placeholder="Code destinataire (6 car.)"><input id="nt" maxlength="200" placeholder="Message (200 car. max)"><button onclick="sendNotif()" class="b" style="width:100%">Envoyer</button></div>
    <div class="k"><h3>👤 Gérer un compte</h3><input id="ac" maxlength="6" placeholder="Code (6 car.)"><input id="aw" placeholder="Motif (suspension)"><input id="aa" type="number" step="0.1" placeholder="KC à créditer"><button onclick="credit()">➕ Créditer</button><button class="r" onclick="suspend(1)">🚫 Suspendre</button><button class="s" onclick="suspend(0)">Lever</button>
    <div style="border-top:1px solid var(--l);margin-top:10px;padding-top:10px"><p class="m">Gérer les modérateurs :</p><button class="s" onclick="setMod(1)">⭐ Nommer Modo</button><button class="s" onclick="setMod(0)">Retirer Modo</button></div>
    </div>
    <div class="k"><h3>📥 Recharges (${rech.length})</h3>${rech.map(([k, r]) => `<div class="row"><span>${esc(r.name)} · ${r.amountFCFA} FCFA${r.ref ? "<br><small>Réf : " + esc(r.ref) + "</small>" : ""}</span><span><button onclick="okRech('${k}')">✅</button><button class="r" onclick="noRech('${k}')">❌</button></span></div>`).join("") || "<p class='m'>Rien.</p>"}</div>
    <div class="k"><h3>🔄 Envois et retraits (${tr.length})</h3>${tr.map(([k, r]) => `<div class="row"><span>${r.t === "wd" ? "💸 Retrait" : "🔁 Envoi"} · ${esc(r.fn)} · ${kc(r.a)}<br><small>${r.t === "wd" ? "Payer " + fc(r.a - Math.round(r.a * CFG.FEE_WD)) + " au " + esc(r.m) : "→ " + esc(r.to) + " · " + esc(r.m)}</small></span><span><button onclick="okTr('${k}')">✅</button><button class="r" onclick="noTr('${k}')">❌</button></span></div>`).join("") || "<p class='m'>Rien.</p>"}</div>`;
  }
  return h + `<div class="k"><h3>🚩 Signalements (${rep.length})</h3>${rep.map(([k, r]) => `<div class="k"><b>${esc(r.kind)}</b> <small>${esc(r.ref)}</small><br><small>${esc(r.why)}</small><br><button class="r" onclick="rmRep('${k}')">🗑️ Retirer le contenu</button><button class="s" onclick="doneRep('${k}')">Classer</button></div>`).join("") || "<p class='m'>Aucun signalement.</p>"}</div>`;
}
const guard = async f => { try { await f(); } catch (e) { console.error(e); toast("Erreur : " + (e.code || e.message)); } };
const toggleFreeze = () => guard(async () => { await set(ref(db, "config/freeze"), !S.freeze); });
const log = (o) => ({ ["log/" + nid("log")]: { by: S.uid, ts: Date.now(), ...o } });
const byCode = async c => (await get(ref(db, "ids/" + c))).val();

const sendNotif = () => guard(async () => {
  const c = $("#nc").value.trim().toUpperCase(), txt = $("#nt").value.trim();
  if(!c || !txt) return toast("Code et message requis");
  const u = await byCode(c); if(!u) return toast("Code inconnu");
  await push(ref(db, "inbox/" + u), { txt, ts: Date.now() });
  toast("Notification envoyée !");
});

const credit = () => guard(async () => {
  const c = $("#ac").value.trim().toUpperCase(), a = Math.round(parseFloat($("#aa").value) * 10); if (!c || !(a > 0)) return toast("Code et montant requis");
  const u = await byCode(c); if (!u) return toast("Code inconnu");
  const b = (await get(ref(db, "users/" + u + "/bal"))).val() || 0;
  await update(ref(db), { ["users/" + u + "/bal"]: b + a, ["users/" + u + "/hist/" + nid("h")]: { t: "topup", txt: "Recharge admin", a, ts: Date.now() }, ["inbox/" + u + "/" + nid("n")]: { txt: "Ton compte a été crédité de " + kc(a) + " par l'admin.", ts: Date.now() }, ...log({ t: "credit", to: c, a, fee: 0 }) }); toast("Crédité ✅");
});

const suspend = on => guard(async () => {
  const c = $("#ac").value.trim().toUpperCase(), w = $("#aw").value.trim(), u = await byCode(c); if (!u) return toast("Code inconnu");
  if (on) { if (w.length < 3) return toast("Motif requis"); await set(ref(db, "suspended/" + u), { why: w.slice(0, 200), ts: Date.now() }); toast("Compte suspendu"); }
  else { await remove(ref(db, "suspended/" + u)); toast("Suspension levée"); }
});

const setMod = on => guard(async () => {
  const c = $("#ac").value.trim().toUpperCase(), u = await byCode(c); if (!u) return toast("Code inconnu");
  if(on) { await set(ref(db, "moderators/" + u), true); toast("Modérateur nommé ⭐"); }
  else { await remove(ref(db, "moderators/" + u)); toast("Modérateur retiré"); }
});

const okRech = k => guard(async () => {
  const r = A.rech[k]; if (!r || r.status !== "pending" || !confirm("Créditer " + kc(r.amountKC) + " à " + r.name + " ?")) return;
  const b = (await get(ref(db, "users/" + r.uid + "/bal"))).val() || 0;
  await update(ref(db), { 
    ["users/" + r.uid + "/bal"]: b + r.amountKC, 
    ["users/" + r.uid + "/hist/" + nid("h")]: { t: "topup", txt: "Recharge validée", a: r.amountKC, ts: Date.now() },
    ["inbox/" + r.uid + "/" + nid("n")]: { txt: "✅ Ta recharge de " + kc(r.amountKC) + " a été validée !", ts: Date.now() },
    ["recharges/" + k + "/status"]: "validated", 
    ...log({ t: "topup", f: r.name, a: r.amountKC, fee: 0 }) 
  }); toast("Validé ✅");
});

const noRech = k => guard(() => update(ref(db), { ["recharges/" + k + "/status"]: "rejected" }));

const okTr = k => guard(async () => {
  const r = A.tr[k]; if (!r || r.s !== "p" || !confirm("Valider cette opération ?")) return;
  const fee = Math.round(r.a * (r.t === "wd" ? CFG.FEE_WD : CFG.FEE_TR)), B = {}, bal = async u => B[u] ??= (await get(ref(db, "users/" + u + "/bal"))).val() || 0;
  if (await bal(r.f) < r.a) return toast("Solde insuffisant");
  B[r.f] -= r.a;
  
  let toId = null;
  if (r.t === "tr") { toId = await byCode(r.to); if (!toId) return toast("Destinataire inconnu"); await bal(toId); B[toId] += r.a - fee; }
  await bal(S.uid); B[S.uid] += fee;

  const U = { 
    ["transfer_requests/" + k + "/s"]: "ok", 
    ["users/" + r.f + "/hist/" + nid("h")]: { t: r.t, txt: r.t === 'wd' ? "Retrait demandé" : "Envoi vers " + (r.to||""), a: -r.a, ts: Date.now() },
    ["inbox/" + r.f + "/" + nid("n")]: { txt: r.t === 'wd' ? "💸 Ton retrait de " + kc(r.a) + " est validé." : "🔁 Ton envoi de " + kc(r.a) + " est validé.", ts: Date.now() },
    ...log({ t: r.t, f: r.fn, to: r.to || "", a: r.a, fee }) 
  };
  if (toId) {
    U["users/" + toId + "/hist/" + nid("h")] = { t: "tr", txt: "Reçu de " + r.fn, a: r.a - fee, ts: Date.now() };
    U["inbox/" + toId + "/" + nid("n")] = { txt: "🎉 Tu as reçu " + kc(r.a - fee) + " de " + r.fn, ts: Date.now() };
  }
  
  for (const u in B) U["users/" + u + "/bal"] = B[u];
  await update(ref(db), U); toast(r.t === "wd" ? "Validé : pense à payer par Airtel Money" : "Validé ✅");
});

const noTr = k => guard(() => update(ref(db), { ["transfer_requests/" + k + "/s"]: "no" }));
const doneRep = k => guard(() => update(ref(db), { ["reports/" + k + "/s"]: "done" }));
const rmRep = k => guard(async () => {
  const r = A.rep[k]; if (!r) return;
  if (r.kind === "post") await remove(ref(db, "posts/" + r.ref)); else if (r.kind === "listing") await remove(ref(db, "marketplace/" + r.ref));
  await update(ref(db), { ["reports/" + k + "/s"]: "done" }); toast("Contenu retiré");
});

Object.assign(window, { go, out, setMode, submitAuth, setF, pub, delPost, report, sell, delMk, buy, mkT, joinT, op, snd, delMsg, reqRech, reqTr, reqWd, readNotif, delAcc, regDir, delDir, setSearch, toggleFreeze, sendNotif, credit, suspend, setMod, okRech, noRech, okTr, noTr, doneRep, rmRep });
draw();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.register('firebase-messaging-sw.js').catch(()=>{});
  });
}
</script>
</body></html>
