    <div class="k"><h3>📥 Recharges (${rech.length})</h3>${rech.map(([k, r]) => `<div class="row" style="border-bottom:1px solid var(--l);padding:10px 0"><span>${esc(r.name)} · ${r.amountFCFA} FCFA</span><span><button onclick="okRech('${k}')">✅</button><button class="r" onclick="noRech('${k}')">❌</button></span></div>`).join("") || "<p class='m'>Rien.</p>"}</div>
    <div class="k"><h3>🔄 Transferts (${tr.length})</h3>${tr.map(([k, r]) => `<div class="row" style="border-bottom:1px solid var(--l);padding:10px 0"><span>${r.t === "wd" ? "Retrait" : "Envoi"} · ${esc(r.fn)} · ${kc(r.a)}</span><span><button onclick="okTr('${k}')">✅</button><button class="r" onclick="noTr('${k}')">❌</button></span></div>`).join("") || "<p class='m'>Rien.</p>"}</div>`;
  }
  return h + `<div class="k"><h3>🚩 Signalements (${rep.length})</h3>${rep.map(([k, r]) => `<div class="k" style="margin-bottom:8px"><b>${esc(r.kind)}</b><br><small>${esc(r.why)}</small><br><button class="r" onclick="rmRep('${k}')">🗑️</button><button class="s" onclick="doneRep('${k}')">Classer</button></div>`).join("") || "<p class='m'>Aucun.</p>"}</div>`;
}
const guard = async f => { try { await f(); } catch (e) { toast("Erreur"); } };

const byCode = async c => (await get(ref(db, "ids/" + c))).val();
const sendNotif = () => guard(async () => { const c = $("#nc").value.trim().toUpperCase(), txt = $("#nt").value.trim(); if (!c || !txt) return toast("Code et msg"); const u = await byCode(c); if (!u) return toast("Code inconnu"); await push(ref(db, "inbox/" + u), { txt, ts: Date.now() }); toast("Envoyé !"); });
const credit = () => guard(async () => { const c = $("#ac").value.trim().toUpperCase(), a = Math.round(parseFloat($("#aa").value) * 10); if (!c || !(a > 0)) return toast("Code et KC"); const u = await byCode(c); if (!u) return toast("Inconnu"); const b = (await get(ref(db, "users/" + u + "/bal"))).val() || 0; await update(ref(db), { ["users/" + u + "/bal"]: b + a, ["users/" + u + "/hist/" + nid("h")]: { t: "topup", txt: "Admin", a, ts: Date.now() }, ["inbox/" + u + "/" + nid("n")]: { txt: "Crédité de " + kc(a), ts: Date.now() }, ...log({ t: "credit", to: c, a, fee: 0 }) }); toast("Crédité"); });
const suspend = on => guard(async () => { const c = $("#ac").value.trim().toUpperCase(), w = $("#aw").value.trim(), u = await byCode(c); if (!u) return toast("Inconnu"); if (on) { if (w.length < 3) return toast("Motif"); await set(ref(db, "suspended/" + u), { why: w.slice(0, 200), ts: Date.now() }); toast("Suspendu"); } else { await remove(ref(db, "suspended/" + u)); toast("Levé"); } });
const setMod = on => guard(async () => { const c = $("#ac").value.trim().toUpperCase(), u = await byCode(c); if (!u) return toast("Inconnu"); if (on) { await set(ref(db, "moderators/" + u), true); toast("Modo"); } else { await remove(ref(db, "moderators/" + u)); toast("Retiré"); } });
const okRech = k => guard(async () => { const r = A.rech[k]; if (!r || r.status !== "pending" || !confirm(`Créditer ${kc(r.amountKC)} ?`)) return; const b = (await get(ref(db, "users/" + r.uid + "/bal"))).val() || 0; await update(ref(db), { ["users/" + r.uid + "/bal"]: b + r.amountKC, ["users/" + r.uid + "/hist/" + nid("h")]: { t: "topup", txt: "Recharge", a: r.amountKC, ts: Date.now() }, ["inbox/" + r.uid + "/" + nid("n")]: { txt: `Recharge de ${kc(r.amountKC)} validée !`, ts: Date.now() }, ["recharges/" + k + "/status"]: "validated", ...log({ t: "topup", f: r.name, a: r.amountKC, fee: 0 }) }); toast("OK"); });
const noRech = k => guard(() => update(ref(db), { ["recharges/" + k + "/status"]: "rejected" }));
const okTr = k => guard(async () => { const r = A.tr[k]; if (!r || r.s !== "p" || !confirm("Valider ?")) return; const fee = Math.round(r.a * (r.t === "wd" ? CFG.FEE_WD : CFG.FEE_TR)), B = {}, bal = async u => B[u] ??= (await get(ref(db, "users/" + u + "/bal"))).val() || 0; if (await bal(r.f) < r.a) return toast("Solde insuffisant"); B[r.f] -= r.a; let toId = null; if (r.t === "tr") { toId = await byCode(r.to); if (!toId) return toast("Destinataire introuvable"); await bal(toId); B[toId] += r.a - fee; } await bal(S.uid); B[S.uid] += fee; const U = { ["transfer_requests/" + k + "/s"]: "ok", ["users/" + r.f + "/hist/" + nid("h")]: { t: r.t, txt: r.t === 'wd' ? "Retrait" : "Envoi", a: -r.a, ts: Date.now() }, ["inbox/" + r.f + "/" + nid("n")]: { txt: "Opération validée", ts: Date.now() }, ...log({ t: r.t, f: r.fn, to: r.to || "", a: r.a, fee }) }; if (toId) { U["users/" + toId + "/hist/" + nid("h")] = { t: "tr", txt: "Reçu de " + r.fn, a: r.a - fee, ts: Date.now() }; U["inbox/" + toId + "/" + nid("n")] = { txt: `Reçu ${kc(r.a - fee)} de ${r.fn}`, ts: Date.now() }; } for (const u in B) U["users/" + u + "/bal"] = B[u]; await update(ref(db), U); toast("Validé !"); });
const noTr = k => guard(() => update(ref(db), { ["transfer_requests/" + k + "/s"]: "no" }));
const doneRep = k => guard(() => update(ref(db), { ["reports/" + k + "/s"]: "done" }));

Object.assign(window, { go, out, setMode, submitAuth, setF, pub, delPost, sell, delMk, buy, mkT, joinT, op, snd, reqRech, reqTr, reqWd, readNotif, delAcc, regDir, delDir, setSearch, toggleFreeze, sendNotif, credit, suspend, setMod, okRech, noRech, okTr, noTr, doneRep, rmRep, enableNotifs, testNotif, laterNotif });
