<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b3a"><title>Mbolo Tam Tam</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mbolo">
<style>
:root{--g:#0b6b3a;--y:#fcd116;--bg:#f6f4ec;--c:#fff;--t:#1d1d1b;--m:#6b6b66;--l:#ddd9cb}
@media(prefers-color-scheme:dark){:root{--bg:#12140f;--c:#1c1f18;--t:#f1efe6;--m:#a3a39a;--l:#33362d}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:72px}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:18px}header span{background:var(--y);color:#222;border-radius:12px;padding:3px 10px;font-weight:700;font-size:14px}
main{padding:12px;max-width:640px;margin:auto}.k{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px;margin-bottom:10px}
input,textarea,select{width:100%;padding:10px;margin:4px 0;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;margin:3px 3px 3px 0}button.s{background:var(--l);color:var(--t)}
small,.m{color:var(--m);font-size:13px}h3{margin:6px 0}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l)}
nav a{flex:1;text-align:center;padding:10px 0 12px;font-size:12px;color:var(--m)}nav a.on{color:var(--g);font-weight:700}nav a i{display:block;font-style:normal;font-size:20px}
#to{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;max-width:90%}
.o{background:var(--y);color:#222;border-radius:6px;padding:1px 6px;font-size:12px}.p{color:var(--g);font-weight:700}.n{color:#b3261e;font-weight:700}
</style></head><body>
<header><b>🥁 Mbolo Tam Tam</b><span id="bl"></span></header><main id="v"></main><div id="to"></div>
<nav id="nv"></nav>
<script>
const E=new TextEncoder(),$=s=>document.querySelector(s),R=n=>Math.random().toString(36).slice(2,2+n).toUpperCase();
const AL={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'},DAY=864e5;
let S;try{S=JSON.parse(localStorage.mtt)}catch(e){}
S=S||{me:null,bal:0,led:[],posts:[],mk:[],tun:{},msgs:[],used:{},relay:[],pub:null,adm:null,admId:null,until:0,bonus:0,cert:null,k:null};
const save=()=>{try{localStorage.mtt=JSON.stringify(S)}catch(e){toast('Sauvegarde impossible')}};
const cc=d=>(d/10).toFixed(1)+' CC',fc=d=>(d*10).toLocaleString('fr')+' FCFA',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>new Date(t).toLocaleString('fr',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const t=$('#to');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gen(){const k=await crypto.subtle.generateKey(AL,true,['sign','verify']);return{pub:await crypto.subtle.exportKey('jwk',k.publicKey),prv:await crypto.subtle.exportKey('jwk',k.privateKey)}}
const ik=(j,u)=>crypto.subtle.importKey('jwk',j,AL,false,[u]);
async function sign(o,prv){const p=JSON.stringify(o);return{p,s:b64(await crypto.subtle.sign(SG,await ik(prv,'sign'),E.encode(p)))}}
async function ver(it,pub){try{return await crypto.subtle.verify(SG,await ik(pub,'verify'),ub(it.s),E.encode(it.p))}catch(e){return false}}
async function tk(tid,pw){const m=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:E.encode(tid),iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(k,t){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,E.encode(t)))}
async function dec(k,c){try{const[a,b]=c.split('.');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(a)},k,ub(b)))}catch(e){return null}}
const TK={};let tab='feed',openT=null;
const TABS=[['feed','🌐','Fil'],['mk','🏪','Marché'],['tun','🔒','Tunnels'],['w','💰','Wallet'],['ex','🔁','Échange']];
function nav(){$('#nv').innerHTML=TABS.concat(S.adm?[['adm','🛡️','Admin']]:[]).map(t=>`<a class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</a>`).join('');$('#bl').textContent=cc(S.bal)}
function go(t){tab=t;openT=null;draw()}
async function draw(){nav();const v=$('#v');if(!S.me){v.innerHTML=`<div class="k"><h3>Mbolo ! 👋</h3><p>Bienvenue sur Mbolo Tam Tam, le réseau du quartier sans data.</p><input id="nm" placeholder="Ton prénom ou pseudo"><button onclick="start()">Commencer</button></div>`;return}
v.innerHTML=await({feed:fFeed,mk:fMk,tun:fTun,w:fW,ex:fEx,adm:fAdm}[tab])()}
async function start(){const n=$('#nm').value.trim();if(!n)return toast('Entre un nom');S.me={id:'M'+R(5),name:n};S.k=await gen();save();draw()}
// ---- échanges de pièces
function out(o,extra){return sign(o,S.k.prv).then(it=>{if(S.cert)it.c=S.cert;S.used[o.id]=1;S.relay.push(it);S.relay=S.relay.slice(-300);return it})}
async function pay(to,d,m){if(d<=0||S.bal<d){toast('Solde insuffisant');return false}S.bal-=d;S.led.unshift({ts:Date.now(),m:'Envoi à '+to+(m?' · '+m:''),d:-d});await out({t:'x',id:R(10),f:S.me.id,to,d,m,ts:Date.now()});save();return true}
async function take(it){let o;try{o=JSON.parse(it.p)}catch(e){return 0}if(!S.pub)return 0;
if(o.t=='c'){if(await ver(it,S.pub)&&o.id==S.me.id){S.cert=it;return 1}return 0}
if(S.used[o.id])return 0;
if(o.t=='v'){if(o.exp<Date.now()||!await ver(it,S.pub))return 0}
else if(o.t=='x'){let c;try{c=JSON.parse(it.c.p)}catch(e){return 0}if(!await ver(it.c,S.pub)||c.id!=o.f||!await ver(it,c.k))return 0}else return 0;
S.used[o.id]=1;S.relay.push(it);S.relay=S.relay.slice(-300);
if(o.to==S.me.id){S.bal+=o.d;S.led.unshift({ts:Date.now(),m:o.t=='v'?'Recharge Mobile Money':'Reçu de '+o.f+(o.m?' · '+o.m:''),d:o.d});return 1}return 0}
// ---- Fil
async function fFeed(){const P=[...S.posts].sort((a,b)=>b.ts-a.ts);
return`<div class="k"><textarea id="px" rows="2" placeholder="Partage une astuce, une info du quartier…"></textarea><button onclick="post()">Publier</button></div>`+(P.map(p=>`<div class="k"><b>${esc(p.n)}</b> ${p.o?'<span class="o">officiel</span>':''} <small>${ago(p.ts)}</small><p>${esc(p.x)}</p>${p.a==S.me.id?'':`<button class="s" onclick="tip('${p.id}',5)">🔥 0,5</button><button class="s" onclick="tip('${p.id}',20)">💎 2</button><button class="s" onclick="tip('${p.id}',50)">👑 5</button>`}</div>`).join('')||'<p class="m">Aucune publication. Sois le premier !</p>')}
function post(){const x=$('#px').value.trim();if(!x)return;S.posts.push({id:R(8),a:S.me.id,n:S.me.name,x,ts:Date.now(),o:S.adm?1:0});save();draw()}
async function tip(id,d){const p=S.posts.find(q=>q.id==id),a=S.admId&&S.admId!=p.a?Math.floor(d*.8):d;if(S.bal<d)return toast('Solde insuffisant');
if(await pay(p.a,a,'pourboire')){if(d>a)await pay(S.admId,d-a,'fonds commun');toast('Merci envoyé 🙏');draw()}}
// ---- Marché
async function fMk(){return`<div class="k"><h3>Vendre</h3><input id="mt" placeholder="Produit ou service"><input id="mp" type="number" step="0.1" placeholder="Prix en CC (1 CC = 100 FCFA)"><textarea id="md" rows="2" placeholder="Description"></textarea><button onclick="sell()">Publier l'annonce</button></div>`+
([...S.mk].sort((a,b)=>b.ts-a.ts).map(l=>`<div class="k"><b>${esc(l.t)}</b> <span class="p">${cc(l.d)}</span><br><small>${esc(l.n)} · ${fc(l.d)}</small><p>${esc(l.x)}</p>${l.a==S.me.id?'<small>Ton annonce</small>':`<button onclick="buy('${l.id}')">Acheter</button>`}</div>`).join('')||'<p class="m">Pas encore d\'annonce.</p>')}
function sell(){const t=$('#mt').value.trim(),d=Math.round(parseFloat($('#mp').value)*10);if(!t||!(d>0))return toast('Titre et prix requis');S.mk.push({id:R(8),a:S.me.id,n:S.me.name,t,d,x:$('#md').value.trim(),ts:Date.now()});save();draw()}
async function buy(id){const l=S.mk.find(q=>q.id==id);if(confirm(`Acheter « ${l.t} » pour ${cc(l.d)} ?`)&&await pay(l.a,l.d,'achat '+l.t)){toast('Paiement prêt : partage-le dans Échange');draw()}}
// ---- Tunnels chiffrés
async function fTun(){if(openT)return chat();
return`<div class="k"><h3>Créer un tunnel</h3><input id="tn" placeholder="Nom du tunnel"><input id="tp" type="password" placeholder="Clé secrète partagée"><button onclick="mkT()">Créer</button></div><div class="k"><h3>Rejoindre</h3><input id="ti" placeholder="ID du tunnel (ex. TAB12C)"><input id="tq" type="password" placeholder="Clé secrète"><button onclick="joinT()">Rejoindre</button></div>`+
Object.entries(S.tun).map(([i,n])=>`<div class="k" onclick="op('${i}')"><b>🔒 ${esc(n)}</b><br><small>ID : ${i}</small></div>`).join('')}
async function mkT(){const n=$('#tn').value.trim(),p=$('#tp').value;if(!n||!p)return toast('Nom et clé requis');const i='T'+R(5);S.tun[i]=n;TK[i]=await tk(i,p);save();toast('ID à partager : '+i);op(i)}
async function joinT(){const i=$('#ti').value.trim().toUpperCase(),p=$('#tq').value;if(!i||!p)return;S.tun[i]=S.tun[i]||'Tunnel '+i;TK[i]=await tk(i,p);save();op(i)}
async function op(i){if(!TK[i]){const p=prompt('Clé secrète du tunnel');if(!p)return;TK[i]=await tk(i,p)}openT=i;draw()}
async function chat(){const i=openT,M=[];for(const m of S.msgs.filter(m=>m.i==i).sort((a,b)=>a.ts-b.ts)){const t=await dec(TK[i],m.c);M.push(`<p><b>${esc(m.n)}</b> <small>${ago(m.ts)}</small><br>${t==null?'<i class="m">🔒 clé différente</i>':esc(t)}</p>`)}
return`<div class="k"><button class="s" onclick="go('tun')">← Retour</button> <b>${esc(S.tun[i])}</b>${M.join('')||'<p class="m">Aucun message.</p>'}<textarea id="cm" rows="2" placeholder="Message chiffré…"></textarea><button onclick="snd()">Envoyer</button><br><small>Les messages voyagent chiffrés via Échange.</small></div>`}
async function snd(){const t=$('#cm').value.trim();if(!t)return;S.msgs.push({id:R(8),i:openT,n:S.me.name,ts:Date.now(),c:await enc(TK[openT],t)});save();draw()}
// ---- Wallet
async function fW(){const sub=S.until>Date.now();return`<div class="k"><h3>${cc(S.bal)}</h3><small>≈ ${fc(S.bal)} · 1 000 FCFA = 10 CC</small><p>Abonnement : ${sub?`<span class="p">actif jusqu'au ${new Date(S.until).toLocaleDateString('fr')}</span>`:'<span class="n">inactif</span>'}</p><button onclick="abo()">Payer la semaine (10 CC)</button><button class="s" onclick="bonus()">🎁 Bonus du jour (0,1 CC)</button></div>
<div class="k"><h3>Mon code membre</h3><small>Donne-le au relais avec ton paiement Mobile Money pour recevoir tes CC.</small><textarea readonly rows="3" onclick="this.select()">${btoa(JSON.stringify({id:S.me.id,k:S.k.pub}))}</textarea><button class="s" onclick="navigator.clipboard&&navigator.clipboard.writeText(btoa(JSON.stringify({id:S.me.id,k:S.k.pub})));toast('Copié')">Copier</button><small>Ton identifiant : ${S.me.id}${S.cert?' · ✅ membre certifié':' · ⏳ en attente de certification'}</small></div>
<div class="k"><h3>Envoyer des CC</h3><input id="wt" placeholder="Identifiant du destinataire (ex. MAB12C)"><input id="wd" type="number" step="0.1" placeholder="Montant en CC"><button onclick="send()">Préparer l'envoi</button></div>
${S.pub?'':'<p><small onclick="enableAdm()" style="text-decoration:underline">Je suis le relais fondateur (activer)</small></p>'}<div class="k"><h3>Historique</h3>${S.led.slice(0,25).map(l=>`<div><small>${ago(l.ts)}</small> ${esc(l.m)} <b class="${l.d>0?'p':'n'}">${l.d>0?'+':''}${cc(l.d)}</b></div>`).join('')||'<small>Aucun mouvement.</small>'}</div>`}
async function abo(){if(S.bal<100)return toast('Il faut 10 CC');if(await pay(S.admId||'RELAIS',100,'abonnement semaine')){S.until=Math.max(S.until,Date.now())+7*DAY;save();draw()}}
function bonus(){if(Date.now()-S.bonus<DAY)return toast('Reviens demain');S.bonus=Date.now();S.bal+=1;S.led.unshift({ts:Date.now(),m:'Bonus quotidien',d:1});save();draw()}
async function send(){const to=$('#wt').value.trim().toUpperCase(),d=Math.round(parseFloat($('#wd').value)*10);if(!to||!(d>0))return;if(!S.cert)return toast('Ta certification par le relais est requise');if(await pay(to,d,'')){toast('Envoi prêt : partage-le dans Échange');draw()}}
// ---- Échange (Bluetooth / WhatsApp)
const bundle=()=>JSON.stringify({v:1,pub:S.pub,adm:S.admId,posts:S.posts.slice(-100),mk:S.mk.slice(-100),items:S.relay,msgs:S.msgs.slice(-300),tun:S.tun});
async function fEx(){return`<div class="k"><h3>Envoyer ma valise</h3><p class="m">Publications, annonces, paiements et messages chiffrés dans un seul fichier. Envoie-le par <b>Bluetooth</b> ou <b>WhatsApp</b> : chaque téléphone relaie à son tour.</p><button onclick="shareB()">📤 Partager</button><button class="s" onclick="dl()">⬇️ Enregistrer</button></div>
<div class="k"><h3>Recevoir une valise</h3><input type="file" id="fi" onchange="rf(this)"><textarea id="ft" rows="3" placeholder="…ou colle ici le texte reçu"></textarea><button onclick="imp($('#ft').value)">Importer</button></div>
<div class="k"><h3>Sauvegarde de l'application</h3><small>Le fichier Mbolo-Tam-Tam.html peut lui-même être partagé à un ami (Bluetooth, WhatsApp).</small></div>`}
async function shareB(){const f=new File([bundle()],'valise-tamtam.txt',{type:'text/plain'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Valise Mbolo Tam Tam'});else if(navigator.share)await navigator.share({title:'Valise Mbolo Tam Tam',text:bundle()});else dl()}catch(e){}}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bundle()],{type:'text/plain'}));a.download='valise-tamtam.txt';a.click()}
function rf(i){const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(i.files[0])}
async function imp(t){let b;try{b=JSON.parse(t)}catch(e){return toast('Fichier illisible')}
if(!S.pub&&b.pub){S.pub=b.pub;S.admId=b.adm}let n=0,c=0;
const ids=new Set(S.posts.map(p=>p.id)),im=new Set(S.mk.map(p=>p.id)),ms=new Set(S.msgs.map(p=>p.id));
for(const p of b.posts||[])if(!ids.has(p.id)){S.posts.push(p);n++}
for(const p of b.mk||[])if(!im.has(p.id)){S.mk.push(p);n++}
for(const p of b.msgs||[])if(!ms.has(p.id)){S.msgs.push(p);n++}
for(const[k,v]of Object.entries(b.tun||{}))S.tun[k]=S.tun[k]||v;
for(const it of b.items||[])c+=await take(it);save();toast(`${n} nouveautés · ${c} crédit(s) reçu(s)`);draw()}
// ---- Admin / relais
async function fAdm(){return`<div class="k"><h3>🛡️ Relais certifié</h3><p class="m">Après réception du Mobile Money, colle le code membre : 1 000 FCFA = 10 CC.</p><textarea id="ac" rows="3" placeholder="Code membre"></textarea><input id="af" type="number" placeholder="Montant payé en FCFA (ex. 1000)"><button onclick="issue()">Générer le bon</button></div><div class="k"><h3>Publication officielle</h3><small>Tes posts sont marqués « officiel » dans le Fil.</small></div>`}
async function issue(){let m;try{m=JSON.parse(atob($('#ac').value.trim()))}catch(e){return toast('Code invalide')}const f=parseInt($('#af').value);if(!(f>0))return toast('Montant requis');
const d=Math.round(f/10),cert=await sign({t:'c',id:m.id,k:m.k},S.adm),v=await sign({t:'v',id:'V'+R(10),to:m.id,d,exp:Date.now()+30*DAY},S.adm);
const txt=JSON.stringify({v:1,pub:S.pub,adm:S.admId,items:[cert,v]});S.led.unshift({ts:Date.now(),m:`Bon émis pour ${m.id} (${f} FCFA)`,d:0});save();
const file=new File([txt],'bon-tamtam.txt',{type:'text/plain'});try{await navigator.share({files:[file],title:`Bon ${cc(d)}`})}catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt]));a.download='bon-tamtam.txt';a.click()}toast(`Bon de ${cc(d)} prêt`)}
async function enableAdm(){if(!confirm('Devenir le relais certifié de ce réseau ? À faire une seule fois, sur TON téléphone.'))return;S.adm=S.k.prv;S.pub=S.k.pub;S.admId=S.me.id;S.cert=await sign({t:'c',id:S.me.id,k:S.k.pub},S.adm);save();draw()}
draw();
</script>
<script>
// ===== PWA : Enregistrement du Service Worker (hors-ligne) =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
<script>
// ===== PONT NATIF ANDROID (ignoré dans un navigateur / PWA) =====
(function(){
  if (typeof Android === 'undefined') return;

  function natShare(txt, name) {
    try { Android.share(txt, name || 'valise-tamtam.txt'); }
    catch(e) { try { toast('Partage impossible'); } catch(_){} }
  }

  try {
    var _click = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function(){
      if (this.download && this.href && this.href.indexOf('blob:') === 0) {
        fetch(this.href).then(function(r){return r.text()})
          .then(function(t){ natShare(t, this.download) }.bind(this))
          .catch(function(){ try{ toast('Lecture impossible'); }catch(_){} });
        return;
      }
      return _click.call(this);
    };
  } catch(e) {}

  if (typeof bundle === 'function') {
    window.dl     = function(){ natShare(bundle(), 'valise-tamtam.txt'); };
    window.shareB = function(){ natShare(bundle(), 'valise-tamtam.txt'); };
    window.saveLocal = function(){ try { toast(Android.save(bundle(), 'valise-tamtam.txt')); } catch(e){} };
  }

  try {
    Object.defineProperty(navigator, 'clipboard', {
      value: { writeText: function(t){ Android.copy(String(t)); return Promise.resolve(); } },
      configurable: true
    });
  } catch(e) {}

  if (!window.crypto || !window.crypto.subtle) {
    setTimeout(function(){ try{ toast('⚠️ Chiffrement indisponible : HTTPS requis'); }catch(_){} }, 800);
  }
})();
</script>
</body></html>
