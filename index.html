      // 1. On crée d'abord le profil
      await set(ref(db, "users/" + u.uid), prof); 
      // 2. On crée le code d'accès seulement si l'étape 1 a réussi
      await set(ref(db, "ids/" + code), u.uid); 
      return prof; 
    } catch (e) { 
      console.error("Erreur création profil:", e); 
    }
  }
  return null;
}

async function initUser(u) {
  clearL(); S = fresh(); S.uid = u.uid; lastBal = null;
  const g = async p => { try { return (await get(ref(db, p))).val(); } catch (e) { return null; } };
  S.admin = (await g("admins/" + u.uid)) === true; S.mod = (await g("moderators/" + u.uid)) === true; S.susp = await g("suspended/" + u.uid);
  
  let p = await g("users/" + u.uid);
  if (!p) p = await createProfile(u);
  
  if (!p) { 
    toast("Erreur de création de profil"); 
    draw(); // Affiche l'écran d'erreur propre ajouté dans draw()
    return; 
  }

  Object.assign(S, { name: p.name, code: p.code, avatar: p.avatar, bio: p.bio || "", age: p.age, address: p.address || "" });
  try { S.tun = JSON.parse(localStorage["mbolo_tun_" + u.uid] || "{}"); } catch (e) {}

  listen(ref(db, "users/" + u.uid + "/bal"), s => {
    const newBal = s.val() || 0;
    if (lastBal !== null && newBal !== lastBal && newBal > lastBal) notifyUser("💰 Crédit reçu", "Ton solde a augmenté de " + kc(newBal - lastBal) + ".");
    lastBal = newBal; S.bal = newBal; nav(); soft("w");
  });
  listen(ref(db, "users/" + u.uid + "/hist"), s => { S.hist = toArr(s).sort((a,b) => b.ts - a.ts).slice(0, 20); soft("w"); });

  let firstInbox = true;
  listen(ref(db, "inbox/" + u.uid), s => {
    const n = toArr(s).sort((a,b) => b.ts - a.ts);
    if (!firstInbox && n.length > S.notifs.length) notifyUser("🔔 Notification", n[0].txt);
    firstInbox = false; S.notifs = n;
    const badge = $("#notif-badge"); if (badge) badge.style.display = n.length ? "flex" : "none";
    soft("w");
  });

  listen(ref(db, "config/freeze"), s => { S.freeze = s.val() === true; soft("w"); soft("adm"); });
  
  listen(query(ref(db, "posts"), orderByKey(), limitToLast(50)), s => { S.posts = toArr(s); soft("feed"); });
  listen(query(ref(db, "marketplace"), orderByKey(), limitToLast(30)), s => { S.mk = toArr(s); soft("mk"); });
  
  listen(ref(db, "directory"), s => { S.dir = toArr(s); soft("contact"); });
  if (S.admin) { listen(ref(db, "recharges"), s => { A.rech = s.val() || {}; soft("adm"); }); listen(ref(db, "transfer_requests"), s => { A.tr = s.val() || {}; soft("adm"); }); }
  if (S.admin || S.mod) listen(ref(db, "reports"), s => { A.rep = s.val() || {}; soft("adm"); });

  draw();
  if (notifState() === "granted") saveToken(); else armAutoPrompt();
}

    <input id="dq" maxlength="40" placeholder="Quartier / Ville" value="${esc(me.qu || '')}">
    <input id="dw" type="tel" placeholder="WhatsApp (ex. 24177…)" value="${esc(me.wa || '')}">
    <label class="m" style="display:flex;gap:8px;margin-top:8px"><input type="checkbox" id="dk" style="width:auto" ${me.id ? "checked" : ""}> J'accepte que mon numéro soit visible</label>
    <button onclick="regDir()" style="width:100%;margin-top:8px">Publier</button>${me.id ? '<button class="s" onclick="delDir()" style="width:100%">Retirer ma carte</button>' : ""}</div>

  <h3>Annuaire</h3>
  <input placeholder="🔍 Rechercher un prof, un commerce, un quartier…" oninput="setSearch(this.value)" value="${esc(dirSearch)}">
  ${D.sort((a, b) => b.ts - a.ts).map(c => `<div class="k"><b>${esc(c.n)}</b>${badge(c.cat)}<br><small>📍 ${esc(c.qu || '')}</small><a href="https://wa.me/${esc(c.wa)}" target="_blank"><button class="wa">💬 WhatsApp</button></a></div>`).join("") || "<p class='m'>Aucun résultat.</p>"}`;
}
async function updateProfile() {
  const n = $("#pn").value.trim(), bio = $("#pbio").value.trim(), age = $("#page").value, addr = $("#paddr").value.trim(), f = $("#pavimg").files[0];
  if (!n || n.length < 2) return toast("Nom invalide");
  const updates = { name: n, bio, age: parseInt(age) || null, address: addr };
  if (f) { const url = await upImg(f); if (url) updates.avatar = url; }
  try { await update(ref(db, "users/" + S.uid), updates); Object.assign(S, updates); toast("Profil mis à jour !"); draw(); } catch(e) { toast("Erreur"); }
}
async function regDir() {
  const n = $("#dn").value.trim(), wa = $("#dw").value.replace(/\D/g, "");
  if (n.length < 2 || wa.length < 8 || wa.length > 15) return toast("Nom et WhatsApp valides requis");
  if (!$("#dk").checked) return toast("Coche l'autorisation d'affichage");
  try { await set(ref(db, "directory/" + S.uid), { n, cat: $("#dc").value, qu: $("#dq").value.trim(), wa, ok: true, ts: Date.now() }); toast("Carte publiée !"); draw(); } catch (e) { toast("Refusé"); }
}
async function delDir() { try { await remove(ref(db, "directory/" + S.uid)); toast("Carte retirée"); draw(); } catch (e) { toast("Erreur"); } }

// ---------- Admin / Modération ----------
function fAdm() {
  const rech = Object.entries(A.rech).filter(([k, r]) => r.status === "pending"), tr = Object.entries(A.tr).filter(([k, r]) => r.s === "p"), rep = Object.entries(A.rep).filter(([k, r]) => r.s === "open");
  let h = "";
  if (S.admin) {
    h += `<div class="k"><h3>⚙️ Système</h3><button class="${S.freeze ? "r" : "s"}" onclick="toggleFreeze()" style="width:100%">${S.freeze ? "🔴 Dégeler les opérations d'argent" : "🟢 Geler les opérations d'argent"}</button></div>
    <div class="k"><h3>👤 Gérer un compte</h3><input id="ac" maxlength="6" placeholder="Code (6 car.)"><input id="aw" placeholder="Motif (suspension)"><input id="aa" type="number" step="0.1" placeholder="KC à créditer"><button onclick="credit()">➕ Créditer</button><button class="r" onclick="suspend(1)">🚫 Suspendre</button><button class="s" onclick="suspend(0)">Lever</button>
    <div style="border-top:1px solid var(--l);margin-top:10px;padding-top:10px"><p class="m">Gérer les modérateurs :</p><button class="s" onclick="setMod(1)">⭐ Nommer Modo</button><button class="s" onclick="setMod(0)">Retirer Modo</button></div></div>
    <div class="k"><h3>📥 Recharges (${rech.length})</h3>${rech.map(([k, r]) => `<div class="h-item"><div>${esc(r.name)} · ${r.amountFCFA} FCFA${r.ref ? "<br><small>Réf : " + esc(r.ref) + "</small>" : ""}</div><div><button onclick="okRech('${k}')">✅</button><button class="r" onclick="noRech('${k}')">❌</button></div></div>`).join("") || "<p class='m'>Rien.</p>"}</div>
    <div class="k"><h3>🔄 Envois/Retraits (${tr.length})</h3>${tr.map(([k, r]) => `<div class="h-item"><div>${r.t === "wd" ? "💸 Retrait" : "🔁 Envoi"} · ${esc(r.fn)} · ${kc(r.a)}<br><small>${r.t === "wd" ? "Payer " + fc(r.a - Math.round(r.a * CFG.FEE_WD)) + " au " + esc(r.m) : "→ " + esc(r.to) + " · " + esc(r.m || '')}</small></div><div><button onclick="okTr('${k}')">✅</button><button class="r" onclick="noTr('${k}')">❌</button></div></div>`).join("") || "<p class='m'>Rien.</p>"}</div>`;
  }
  return h + `<div class="k"><h3>🚩 Signalements (${rep.length})</h3>${rep.map(([k, r]) => `<div style="border-bottom:1px solid var(--l);padding:10px 0"><b>${esc(r.kind)}</b> <small>${esc(r.ref)}</small><br><small>${esc(r.why)}</small><br><button class="r" onclick="rmRep('${k}')">🗑️ Retirer</button><button class="s" onclick="doneRep('${k}')">Classer</button></div>`).join("") || "<p class='m'>Aucun signalement.</p>"}</div>`;
}
const guard = async f => { try { await f(); } catch (e) { console.error(e); toast("Erreur : " + (e.code || e.message)); } };
const toggleFreeze = () => guard(async () => { await set(ref(db, "config/freeze"), !S.freeze); });
const log = (o) => ({ ["log/" + nid("log")]: { by: S.uid, ts: Date.now(), ...o } });
const byCode = async c => (await get(ref(db, "ids/" + c))).val();

const credit = () => guard(async () => {
  const c = $("#ac").value.trim().toUpperCase(), a = Math.round(parseFloat($("#aa").value) * 10);
  if (!c || !(a > 0)) return toast("Code et montant requis");
  const u = await byCode(c); if (!u) return toast("Code inconnu");
  const b = (await get(ref(db, "users/" + u + "/bal"))).val() || 0;
  await update(ref(db), { ["users/" + u + "/bal"]: b + a, ["users/" + u + "/hist/" + nid("h")]: { t: "topup", txt: "Recharge admin", a, ts: Date.now() }, ...log({ t: "credit", to: c, a, fee: 0 }) }); toast("Crédité ✅");
});

const suspend = on => guard(async () => {
  const c = $("#ac").value.trim().toUpperCase(), w = $("#aw").value.trim(), u = await byCode(c); if (!u) return toast("Code inconnu");
  if (on) { if (w.length < 3) return toast("Motif requis"); await set(ref(db, "suspended/" + u), { why: w.slice(0, 200), ts: Date.now() }); toast("Compte suspendu"); }
  else { await remove(ref(db, "suspended/" + u)); toast("Suspension levée"); }
});

const setMod = on => guard(async () => {
  const c = $("#ac").value.trim().toUpperCase(), u = await byCode(c); if (!u) return toast("Code inconnu");
  if (on) { await set(ref(db, "moderators/" + u), true); toast("Modérateur nommé ⭐"); }
  else { await remove(ref(db, "moderators/" + u)); toast("Modérateur retiré"); }
});

const okRech = k => guard(async () => {
  const r = A.rech[k]; if (!r || r.status !== "pending" || !confirm("Créditer " + kc(r.amountKC) + " à " + r.name + " ?")) return;
  const b = (await get(ref(db, "users/" + r.uid + "/bal"))).val() || 0;
  await update(ref(db), {
    ["users/" + r.uid + "/bal"]: b + r.amountKC,
    ["users/" + r.uid + "/hist/" + nid("h")]: { t: "topup", txt: "Recharge validée", a: r.amountKC, ts: Date.now() },
    ["recharges/" + k + "/status"]: "validated",
    ...log({ t: "topup", f: r.name, a: r.amountKC, fee: 0 })
  }); toast("Validé ✅");
});
const noRech = k => guard(() => update(ref(db), { ["recharges/" + k + "/status"]: "rejected" }));

const okTr = k => guard(async () => {
  const r = A.tr[k]; if (!r || r.s !== "p" || !confirm("Valider cette opération ?")) return;
  const fee = Math.round(r.a * (r.t === "wd" ? CFG.FEE_WD : CFG.FEE_TR)), B = {}, bal = async u => B[u] ??= (await get(ref(db, "users/" + u + "/bal"))).val() || 0;
  if (await bal(r.f) < r.a) return toast("Solde insuffisant");
  B[r.f] -= r.a;
  let toId = null;
  if (r.t === "tr") { toId = await byCode(r.to); if (!toId) return toast("Destinataire inconnu"); await bal(toId); B[toId] += r.a - fee; }
  await bal(S.uid); B[S.uid] += fee;

  const U = {
    ["transfer_requests/" + k + "/s"]: "ok",
    ["users/" + r.f + "/hist/" + nid("h")]: { t: r.t, txt: r.t === 'wd' ? "Retrait demandé" : "Envoi vers " + (r.to||""), a: -r.a, ts: Date.now() },
    ...log({ t: r.t, f: r.fn, to: r.to || "", a: r.a, fee })
  };
  if (toId) U["users/" + toId + "/hist/" + nid("h")] = { t: "tr", txt: "Reçu de " + r.fn, a: r.a - fee, ts: Date.now() };
  for (const u in B) U["users/" + u + "/bal"] = B[u];
  await update(ref(db), U); toast(r.t === "wd" ? "Validé : pense à payer par Airtel Money" : "Validé ✅");
});
const noTr = k => guard(() => update(ref(db), { ["transfer_requests/" + k + "/s"]: "no" }));
const doneRep = k => guard(() => update(ref(db), { ["reports/" + k + "/s"]: "done" }));
const rmRep = k => guard(async () => {
  const r = A.rep[k]; if (!r) return;
  if (r.kind === "post") await remove(ref(db, "posts/" + r.ref));
  else if (r.kind === "listing") await remove(ref(db, "marketplace/" + r.ref));
  await update(ref(db), { ["reports/" + k + "/s"]: "done" }); toast("Contenu retiré");
});

// ---------- Export globals ----------
Object.assign(window, {
  go, out, setMode, submitAuth,
  setF, pub, delPost, report,
  sell, delMk, buy,
  fTun, mkT, joinT, op, snd, delMsg,
  reqRech, reqTr, reqWd, readNotif, delAcc,
  setSearch, updateProfile, regDir, delDir,
  toggleFreeze, credit, suspend, setMod, okRech, noRech, okTr, noTr, doneRep, rmRep,
  enableNotifs, laterNotif
});
draw();
</script>
</body></html>
