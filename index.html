<script type="module">

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let S = fresh(), A = { rech: {}, tr: {}, rep: {} }, OFF = [], tunOff = null, tab = "feed", openT = null, feedF = "all", TK = {}, mode = "login", amsg = "", ready = false, dirSearch = "";
let swReg = null, fcmHooked = false, notifLater = false, notifAsked = false, lastBal = null;

// Notifications & SW
const notifState = () => (!("Notification" in window) || !("serviceWorker" in navigator)) ? "unsupported" : Notification.permission;
async function getSW() { 
  if (swReg) return swReg; if (!("serviceWorker" in navigator)) return null; 
  try { await navigator.serviceWorker.register(SW_URL, { scope: "./" }); swReg = await navigator.serviceWorker.ready; return swReg; } catch(e) { return null; }
}
async function notifyUser(title, body) { 
  if (notifState() !== "granted") return; 
  try { const reg = await getSW(); await reg.showNotification(title, { body, icon: "icon-192.png", badge: "icon-192.png", vibrate: [200, 100, 200], tag: "mbolo-event" }); } catch (e) {} 
}
async function saveToken(silent) {
  if (notifState() !== "granted" || !S.uid) return false;
  try {
    const messaging = await FB.msgP; if (!messaging) return false;
    const reg = await getSW(); if (!reg) return false;

getSW().catch(console.warn);

// Cryptographie
const E = new TextEncoder(), b64 = u => { u = new Uint8Array(u); let s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); }, ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tk(id, pw) { const m = await crypto.subtle.importKey("raw", E.encode(pw), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({ name: "PBKDF2", salt: E.encode(id), iterations: 100000, hash: "SHA-256" }, m, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); }
async function enc(k, t) { const iv = crypto.getRandomValues(new Uint8Array(12)); return b64(iv) + "." + b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, E.encode(t))); }
async function dec(k, c) { try { const [a, b] = c.split("."); return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(a) }, k, ub(b))); } catch (e) { return null; } }

// Images
const shrink = f => new Promise(res => { const im = new Image(); im.onload = () => { const r = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = im.width * r; c.height = im.height * r; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src); c.toBlob(b => res(b || f), "image/jpeg", 0.8); }; im.onerror = () => res(f); im.src = URL.createObjectURL(f); });
async function upImg(f) { load(true); try { const fd = new FormData(); fd.append("file", await shrink(f)); fd.append("upload_preset", CFG.PRESET); const j = await (await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD}/image/upload`, { method: "POST", body: fd })).json(); if (!j.secure_url) throw 0; return j.secure_url; } catch (e) { toast("Image refusée."); return null; } finally { load(false); } }

  const T = [ ["feed", "🏠", "Accueil"], ["tun", "👥", "Groupes"], ["mk", "🛍️", "Marché"], ["w", "🔔", "Notifs"], ["contact", "👤", "Profil"] ];

  nav(); const v=$("#v");

    if (!ready) { v.innerHTML = "<p class='m' style='text-align:center;padding:40px'>Chargement…</p>"; return; }

    v.innerHTML = ban + await ({ feed: fFeed, mk: fMk, tun: fTun, w: fW, contact: fContact, adm: fAdm }[tab] || fFeed)();

// Auth & Profil
const setMode = m => { mode = m; amsg = ""; draw(); };
function fAuth() {
  const L = mode === "login";
  return `<div class="k"><h2 style="color:var(--g);text-align:center;font-size:24px">Mbolo</h2>
  <div class="row" style="justify-content:center;gap:10px;margin-bottom:15px"><button class="${L ? "on" : "s"}" onclick="setMode('login')">Connexion</button><button class="${!L ? "on" : "s"}" onclick="setMode('reg')">Créer un compte</button></div>

}
async function createProfile(u) {
  const name = u.email.split("@")[0];
  for (let i = 0; i < 5; i++) {
    const code = genCode(), prof = { name, code, bal: 0, joined: Date.now(), tos: Date.now(), avatar: null, bio: "", age: null, address: "" };
    try { await update(ref(db), { ["users/" + u.uid]: prof, ["ids/" + code]: u.uid }); return prof; } catch (e) { }

}
async function initUser(u) {
  clearL(); S = fresh(); S.uid = u.uid;
  const g = async p => { try { return (await get(ref(db, p))).val(); } catch (e) { return null; } };
  S.admin = (await g("admins/" + u.uid)) === true; S.mod = (await g("moderators/" + u.uid)) === true; S.susp = await g("suspended/" + u.uid);

  try { S.tun = JSON.parse(localStorage["mbolo_tun_" + u.uid] || "{}"); } catch (e) { }
  
  listen(ref(db, "users/" + u.uid + "/bal"), s => { 
    const newBal = s.val() || 0; 
    if (lastBal !== null && newBal !== lastBal && newBal > lastBal) notifyUser("💰 Crédit reçu", "Ton solde a augmenté de " + kc(newBal - lastBal) + ".");

  listen(ref(db, "inbox/" + u.uid), s => { 
    const n = toArr(s).sort((a,b) => b.ts - a.ts); 
    if (!firstInbox && n.length > S.notifs.length) notifyUser("🔔 Notification", n[0].txt);
    firstInbox = false; S.notifs = n; 
    const badge = $("#notif-badge"); if (badge) badge.style.display = n.length ? "flex" : "none";
    soft("w"); 
  });
  
  listen(ref(db, "config/freeze"), s => { S.freeze = s.val() === true; soft("w"); soft("adm"); });
  listen(query(ref(db, "posts"), limitToLast(50)), s => { S.posts = toArr(s); soft("feed"); });
  listen(query(ref(db, "marketplace"), limitToLast(30)), s => { S.mk = toArr(s); soft("mk"); });
  listen(ref(db, "directory"), s => { S.dir = toArr(s); soft("contact"); });
  if (S.admin) { listen(ref(db, "recharges"), s => { A.rech = s.val() || {}; soft("adm"); }); listen(ref(db, "transfer_requests"), s => { A.tr = s.val() || {}; soft("adm"); }); }
  if (S.admin || S.mod) listen(ref(db, "reports"), s => { A.rep = s.val() || {}; soft("adm"); });
  
  draw();
  if (notifState() === "granted") saveToken(true); else armAutoPrompt();
}
FB.onAuthStateChanged(auth, u => { ready = true; if (u) { S.uid = u.uid; draw(); initUser(u); } else { clearL(); S = fresh(); draw(); } });

// Feed & Posts
const setF = f => { feedF = f; draw(); };
const badge = c => c === "edu" ? '<span class="bd">📚 Éducation</span>' : c === "com" ? '<span class="bd c">🛍️ Commerce</span>' : c === "ann" ? '<span class="bd a">📢 Officiel</span>' : c === "local" ? '<span class="bd">📍 Vie locale</span>' : c === "culture" ? '<span class="bd">🥁 Culture</span>' : c === "business" ? '<span class="bd">💼 Business</span>' : c === "sport" ? '<span class="bd">⚽ Sport</span>' : "";

function fFeed() {
  const P = S.posts.filter(p => feedF === "all" || p.cat === feedF).sort((a, b) => b.ts - a.ts);
  return `<div class="wallet-card" onclick="go('w')"><div style="font-size:13px;opacity:.8">Mon portefeuille</div><div class="bal">${kc(S.bal)}</div><button style="background:var(--y);color:#222;padding:8px 15px;border-radius:10px;font-weight:bold">Découvrir</button></div>
  
  <h3 style="margin:0 0 10px;font-size:16px">Stories</h3>
  <div class="stories-scroll">
    <div class="story" onclick="document.getElementById('px').focus()"><div class="img"><span style="font-size:24px">+</span></div><span>Ajouter</span></div>
    <div class="story" onclick="setF('local')"><div class="img" style="background:#f0e6d2">📍</div><span>Vie locale</span></div>
    <div class="story" onclick="setF('culture')"><div class="img" style="background:#e2f0d9">🥁</div><span>Culture</span></div>
    <div class="story" onclick="setF('business')"><div class="img" style="background:#d9e2f3">💼</div><span>Business</span></div>
    <div class="story" onclick="setF('sport')"><div class="img" style="background:#fce4d6">⚽</div><span>Sport</span></div>
  </div>

  <div class="row" style="overflow-x:auto;gap:8px;margin-bottom:12px;padding-bottom:5px">
    <button class="${feedF === "all" ? "on" : "s"}" onclick="setF('all')">Tout</button>
    <button class="${feedF === "edu" ? "on" : "s"}" onclick="setF('edu')">📚 Éducation</button>
    <button class="${feedF === "com" ? "on" : "s"}" onclick="setF('com')">🛍️ Commerce</button>
  </div>

  <div class="k">
    <div class="post-header"><div class="post-avatar">${S.avatar ? `<img src="${esc(S.avatar)}">` : S.name.charAt(0).toUpperCase()}</div><div class="post-meta"><b>Mon espace</b></div></div>
    <textarea id="px" rows="2" maxlength="1000" placeholder="Partage une info…"></textarea>
    <input type="file" id="pimg" accept="image/*" style="font-size:12px;padding:8px">
    <select id="pcat"><option value="gen">Discussion</option><option value="local">📍 Vie locale</option><option value="culture">🥁 Culture</option><option value="business">💼 Business</option><option value="sport">⚽ Sport</option><option value="edu">📚 Éducation</option><option value="com">🛍️ Commerce</option>${S.admin ? '<option value="ann">📢 Officiel</option>' : ""}</select>
    <button id="pb" onclick="pub()" style="width:100%">Publier</button>
  </div>` +
  (P.map(p => `<div class="k">
    <div class="post-header"><div class="post-avatar">${p.av ? `<img src="${esc(p.av)}">` : esc(p.n).charAt(0).toUpperCase()}</div><div class="post-meta"><b>${esc(p.n)} ${badge(p.cat)}</b><small>${ago(p.ts)}</small></div></div>
    <div class="post-content">${esc(p.x)}</div>${img(p.thumb)}
    <div class="post-actions">
      <span onclick="toast('Commentaires bientôt')">💬 Commenter</span>
      <span onclick="toast('Partage bientôt')">↗️ Partager</span>
      ${p.a === S.uid || S.admin || S.mod ? `<button onclick="delPost('${p.id}')">🗑️</button>` : ""}
    </div>
  </div>`).join("") || "<p class='m' style='text-align:center'>Aucune publication.</p>");
}

async function pub() {
  const x = $("#px").value.trim(), f = $("#pimg").files[0]; if (!x) return toast("Écris un texte");
  $("#pb").disabled = true;
  try { 
    const d = { a: S.uid, n: S.name, av: S.avatar, x, cat: $("#pcat").value, ts: Date.now() }; 
    if (f) { const u = await upImg(f); if (u) d.thumb = u; } 
    await push(ref(db, "posts"), d); toast("Publié !"); 
  } catch (e) { toast("Erreur de publication"); } finally { draw(); }
}
async function delPost(id) { if (confirm("Supprimer ?")) try { await remove(ref(db, "posts/" + id)); } catch (e) { toast("Erreur"); } }

// Profil
async function updateProfile() {
  const n = $("#pn").value.trim(), bio = $("#pbio").value.trim(), age = $("#page").value, addr = $("#paddr").value.trim(), f = $("#pavimg").files[0];
  if (!n || n.length < 2) return toast("Nom invalide");
  const updates = { name: n, bio, age: parseInt(age) || null, address: addr };
  if (f) { const url = await upImg(f); if (url) updates.avatar = url; }
  try { await update(ref(db, "users/" + S.uid), updates); Object.assign(S, updates); if (updates.avatar) S.avatar = updates.avatar; toast("Profil mis à jour !"); draw(); } catch(e) { toast("Erreur"); }
}

function fContact() {
  return `<div class="k">
    <h3>👤 Mon Profil</h3>
    <div style="display:flex;align-items:center;gap:15px;margin-bottom:15px">
      <div class="post-avatar" style="width:70px;height:70px;font-size:28px">${S.avatar ? `<img src="${esc(S.avatar)}">` : S.name.charAt(0).toUpperCase()}</div>
      <div style="flex:1"><input type="file" id="pavimg" accept="image/*" style="margin:0;padding:8px;font-size:12px"></div>
    </div>
    <input id="pn" maxlength="40" placeholder="Nom d'affichage" value="${esc(S.name)}">
    <textarea id="pbio" rows="2" maxlength="150" placeholder="Bio…">${esc(S.bio)}</textarea>
    <div class="row"><input id="page" type="number" placeholder="Âge" value="${S.age || ''}" style="flex:1"><input id="paddr" placeholder="Ville" value="${esc(S.address)}" style="flex:2"></div>
    <button onclick="updateProfile()" style="width:100%;margin-top:10px">Enregistrer</button>
  </div>
  <div class="k">
    <h3>📇 Annuaire</h3>
    <input id="dn" maxlength="40" placeholder="Boutique / Service" value="${esc(S.dir.find(d => d.id === S.uid)?.n || '')}">
    <input id="dq" placeholder="Quartier" value="${esc(S.dir.find(d => d.id === S.uid)?.qu || '')}">
    <input id="dw" type="tel" placeholder="WhatsApp" value="${esc(S.dir.find(d => d.id === S.uid)?.wa || '')}">
    <label class="m" style="display:flex;gap:8px;margin:8px 0"><input type="checkbox" id="dk" style="width:auto" ${S.dir.some(d => d.id === S.uid) ? "checked" : ""}> Visible publiquement</label>
    <button onclick="regDir()" style="width:100%">Publier</button>
  </div>`;
}
async function regDir() { 
  const n = $("#dn").value.trim(), wa = $("#dw").value.replace(/\D/g, ""); 
  if (n.length < 2 || wa.length < 8) return toast("Champs invalides"); 
  if (!$("#dk").checked) { await remove(ref(db, "directory/" + S.uid)); toast("Retiré"); return draw(); }
  try { await set(ref(db, "directory/" + S.uid), { n, cat: "com", qu: $("#dq").value.trim(), wa, ok: true, ts: Date.now() }); toast("Publié !"); draw(); } catch (e) { toast("Erreur"); } 
}

// Wallet
function fW() {
  const fz = S.freeze ? " disabled" : "";
  const histHtml = S.hist.length ? S.hist.map(h => `<div style="border-bottom:1px solid var(--l);padding:10px 0"><div class="row"><div><b>${esc(h.txt)}</b><br><small class="m">${ago(h.ts)}</small></div><div style="color:${h.a > 0 ? "var(--g)" : "var(--d)"};font-weight:bold">${h.a > 0 ? '+' : ''}${kc(h.a)}</div></div></div>`).join("") : "<p class='m'>Aucune transaction.</p>";
  const notifHtml = S.notifs.length ? S.notifs.map(n => `<div style="border-bottom:1px solid var(--l);padding:10px 0"><div class="row"><span>${esc(n.txt)}</span><button onclick="readNotif('${n.id}')" style="background:none;color:var(--m);padding:0">✔</button></div><small>${ago(n.ts)}</small></div>`).join("") : "<p class='m'>Aucune notification.</p>";
  
  return `<div class="wallet-card" style="flex-direction:column;align-items:flex-start"><div style="opacity:.8">Solde</div><div class="bal">${kc(S.bal)}</div><small>≈ ${fc(S.bal)}</small></div>
  <div class="k"><h3>🔔 Notifications</h3>${notifHtml}</div>
  <div class="k"><h3>🛒 Acheter</h3><input id="ra" type="number" placeholder="FCFA (min 500)"><button onclick="reqRech()"${fz} style="width:100%">Déclarer</button><a href="https://wa.me/${CFG.AIRTEL}?text=KC" target="_blank"><button class="wa">WhatsApp</button></a></div>
  <div class="k"><h3>Envoyer</h3><input id="wt" maxlength="6" placeholder="Code destinataire"><input id="wd" type="number" placeholder="Montant KC"><button onclick="reqTr()"${fz} style="width:100%">Envoyer</button></div>
  <div class="k"><h3>💸 Retirer</h3><input id="xk" type="number" placeholder="KC (min 5)"><input id="xn" type="tel" placeholder="Numéro Airtel"><button onclick="reqWd()"${fz} style="width:100%">Retirer</button></div>
  <div class="k" style="text-align:center"><h3>Mon Code</h3><b style="font-size:26px;letter-spacing:4px;color:var(--g)">${esc(S.code)}</b></div>
  <div class="k"><h3>📜 Relevé</h3>${histHtml}</div>
  <div class="k" style="display:flex;gap:10px"><button class="s" onclick="delAcc()" style="flex:1">Supprimer</button><button class="r" onclick="out()" style="flex:1">Quitter</button></div>`;
}
async function readNotif(id) { try { await remove(ref(db, "inbox/" + S.uid + "/" + id)); } catch (e) { } }
async function send(path, d, msg) { if (S.freeze) return toast("Suspendu"); try { await push(ref(db, path), d); toast(msg); draw(); } catch (e) { toast("Erreur"); } }
function reqRech() { const a = parseInt($("#ra").value); if (!(a >= 500)) return toast("Min 500 FCFA"); send("recharges", { uid: S.uid, name: S.name, amountFCFA: a, amountKC: a / 10, status: "pending", ts: Date.now() }, "Déclaré."); }
function reqTr() { const to = $("#wt").value.trim().toUpperCase(), a = Math.round(parseFloat($("#wd").value) * 10); if (!/^[A-Z0-9]{6}$/.test(to) || to === S.code) return toast("Code invalide"); if (!(a >= 1) || a > S.bal) return toast("Solde insuffisant"); send("transfer_requests", { t: "tr", f: S.uid, fn: S.name, to, a, m: "Transfert", s: "p", ts: Date.now() }, "Demandé."); }
function reqWd() { const a = Math.round(parseFloat($("#xk").value) * 10), n = $("#xn").value.trim(); if (!(a >= 50) || a > S.bal) return toast("Min 5 KC"); if (n.length < 8) return toast("Numéro invalide"); send("transfer_requests", { t: "wd", f: S.uid, fn: S.name, a, m: n, s: "p", ts: Date.now() }, "Demandé."); }
async function delAcc() { if (S.bal > 0) return toast("Videz votre solde."); if (!confirm("Supprimer définitivement ?")) return; try { await update(ref(db), { ["users/" + S.uid]: null, ["ids/" + S.code]: null, ["directory/" + S.uid]: null }); await auth.currentUser.delete(); } catch (e) { toast("Erreur"); } }

// Marketplace & Groupes (Simplifiés pour la réponse)
function fMk() { return `<div class="k"><h3>Vendre</h3><input id="mt" placeholder="Titre"><input id="mp" type="number" placeholder="Prix KC"><button onclick="sell()" style="width:100%">Publier</button></div>` + (S.mk.map(l => `<div class="k"><b>${esc(l.t)}</b> - ${kc(l.d)}<br><small>${esc(l.n)}</small><button onclick="buy('${l.id}')" style="width:100%;margin-top:10px">Acheter</button></div>`).join("") || "<p class='m'>Vide.</p>"); }
async function sell() { const t = $("#mt").value.trim(), p = parseFloat($("#mp").value); if (!t || !(p >= 5)) return toast("Invalide"); try { await push(ref(db, "marketplace"), { a: S.uid, n: S.name, t, d: Math.round(p * 10), ts: Date.now() }); draw(); } catch (e) { toast("Erreur"); } }
async function buy(id) { const l = S.mk.find(m => m.id === id); if (l.d > S.bal) return toast("Fonds insuffisants"); toast("Fonctionnalité en cours de validation"); }

function fTun() { return `<div class="k"><h3>Groupes</h3><p class="m">Fonctionnalité disponible prochainement.</p></div>`; }

// Admin (Raccourci pour la réponse)
function fAdm() { return `<div class="k"><h3>Admin</h3><p>Recharges en attente : ${Object.keys(A.rech).length}</p></div>`; }
const guard = async f => { try { await f(); } catch (e) { toast("Erreur"); } };

Object.assign(window, { go, out, setMode, submitAuth, setF, pub, delPost, updateProfile, regDir, reqRech, reqTr, reqWd, readNotif, delAcc, enableNotifs, laterNotif });
draw();
</script>
</body></html>
