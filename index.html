<script type="module">
const E=new TextEncoder(),$=s=>document.querySelector(s),R=n=>Math.random().toString(36).slice(2,2+n).toUpperCase();
const AL={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'},DAY=864e5;

const ADMIN_PASSWORD = 'ADMIN2024'; // ⚠️ CHANGE CE MOT DE PASSE ICI
const AIRTEL_NUMBER = '24177765496'; // Ton numéro Airtel
const COMMISSION_RATE = 0.03; // 3% de commission

// --- ÉTAT LOCAL ---
let S; try{S=JSON.parse(localStorage.mtt)}catch(e){}
S=S||{me:null,bal:0,led:[],posts:[],mk:[],tun:{},msgs:[],used:{},relay:[],pub:null,adm:null,admId:null,until:0,bonus:0,cert:null,k:null,directory:[]};

// NETTOYAGE AUTO
if(!S.posts) S.posts = [];
if(!S.mk) S.mk = [];
if(!S.led) S.led = [];
if(!S.directory) S.directory = [];
if(!S.tun) S.tun = {};

// MIGRATION DES ANCIENS TUNNELS
for(let k in S.tun){ if(typeof S.tun[k] === 'string'){ S.tun[k] = { n: S.tun[k], type: 'edu' }; } }

const save=()=>{try{localStorage.mtt=JSON.stringify(S)}catch(e){toast('Sauvegarde impossible')}};

// --- FORMATAGE & UTILITAIRES ---
const kc=d=>(d/10).toFixed(1)+' KC',fc=d=>(d*10).toLocaleString('fr')+' FCFA';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>new Date(t).toLocaleString('fr',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const t=$('#to');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}

// --- CRYPTOGRAPHIE ---
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gen(){const k=await crypto.subtle.generateKey(AL,true,['sign','verify']);return{pub:await crypto.subtle.exportKey('jwk',k.publicKey),prv:await crypto.subtle.exportKey('jwk',k.privateKey)}}
const ik=(j,u)=>crypto.subtle.importKey('jwk',j,AL,false,[u]);
async function sign(o,prv){const p=JSON.stringify(o);return{p,s:b64(await crypto.subtle.sign(SG,await ik(prv,'sign'),E.encode(p)))}}
async function ver(it,pub){try{return await crypto.subtle.verify(SG,await ik(pub,'verify'),ub(it.s),E.encode(it.p))}catch(e){return false}}
async function tk(tid,pw){const m=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:E.encode(tid),iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(k,t){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,E.encode(t)))}
async function dec(k,c){try{const[a,b]=c.split('.');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(a)},k,ub(b)))}catch(e){return null}}

const TK={}; let tab='feed', openT=null, feedFilter='all';
let TABS=[['feed','🌐','Fil'],['mk','🏪','Marché'],['tun','🔒','Tunnels'],['w','💰','Wallet'],['contact','📞','Contact']];

}

function syncBalance() {

  const userRef = window.FB.ref(window.FB.db, 'users/' + S.me.id);
  window.FB.onValue(userRef, (snap) => {
    const data = snap.val();
    if(data && data.bal !== undefined) {
      S.bal = data.bal;
      $('#bl').textContent = kc(S.bal);
      if(tab === 'w') draw();

  });
}

        </div>
      </div>`; return;

  } catch (error) {

      <button class="danger" onclick="resetApp()" style="width:100%;margin-top:10px">Réparer l'application</button>

async function fFeed(){
  let P=[...(S.posts||[])].filter(p => p && p.ts);
  if (feedFilter === 'edu') P = P.filter(p => p.cat === 'edu');
  if (feedFilter === 'com') P = P.filter(p => p.cat === 'com');
  P.sort((a,b)=>b.ts-a.ts);

  const filterHTML = `
    <div class="filters">
      <button class="${feedFilter==='all'?'on':'s'}" onclick="setFilter('all')">Tout</button>
      <button class="${feedFilter==='edu'?'on':'s'}" onclick="setFilter('edu')">📚 Éducation</button>
      <button class="${feedFilter==='com'?'on':'s'}" onclick="setFilter('com')">🛍️ Commerce</button>
    </div>
  `;

  const postForm = `<div class="k">
    <textarea id="px" rows="3" placeholder="Partage une info..."></textarea>
    <select id="pcat" style="margin-bottom:8px">
      <option value="gen">Discussion Générale</option>
      <option value="edu">📚 Éducation / Cours</option>
      <option value="com">🛍️ Commerce / Promo</option>
    </select>
    <button onclick="publierFirebase()" style="width:100%">🚀 Publier sur le réseau</button>
  </div>`;

  const postList = P.map(p=>{
    let badge = p.cat === 'edu' ? '<span class="badge-edu">📚 Éducation</span>' : (p.cat === 'com' ? '<span class="badge-com">🛍️ Commerce</span>' : '');
    return `<div class="k">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <div><b>${esc(p.n)}</b> ${badge}</div>
        <small>${ago(p.ts)}</small>
      </div>
      <div class="post-content">${esc(p.x)}</div>
      ${p.a==S.me.id?'':`
        <div style="margin-top:10px;border-top:1px solid var(--l);padding-top:10px">
          <button class="tip" onclick="tip('${p.a}','${esc(p.n)}',10)">🔥 1 KC</button>
          <button class="tip" onclick="tip('${p.a}','${esc(p.n)}',50)">💎 5 KC</button>
          <button class="tip" onclick="tip('${p.a}','${esc(p.n)}',100)">👑 10 KC</button>
        </div>
      `}
    </div>`;
  }).join('') || '<p class="m" style="text-align:center;padding:20px">Aucune publication.</p>';

  return filterHTML + postForm + postList;

    window.FB.push(window.FB.ref(window.FB.db, 'posts'), postData);
    $('#px').value = ''; toast('Publié !');

};

function ecouterPosts() {
  if (!window.FB) return;

    if (!S.posts) S.posts = [];
    if (!S.posts.find(p => p.ts === post.ts)) {
      S.posts.push({ id: snapshot.key, a: post.a, n: post.n, x: post.x, cat: post.cat || 'gen', ts: post.ts });
      if (tab === 'feed') draw(); 
    }
  });
}

// TRANSFERT DE KC SÉCURISÉ VIA FIREBASE
async function transferKC(toId, amountKc, reason) {
  if(!window.FB) return false;
  if(S.bal < amountKc) { toast('Solde insuffisant'); return false; }
  
  const amountToSend = Math.round(amountKc); // En unités de base (10 = 1 KC)
  
  try {
    // 1. Débiter l'expéditeur
    await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + S.me.id), (currentData) => {
      if (currentData && currentData.bal >= amountToSend) {
        currentData.bal -= amountToSend;
      }
      return currentData;
    });

    // 2. Créditer le destinataire
    await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + toId), (currentData) => {
      if (currentData) { currentData.bal = (currentData.bal || 0) + amountToSend; }
      else { currentData = { bal: amountToSend, name: 'Inconnu' }; }
      return currentData;
    });

    // 3. Enregistrer dans l'historique Firebase
    window.FB.push(window.FB.ref(window.FB.db, 'transactions'), {
      from: S.me.id, to: toId, amount: amountToSend, reason: reason, ts: Date.now()
    });

    S.led.unshift({ts:Date.now(), m:'Envoi à '+toId+' ('+reason+')', d:-amountToSend});
    save(); return true;
  } catch(e) { toast('Erreur réseau'); return false; }
}

    const m = snap.val(); if(!m) return;
    if(!S.msgs) S.msgs = [];
    if(!S.msgs.find(x=>x.ts === m.ts)) { S.msgs.push({ i, ts: m.ts, n: m.n, c: m.c }); if(openT === i) draw(); }
  });
}

async function chat(){
  const i=openT, M=[], tunnelData = S.tun[i] || { n: 'Inconnu', type: 'edu' };
  for(const m of S.msgs.filter(m=>m.i==i).sort((a,b)=>a.ts-b.ts)){
    const t = await dec(TK[i], m.c);
    M.push(`<div style="margin-bottom:12px;text-align:${m.n===S.me.name?'right':'left'}">
      <small style="display:block;margin-bottom:4px">${esc(m.n)} · ${new Date(m.ts).toLocaleTimeString()}</small>
      <div style="display:inline-block;padding:10px 14px;border-radius:12px;background:${m.n===S.me.name?'var(--g)':'var(--l)'};color:${m.n===S.me.name?'#fff':'var(--t)'};max-width:80%">
        ${t==null?'<i class="m">🔒 Clé incorrecte</i>':esc(t)}
      </div>
    </div>`);
  }
  const inviteTxt = encodeURIComponent(`Salut ! Rejoins mon espace "${tunnelData.n}" sur Mbolo. L'ID est : ${i}.`);
  return `<div class="k" style="height:70vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <button class="s" onclick="go('tun')">← Retour</button>
      <b style="align-self:center">${esc(tunnelData.n)}</b><div></div>
    </div>
    <a href="https://wa.me/?text=${inviteTxt}" target="_blank" style="text-decoration:none"><button class="wa" style="background:#128C7E">📤 Inviter par WhatsApp</button></a>
    <div style="flex:1;overflow-y:auto;padding-right:5px;margin-top:10px" id="chat-box">${M.join('') || '<p class="m" style="text-align:center;margin-top:20px">Début de la conversation.</p>'}</div>
    <div style="display:flex;margin-top:10px;gap:8px">
      <input id="cm" placeholder="Message chiffré..." style="margin:0" onkeypress="if(event.key==='Enter')snd()">
      <button onclick="snd()" style="margin:0;padding:10px 16px">Envoyer</button>
    </div>
  </div>`;
}

window.snd = async () => {
  const t=$('#cm').value.trim(); if(!t)return;
  const c = await enc(TK[openT], t);
  const m = { ts: Date.now(), n: S.me.name, c };
  window.FB.push(window.FB.ref(window.FB.db, 'tunnels/'+openT), m);
  $('#cm').value='';
  if(!S.msgs.find(x=>x.ts === m.ts)) { S.msgs.push({ i: openT, ...m }); draw(); }
  setTimeout(()=>{const cb=$('#chat-box'); if(cb)cb.scrollTop=cb.scrollHeight;},100);
}

window.sendUser = async () => {
  const to=$('#wt').value.trim().toUpperCase(), d=Math.round(parseFloat($('#wd').value)*10);
  if(!to || !d || d<=0) return toast('ID et montant valides requis');
  if(to === S.me.id) return toast('Tu ne peux pas t\'envoyer des KC à toi-même');
  
  if(await transferKC(to, d, 'Transfert privé')){ toast('Envoi réussi !'); draw(); }
}

window.registerDir = async () => {
  const n = $('#dn').value.trim(), cat = $('#dcat').value, qu = $('#dqu').value.trim(), wa = $('#dwa').value.trim();
  if(!n || !wa) return toast('Nom et WhatsApp requis');
  const item = { a: S.me.id, n: n, cat: cat, qu: qu, wa: wa, ts: Date.now() };
  try {
    window.FB.push(window.FB.ref(window.FB.db, 'directory'), item);
    S.directory.push(item); save(); draw(); toast('Inscrit !');
  } catch(e) { toast('Erreur réseau'); }
}

function ecouterAnnuaire() {
  if (!window.FB) return;
  window.FB.onChildAdded(window.FB.ref(window.FB.db, 'directory'), (snapshot) => {
    const item = snapshot.val(); if (!item) return;
    if (!S.directory) S.directory = [];
    if (!S.directory.find(d => d.ts === item.ts)) { S.directory.push(item); if (tab === 'contact') draw(); }
  });
}

let isAdminAuthenticated = false;

async function fAdm(){
  if(!isAdminAuthenticated) {
    return `<div class="k" style="text-align:center;padding:30px">
      <h3>🛡️ Zone Admin</h3>
      <p class="m">Entre le mot de passe pour gérer les recharges.</p>
      <input type="password" id="admPass" placeholder="Mot de passe Admin">
      <button onclick="checkAdmin()" style="width:100%">Se connecter</button>
    </div>`;
  }

  // Si authentifié, on affiche le dashboard
  return `<div class="k">
    <h3>🛡️ Tableau de Bord</h3>
    <p class="m">Bienvenue Admin. Voici les demandes de recharge à traiter.</p>
    <div id="admin-recharges"><p class="m">Chargement...</p></div>
  </div>`;
}

window.checkAdmin = () => {
  const pass = $('#admPass').value;
  if(pass === ADMIN_PASSWORD) {
    isAdminAuthenticated = true;
    // Créer le compte admin dans Firebase si pas existant
    if(window.FB) {
      window.FB.set(window.FB.ref(window.FB.db, 'users/ADMIN_MBOLO'), { name: 'Admin Mbolo', bal: 0 });
    }
    draw();
    loadAdminRecharges();
  } else {
    toast('Mot de passe incorrect');
  }
}

async function loadAdminRecharges() {
  if(!window.FB) return;
  const reqRef = window.FB.ref(window.FB.db, 'recharges');
  window.FB.onValue(reqRef, (snap) => {
    const data = snap.val();
    const container = $('#admin-recharges');
    if(!container) return;

    if(!data) {
      container.innerHTML = '<p class="m">Aucune demande en attente.</p>';
      return;
    }

    const reqs = Object.keys(data).map(k => ({ key: k, ...data[k] })).filter(r => r.status === 'pending');
    
    if(reqs.length === 0) {
      container.innerHTML = '<p class="m">Aucune demande en attente.</p>';
      return;
    }

    container.innerHTML = reqs.map(r => `
      <div class="k" style="border:1px solid var(--y)">
        <b>Client : ${esc(r.name)}</b><br>
        <small>ID : ${r.userId}</small><br>
        <small>Demande : ${r.amountFCFA} FCFA (${r.amountKC} KC)</small><br>
        <small>Date : ${ago(r.ts)}</small>
        <div style="margin-top:10px">
          <button onclick="validateRecharge('${r.key}', '${r.userId}', ${r.amountKC})" style="background:var(--g)">✅ Valider</button>
          <button onclick="rejectRecharge('${r.key}')" class="danger">❌ Refuser</button>
        </div>
      </div>
    `).join('');
  });
}

window.validateRecharge = async (reqKey, userId, amountKC) => {
  if(!confirm(`Confirmer avoir reçu l'argent et créditer ${amountKC/10} KC à ${userId} ?`)) return;
  try {
    // 1. Créditer le compte du client
    await window.FB.runTransaction(window.FB.ref(window.FB.db, 'users/' + userId), (curr) => {
      if(curr) curr.bal = (curr.bal || 0) + amountKC;
      return curr;
    });
    // 2. Marquer la requête comme validée
    await window.FB.update(window.FB.ref(window.FB.db, 'recharges/' + reqKey), { status: 'validated' });
    toast('Recharge validée !');
  } catch(e) { toast('Erreur'); }
}

window.rejectRecharge = async (reqKey) => {
  await window.FB.update(window.FB.ref(window.FB.db, 'recharges/' + reqKey), { status: 'rejected' });
  toast('Requête refusée.');
}

window.requestRecharge = async () => {
  const amtFCFA = parseInt($('#reqAmt').value);
  if(!amtFCFA || amtFCFA < 100) return toast('Montant minimum 100 FCFA');
  
  const amountKC = amtFCFA; // 1 KC = 100 FCFA, donc 100 FCFA = 1 KC (1 unité = 1 FCFA dans le code)
  // Attention : dans le code, 10 unités = 1 KC. Donc pour 1000 FCFA, on a 10 KC = 100 unités.
  // Si l'utilisateur entre 1000 FCFA, il doit avoir 10 KC (soit 100 unités).
  // Conversion : FCFA / 100 = KC. Unités = KC * 10. Donc Unités = (FCFA / 100) * 10 = FCFA / 10.
  
  const unitsToCredit = Math.round(amtFCFA / 10); 

  try {
    await window.FB.push(window.FB.ref(window.FB.db, 'recharges'), {
      userId: S.me.id, name: S.me.name, amountFCFA: amtFCFA, amountKC: unitsToCredit, status: 'pending', ts: Date.now()
    });
    toast('Demande envoyée ! L\'admin va vérifier.');
  } catch(e) { toast('Erreur'); }
}
