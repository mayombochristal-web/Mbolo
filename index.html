  if (phase === "error") return `<div class="k center" style="border:2px solid var(--d)"><h2>⚠️ Connexion impossible</h2><p>${esc(perr)}</p><p class="m">Vérifie ta connexion internet puis réessaie.</p><button class="b full" ${act("retry")}>🔄 Réessayer</button><button class="s full" ${act("out")}>Déconnexion</button></div>`;
  if (S.susp) return `<div class="k center" style="border:2px solid var(--d)"><h2>🚫 Compte suspendu</h2><p>Motif : <b>${esc(S.susp.why)}</b></p><p class="m">Contacte l'administration sur WhatsApp.</p><button ${act("out")}>Déconnexion</button></div>`;
  const ban = (tab === "tun" && openT) ? "" : ((notifState() === "default" && !notifLater) ? `<div class="k center" style="border:2px solid var(--y)"><b>🔔 Alertes</b><p class="m" style="margin:6px 0">Reçois les messages et crédits en direct.</p><button class="b full" ${act("notif")}>Activer</button><button class="s full" ${act("later")}>Plus tard</button></div>` : "");
  return ban + ({ feed: fFeed, mk: fMk, tun: fTun, w: fW, contact: fContact, adm: fAdm }[tab] || fFeed)();
}

  ${L ? "" : `<details style="margin-top:10px"><summary class="m" style="cursor:pointer">Lire la charte</summary><small style="display:block;padding:10px;background:var(--bg);border-radius:10px;margin-top:6px">Respecte les autres. Aucun contenu illégal ou trompeur. Les KC sont un crédit prépayé interne (1 KC = 100 FCFA) avec une commission de ${CFG.FEE_TR * 100} %. L'administration peut suspendre un compte en cas d'abus. Ton pseudo ne peut pas être modifié ni récupéré en cas d'oubli du mot de passe : note-le bien.</small></details>
  <label class="m" style="display:flex;gap:8px;margin-top:10px;align-items:center"><input type="checkbox" id="tos"> J'accepte la charte</label>`}

}
async function submitAuth() {
  const p = ($("#au").value || "").trim().toLowerCase(), w = $("#ap").value, reg = mode === "reg";
  if (!/^[a-z0-9_]{3,20}$/.test(p) || (reg && ["admin", "support"].includes(p))) return toast("Pseudo invalide");
  if (w.length < (reg ? 8 : 6)) return toast(reg ? "Mot de passe : 8 caractères minimum" : "Mot de passe trop court");
  if (reg && !$("#tos").checked) return toast("Accepte la charte");
  load(true);
  try { await (reg ? createUserWithEmailAndPassword : signInWithEmailAndPassword)(auth, p + "@mbolo.app", w); }

  finally { load(false); }
}

/* Réserve d'abord le code (/ids), PUIS crée le profil qui s'y réfère : c'est l'ordre exigé par les règles. */
async function createProfile(u) {
  const name = u.email.split("@")[0], key = "mbolo_pc_" + u.uid;
  let code = localStorage.getItem(key);
  if (code && (await get(ref(db, "ids/" + code))).val() !== u.uid) code = null;   // réutilise une réservation déjà faite
  for (let i = 0; i < 8 && !code; i++) {
    const c = genCode();
    try { await set(ref(db, "ids/" + c), u.uid); code = c; localStorage.setItem(key, c); }
    catch (e) { if (e.code !== "PERMISSION_DENIED") throw e; }   // code déjà pris → on retente
  }
  if (!code) throw new Error("Impossible de réserver un code d'accès. Vérifie que les règles Firebase sont à jour.");
  await set(ref(db, "users/" + u.uid), { name, code, bal: 0, joined: TS(), tos: TS() });
  localStorage.removeItem(key);
  return { name, code, bal: 0 };
}

async function initUser(u, seq) {
  clearL(); S = fresh(); S.uid = u.uid; lastBal = null; DEC.clear(); phase = "loading"; draw({ reset: true });
  try {
    const g = async p => (await get(ref(db, p))).val();
    const soft0 = p => g(p).catch(() => null);
    const [adm, mod, susp] = await Promise.all([soft0("admins/" + u.uid), soft0("moderators/" + u.uid), soft0("suspended/" + u.uid)]);
    let p = await g("users/" + u.uid);          // une erreur réseau ICI doit bloquer (jamais "profil absent")
    if (!p) p = await createProfile(u);
    if (seq !== authSeq) return;
    S.admin = adm === true; S.mod = mod === true; S.susp = susp;
    Object.assign(S, { name: p.name, code: p.code, avatar: p.avatar || null, bio: p.bio || "", age: p.age ?? null, address: p.address || "" });
    try { S.tun = JSON.parse(localStorage["mbolo_tun_" + u.uid] || "{}"); } catch (e) {}

    listen(ref(db, "users/" + u.uid + "/bal"), s => {
      const nb = s.val() || 0;
      if (lastBal !== null && nb > lastBal) notifyUser("💰 Crédit reçu", "Ton solde a augmenté de " + kc(nb - lastBal) + ".");
      lastBal = nb; S.bal = nb; nav(); soft("w"); soft("feed");
    });
    listen(query(ref(db, "users/" + u.uid + "/hist"), orderByKey(), limitToLast(30)), s => { S.hist = toArr(s).sort((a, b) => b.ts - a.ts); soft("w"); });
    let first = true;
    listen(ref(db, "inbox/" + u.uid), s => {
      const n = toArr(s).sort((a, b) => b.ts - a.ts);
      if (!first && n.length > S.notifs.length && n[0]) notifyUser("🔔 Mbolo", n[0].txt);
      first = false; S.notifs = n; nav(); soft("w");
    });
    listen(ref(db, "config/freeze"), s => { S.freeze = s.val() === true; soft("w"); soft("adm"); });
    listen(query(ref(db, "posts"), orderByKey(), limitToLast(50)), s => { S.posts = toArr(s); soft("feed"); });
    listen(query(ref(db, "marketplace"), orderByKey(), limitToLast(30)), s => { S.mk = toArr(s); soft("mk"); });
    listen(ref(db, "directory"), s => { S.dir = toArr(s); if (tab === "contact" && !busy()) { const dl = $("#dl"); if (dl) dl.innerHTML = dirList(); } });
    if (S.admin) {
      listen(ref(db, "recharges"), s => { A.rech = s.val() || {}; soft("adm"); });
      listen(ref(db, "transfer_requests"), s => { A.tr = s.val() || {}; soft("adm"); });
      listen(query(ref(db, "log"), orderByKey(), limitToLast(25)), s => { S.logs = toArr(s).sort((a, b) => b.ts - a.ts); soft("adm"); });
    }
    if (S.admin || S.mod) listen(ref(db, "reports"), s => { A.rep = s.val() || {}; soft("adm"); });

    phase = "ready"; tab = "feed"; draw({ reset: true });
    if (notifState() === "granted") saveToken(); else armAutoPrompt();
  } catch (e) {
    if (seq !== authSeq) return;
    console.error(e); perr = errMsg(e); phase = "error"; draw({ reset: true });
  }
}
onAuthStateChanged(auth, u => {
  const seq = ++authSeq;
  if (u) initUser(u, seq);
  else { clearL(); S = fresh(); TK = {}; DEC.clear(); openT = null; phase = "auth"; draw({ reset: true }); }
});
async function out() {
  try { const t = localStorage.getItem("mbolo_fcm_" + S.uid); if (t) { await update(ref(db), { ["users/" + S.uid + "/fcmToken"]: null }); localStorage.removeItem("mbolo_fcm_" + S.uid); } } catch (e) {}
  await signOut(auth);
}

/* ---------- Tunnels chiffrés ---------- */
const saveTun = () => localStorage.setItem("mbolo_tun_" + S.uid, JSON.stringify(S.tun));
function fTun() {
  if (openT) return chat();
  const box = (t, c, lab) => `<div class="k" style="border-left:4px solid ${c}"><h3>${lab}</h3><input id="tn_${t}" maxlength="40" placeholder="Nom" aria-label="Nom"><input id="tp_${t}" type="password" autocomplete="new-password" placeholder="Clé secrète (8 car. min.)" aria-label="Clé secrète"><button class="full" ${act("mk-t", t)} style="background:${c}">Créer</button></div>`;
  return box("edu", "#2463eb", "📚 Créer une classe") + box("com", "#1b5e20", "🛍️ Créer une boutique") +
    `<div class="k"><h3>🔑 Rejoindre</h3><input id="ti" placeholder="ID (ex. CLS-AB12)" maxlength="8" autocapitalize="characters" aria-label="ID du tunnel"><input id="tq" type="password" autocomplete="off" placeholder="Clé secrète" aria-label="Clé secrète"><button class="full" ${act("join-t")}>Rejoindre</button></div>
    <p class="m">🔒 Les messages sont chiffrés sur ton téléphone. Choisis une clé longue et ne la partage qu'en privé : si elle est faible, elle peut être devinée.</p><h3 class="sec">Mes tunnels</h3>` +
    (Object.entries(S.tun).map(([i, t]) => `<div class="k row"><div ${act("open-t", i)} role="button" tabindex="0" style="cursor:pointer;flex:1"><b>${t.type === "com" ? "🛍️" : "📚"} ${esc(t.n)}</b><br><small>ID : ${esc(i)}</small></div><button class="l" ${act("leave-t", i)} aria-label="Retirer de ma liste">✖</button></div>`).join("") || "<p class='m'>Aucun tunnel.</p>");
}
async function mkT(type) {
  const n = $("#tn_" + type).value.trim(), p = $("#tp_" + type).value;
  if (!n) return toast("Donne un nom");
  if (p.length < 8) return toast("Clé secrète : 8 caractères minimum");
  load(true);
  try {
    for (let i = 0; i < 6; i++) {
      const id = (type === "edu" ? "CLS-" : "BQT-") + genCode().slice(0, 4), key = await tk(id, p);
      try { await set(ref(db, "tunnels_meta/" + id), { o: S.uid, t: type, nc: await enc(key, n, id), v: 2, ts: TS() }); }
      catch (e) { if (e.code === "PERMISSION_DENIED") continue; throw e; }   // ID déjà pris → autre ID
      S.tun[id] = { n, type }; saveTun(); TK[id] = key; toast("Créé ! ID : " + id); return openTunnel(id, true);
    }
    toast("Réessaie dans un instant.");
  } finally { load(false); }
}
async function joinT() {
  const i = $("#ti").value.trim().toUpperCase(), p = $("#tq").value;
  if (!TID.test(i) || !p) return toast("ID ou clé invalide");
  load(true);
  try {
    const meta = (await get(ref(db, "tunnels_meta/" + i))).val(); if (!meta) return toast("Tunnel introuvable");
    const key = await tk(i, p), name = await dec(key, meta.nc, i); if (name == null) return toast("Clé incorrecte");
    S.tun[i] = { n: name, type: meta.t }; saveTun(); TK[i] = key;
  } finally { load(false); }
  openTunnel(i, true);
}
async function openTunnel(i, ready) {
  if (!ready && !TK[i]) {
    const p = prompt("Clé secrète de cet espace"); if (!p) return;
    load(true);
    try {
      const meta = (await get(ref(db, "tunnels_meta/" + i))).val(); if (!meta) return toast("Ce tunnel n'existe plus");
      const key = await tk(i, p); if (await dec(key, meta.nc, i) == null) return toast("Clé incorrecte");
      TK[i] = key;
    } finally { load(false); }
  }
  openT = i; S.msgs = []; if (tunOff) tunOff();
  let prev = 0;
  tunOff = onValue(query(ref(db, "tunnels/" + i), orderByKey(), limitToLast(50)), async s => {
    S.msgs = toArr(s).sort((a, b) => a.ts - b.ts);
    const last = S.msgs[S.msgs.length - 1];
    if (prev > 0 && S.msgs.length > prev && last && last.n !== S.name && TK[i]) { const t = await dec(TK[i], last.c, i); if (t) notifyUser("💬 @" + last.n, t.slice(0, 80)); }
    prev = S.msgs.length; renderMsgs();
  }, () => toast("Accès refusé"));
  draw({ reset: true });
}
function chat() {
  const t = S.tun[openT] || { n: "?" };
  return `<div class="k" style="height:72vh;display:flex;flex-direction:column"><div class="row"><button class="s" ${act("go", "tun")} aria-label="Retour">←</button><b style="flex:1;text-align:center">${esc(t.n)}</b><a class="btn wa" style="width:auto;margin:0;padding:10px 14px" aria-label="Partager l'invitation" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=${encodeURIComponent("Rejoins « " + t.n + " » sur Mbolo. ID : " + openT + " (la clé te sera donnée en privé)")}">📤</a></div>
  <div id="cb" style="flex:1;overflow-y:auto;margin:10px 0" aria-live="polite"></div><div class="row"><input id="cm" maxlength="1500" placeholder="Message chiffré…" aria-label="Message" style="margin:0" data-enter='[data-a="send"]'><button ${act("send")} style="margin:0" aria-label="Envoyer">➤</button></div></div>`;
}
async function renderMsgs() {
  const b = $("#cb"), tid = openT; if (!b || !tid) return;
  const my = ++msgSeq, h = [];
  for (const m of S.msgs) {
    const ck = tid + ":" + m.id; let t = DEC.get(ck);
    if (t === undefined) { t = await dec(TK[tid], m.c, tid); if (t !== null) DEC.set(ck, t); }
    if (my !== msgSeq || openT !== tid) return;
    const me = m.n === S.name;
    h.push(`<div style="margin-bottom:10px;text-align:${me ? "right" : "left"}"><small>@${esc(m.n)} · ${m.ts ? new Date(m.ts).toLocaleTimeString("fr", { hour: "2-digit", minute: "2-digit" }) : ""}${me || S.admin ? ` <button class="l" style="display:inline;min-height:0;padding:0 4px" ${act("del-msg", m.id)} aria-label="Supprimer">🗑️</button>` : ""}</small><br><span style="display:inline-block;padding:9px 13px;border-radius:12px;max-width:85%;text-align:left;overflow-wrap:anywhere;background:${me ? "var(--g)" : "var(--l)"};color:${me ? "#fff" : "var(--t)"}">${t == null ? "<i>🔒 Message illisible</i>" : esc(t)}</span></div>`);
  }
  const near = b.scrollHeight - b.scrollTop - b.clientHeight < 80;
  b.innerHTML = h.join("") || "<p class='m center'>Début de la conversation.</p>";
  if (near || !b.dataset.init) { b.scrollTop = b.scrollHeight; b.dataset.init = "1"; }
}
async function snd() {
  const i = $("#cm"), t = i.value.trim(); if (!t || !TK[openT]) return;
  await push(ref(db, "tunnels/" + openT), { ts: TS(), n: S.name, c: await enc(TK[openT], t, openT) }); i.value = ""; i.focus();

  const notifHtml = S.notifs.length ? S.notifs.map(n => `<div class="h-item"><span>${esc(n.txt)}<br><small class="m">${ago(n.ts)}</small></span><button class="s" ${act("read-notif", n.id)} aria-label="Marquer comme lu" style="min-height:36px;margin:0">✔</button></div>`).join("") + `<button class="s full" ${act("read-all")}>Tout marquer comme lu</button>` : "<p class='m'>Aucune notification.</p>";
  return (S.freeze ? '<div class="err">⚠️ Opérations d\'argent suspendues par l\'administration.</div>' : "") +
    `<div class="wallet-card"><div style="opacity:.85;font-size:13px">Mon solde</div><div class="bal">${kc(S.bal)}</div><small style="color:#fff;opacity:.85">≈ ${fc(S.bal)} · 1 KC = 100 FCFA</small></div>
    <div class="k"><h3>🔔 Notifications</h3>${notifHtml}</div>
    <div class="k" style="border-left:4px solid var(--y)"><h3>🛒 Acheter des KC</h3><p class="m">Envoie par Airtel Money au +${CFG.AIRTEL}, puis déclare ta recharge.</p>
    <input id="ra" type="number" inputmode="numeric" step="10" placeholder="Montant envoyé (FCFA, min. 500)" aria-label="Montant en FCFA"><input id="rr" maxlength="40" placeholder="Référence Airtel Money (optionnel)" aria-label="Référence"><button class="full" ${act("rech")}${fz}>Déclarer ma recharge</button>
    <a class="btn wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/${CFG.AIRTEL}?text=${encodeURIComponent("Bonjour, je souhaite acheter des KC. Mon code Mbolo : " + S.code)}">💬 Prévenir sur WhatsApp</a></div>
    <div class="k"><h3>Envoyer des KC</h3><input id="wt" maxlength="6" autocapitalize="characters" placeholder="Code destinataire (6 car.)" aria-label="Code destinataire"><input id="wd" type="number" inputmode="decimal" step="0.1" placeholder="Montant en KC" aria-label="Montant en KC"><button class="full" ${act("tr")}${fz}>Demander l'envoi (comm. ${CFG.FEE_TR * 100} %)</button></div>
    <div class="k"><h3>💸 Retirer en FCFA</h3><input id="xk" type="number" inputmode="decimal" step="0.1" placeholder="Montant en KC (min. 5)" aria-label="Montant en KC"><input id="xn" type="tel" maxlength="20" placeholder="Numéro Airtel Money" aria-label="Numéro Airtel Money"><button class="full" ${act("wd")}${fz}>Demander le retrait (comm. ${CFG.FEE_WD * 100} %)</button></div>
    <div class="k center"><h3>Mon code Mbolo</h3><b style="font-size:26px;letter-spacing:4px;color:var(--g)">${esc(S.code)}</b></div>
    <div class="k"><h3>📜 Relevé de compte</h3>${histHtml}</div>`;
}
async function send(path, d, msg) { if (S.freeze) return toast("Opérations suspendues"); await push(ref(db, path), d); toast(msg); draw({ reset: true }); }
function reqRech() {
  const a = parseInt($("#ra").value, 10); if (!(a >= 500) || a % 10) return toast("Montant invalide (500 min., multiple de 10)");
  const d = { uid: S.uid, name: S.name, amountFCFA: a, amountKC: a / 10, status: "pending", ts: TS() }, r = $("#rr").value.trim(); if (r) d.ref = r;
  return send("recharges", d, "Recharge déclarée. Tu seras notifié à la validation.");
}
async function reqTr() {
  const to = $("#wt").value.trim().toUpperCase(), a = Math.round(parseFloat($("#wd").value) * 10);
  if (!/^[A-Z0-9]{6}$/.test(to) || to === S.code) return toast("Code invalide");
  if (!(a >= 1) || a > S.bal) return toast("Montant invalide ou solde insuffisant");
  const tu = (await get(ref(db, "ids/" + to))).val(); if (!tu) return toast("Code inconnu");
  return send("transfer_requests", { t: "tr", f: S.uid, fn: S.name, tu, tc: to, a, m: "Transfert", s: "p", ts: TS() }, "Demande envoyée.");
}
function reqWd() {
  const a = Math.round(parseFloat($("#xk").value) * 10), n = $("#xn").value.trim();
  if (!(a >= 50) || a > S.bal) return toast("Min 5 KC et solde suffisant");
  if (n.replace(/\D/g, "").length < 8) return toast("Numéro invalide");
  return send("transfer_requests", { t: "wd", f: S.uid, fn: S.name, a, m: n.replace(/\D/g, ""), s: "p", ts: TS() }, "Retrait demandé.");
}
async function delAcc() {
  if (S.bal > 0) return toast("Tu dois avoir 0 KC pour supprimer ton compte.");
  if (!confirm("Supprimer DÉFINITIVEMENT ton compte ? Cette action est irréversible.")) return;
  const pw = prompt("Confirme avec ton mot de passe"); if (!pw) return;
  load(true);
  try {
    await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, pw));
    await update(ref(db), { ["users/" + S.uid]: null, ["ids/" + S.code]: null, ["directory/" + S.uid]: null });
    const u = auth.currentUser; await deleteUser(u); toast("Compte supprimé.");
  } finally { load(false); }
}

/* ---------- Profil & annuaire ---------- */
function dirList() {
  let D = [...S.dir]; const q = dirSearch.toLowerCase();
  if (q) D = D.filter(d => (d.n || "").toLowerCase().includes(q) || (d.qu || "").toLowerCase().includes(q));
  return D.sort((a, b) => b.ts - a.ts).map(c => `<div class="k"><b>${esc(c.n)}</b>${badge(c.cat)}<br><small>📍 ${esc(c.qu || "")}</small><a class="btn wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/${esc(c.wa)}">💬 WhatsApp</a></div>`).join("") || "<p class='m'>Aucun résultat.</p>";
}
function fContact() {
  const me = S.dir.find(d => d.id === S.uid) || {};
  return `<div class="k"><h3>👤 Mon profil</h3>
    <div style="display:flex;align-items:center;gap:15px;margin-bottom:15px"><div class="post-avatar" style="width:70px;height:70px;font-size:28px">${S.avatar ? `<img alt="" src="${esc(S.avatar)}">` : initial(S.name)}</div>
    <div style="flex:1"><b>@${esc(S.name)}</b><br><small>Code : <b>${esc(S.code)}</b></small><input type="file" id="pavimg" accept="image/*" aria-label="Changer la photo" style="margin:6px 0 0;padding:8px;font-size:12px"></div></div>
    <textarea id="pbio" rows="2" maxlength="150" placeholder="Bio…" aria-label="Bio">${esc(S.bio)}</textarea>
    <div class="row"><input id="page" type="number" inputmode="numeric" placeholder="Âge" aria-label="Âge" value="${S.age ?? ""}" style="flex:1"><input id="paddr" maxlength="50" placeholder="Ville" aria-label="Ville" value="${esc(S.address)}" style="flex:2"></div>
    <button class="full" ${act("save-profile")} style="margin-top:10px">Enregistrer</button></div>
  ${installEv ? `<div class="k center"><b>📲 Installer Mbolo</b><p class="m" style="margin:6px 0">Accès direct depuis ton écran d'accueil.</p><button class="b full" ${act("install")}>Installer l'application</button></div>` : ""}
  <div class="k"><h3>📇 Ma carte annuaire</h3>
    <input id="dn" maxlength="40" placeholder="Nom / Boutique" aria-label="Nom ou boutique" value="${esc(me.n || "")}">
    <select id="dc" aria-label="Catégorie"><option value="edu"${me.cat === "edu" ? " selected" : ""}>📚 Enseignant</option><option value="com"${me.cat === "com" ? " selected" : ""}>🛍️ Commerçant</option></select>
    <input id="dq" maxlength="40" placeholder="Quartier / Ville" aria-label="Quartier" value="${esc(me.qu || "")}">
    <input id="dw" type="tel" placeholder="WhatsApp (ex. 24177…)" aria-label="WhatsApp" value="${esc(me.wa || "")}">
    <label class="m" style="display:flex;gap:8px;margin-top:8px;align-items:center"><input type="checkbox" id="dk" ${me.id ? "checked" : ""}> J'accepte que mon numéro soit visible</label>
    <button class="full" ${act("reg-dir")} style="margin-top:8px">Publier</button>${me.id ? `<button class="s full" ${act("del-dir")}>Retirer ma carte</button>` : ""}</div>
  <h3 class="sec">Annuaire</h3>
  <input id="ds" type="search" placeholder="🔍 Rechercher un prof, un commerce, un quartier…" aria-label="Rechercher" data-search value="${esc(dirSearch)}">
  <div id="dl">${dirList()}</div>
  <div class="k" style="display:flex;gap:10px;margin-top:15px"><button class="s" ${act("del-acc")} style="flex:1">Supprimer mon compte</button><button class="r" ${act("out")} style="flex:1">Déconnexion</button></div>`;
}
async function saveProfile() {
  const bio = $("#pbio").value.trim(), ageV = $("#page").value.trim(), addr = $("#paddr").value.trim(), f = $("#pavimg").files[0];
  const age = ageV === "" ? null : Number(ageV); if (age !== null && (!Number.isInteger(age) || age < 10 || age > 120)) return toast("Âge invalide");
  const U = { ["users/" + S.uid + "/bio"]: bio, ["users/" + S.uid + "/age"]: age, ["users/" + S.uid + "/address"]: addr };
  let avatar = S.avatar; if (f) { const url = await upImg(f); if (!url) return; avatar = url; U["users/" + S.uid + "/avatar"] = url; }
  await update(ref(db), U); Object.assign(S, { bio, age, address: addr, avatar }); toast("Profil mis à jour !"); draw({ reset: true });
}
async function regDir() {
  const n = $("#dn").value.trim(), wa = $("#dw").value.replace(/\D/g, "");
  if (n.length < 2 || wa.length < 8 || wa.length > 15) return toast("Nom et WhatsApp valides requis");
  if (!$("#dk").checked) return toast("Coche l'autorisation d'affichage");
  await set(ref(db, "directory/" + S.uid), { n, cat: $("#dc").value, qu: $("#dq").value.trim(), wa, ok: true, ts: TS() }); toast("Carte publiée !"); draw({ reset: true });
}

/* ---------- Administration (opérations ATOMIQUES : increment + changement de statut dans une seule écriture) ---------- */
function fAdm() {
  const byTs = (a, b) => (a[1].ts || 0) - (b[1].ts || 0);
  const rech = Object.entries(A.rech).filter(([, r]) => r.status === "pending").sort(byTs), tr = Object.entries(A.tr).filter(([, r]) => r.s === "p").sort(byTs), rep = Object.entries(A.rep).filter(([, r]) => r.s === "open").sort(byTs);
  let h = "";
  if (S.admin) {
    h += `<div class="k"><h3>⚙️ Système</h3><button class="${S.freeze ? "r" : "s"} full" ${act("freeze")}>${S.freeze ? "🔴 Dégeler les opérations d'argent" : "🟢 Geler les opérations d'argent"}</button></div>
    <div class="k"><h3>👤 Gérer un compte</h3><input id="ac" maxlength="6" autocapitalize="characters" placeholder="Code (6 car.)" aria-label="Code"><input id="aw" placeholder="Motif (suspension)" aria-label="Motif"><input id="aa" type="number" inputmode="decimal" step="0.1" placeholder="KC (négatif = débiter)" aria-label="Montant KC"><button ${act("credit")}>➕ Ajuster le solde</button><button class="r" ${act("suspend", "1")}>🚫 Suspendre</button><button class="s" ${act("suspend", "0")}>Lever</button>
    <div style="border-top:1px solid var(--l);margin-top:10px;padding-top:10px"><p class="m">Modérateurs :</p><button class="s" ${act("mod", "1")}>⭐ Nommer</button><button class="s" ${act("mod", "0")}>Retirer</button></div></div>
    <div class="k"><h3>📥 Recharges (${rech.length})</h3>${rech.map(([k, r]) => `<div class="h-item"><div>@${esc(r.name)} · ${r.amountFCFA} FCFA${r.ref ? `<br><small>Réf : ${esc(r.ref)}</small>` : ""}</div><div><button ${act("ok-rech", k)} aria-label="Valider">✅</button><button class="r" ${act("no-rech", k)} aria-label="Refuser">❌</button></div></div>`).join("") || "<p class='m'>Rien.</p>"}</div>
    <div class="k"><h3>🔄 Envois / Retraits (${tr.length})</h3>${tr.map(([k, r]) => `<div class="h-item"><div>${r.t === "wd" ? "💸 Retrait" : "🔁 Envoi"} · @${esc(r.fn)} · ${kc(r.a)}<br><small>${r.t === "wd" ? "Payer " + fc(r.a - Math.round(r.a * CFG.FEE_WD)) + " au " + esc(r.m) : "→ " + esc(r.tc || r.tu) + " · " + esc(r.m || "")}</small></div><div><button ${act("ok-tr", k)} aria-label="Valider">✅</button><button class="r" ${act("no-tr", k)} aria-label="Refuser">❌</button></div></div>`).join("") || "<p class='m'>Rien.</p>"}</div>`;
  }
  h += `<div class="k"><h3>🚩 Signalements (${rep.length})</h3>${rep.map(([k, r]) => `<div style="border-bottom:1px solid var(--l);padding:10px 0"><b>${esc(r.kind)}</b> <small>${esc(r.ref)}</small><br><small>${esc(r.why)}</small><br><button class="r" ${act("rm-rep", k)}>🗑️ Retirer le contenu</button><button class="s" ${act("done-rep", k)}>Classer</button></div>`).join("") || "<p class='m'>Aucun signalement.</p>"}</div>`;
  if (S.admin) h += `<div class="k"><h3>🧾 Journal (25 derniers)</h3>${S.logs.map(l => `<div class="h-item"><small>${ago(l.ts)} · ${esc(l.t)} · ${esc(l.f || "")}${l.to ? " → " + esc(l.to) : ""}</small><small>${kc(l.a || 0)} (frais ${kc(l.fee || 0)})</small></div>`).join("") || "<p class='m'>Vide.</p>"}</div>`;
  return h;
}
const byCode = async c => (await get(ref(db, "ids/" + c))).val();
const notice = (U, uid, txt, now) => { U[`inbox/${uid}/${nid("i")}`] = { txt: txt.slice(0, 200), ts: now }; };
const logEntry = (U, o, now) => { U[`log/${nid("l")}`] = { by: S.uid, ts: now, ...o }; };

async function credit() {
  const c = $("#ac").value.trim().toUpperCase(), a = Math.round(parseFloat($("#aa").value) * 10);
  if (!/^[A-Z0-9]{6}$/.test(c) || !a) return toast("Code et montant requis");
  const u = await byCode(c); if (!u) return toast("Code inconnu");
  if (!confirm(`${a > 0 ? "Créditer" : "Débiter"} ${kc(Math.abs(a))} sur ${c} ?`)) return;
  const U = {}, now = TS();
  U[`users/${u}/bal`] = increment(a);
  U[`users/${u}/hist/${nid("h")}`] = { t: "adj", txt: a > 0 ? "Recharge admin" : "Ajustement admin", a, ts: now };
  notice(U, u, a > 0 ? `Ton compte a été crédité de ${kc(a)}.` : `Ajustement de ${kc(a)} sur ton compte.`, now);
  logEntry(U, { t: "credit", to: c, a, fee: 0 }, now);
  try { await update(ref(db), U); toast("Fait ✅"); } catch (e) { toast(errMsg(e) === "Refusé par les règles de sécurité" ? "Refusé (solde insuffisant ?)" : errMsg(e)); }
}
async function suspend(on) {
  const c = $("#ac").value.trim().toUpperCase(), w = $("#aw").value.trim(), u = await byCode(c); if (!u) return toast("Code inconnu");
  if (on) { if (w.length < 3) return toast("Motif requis"); await set(ref(db, "suspended/" + u), { why: w.slice(0, 200), ts: TS() }); toast("Compte suspendu"); }
  else { await remove(ref(db, "suspended/" + u)); toast("Suspension levée"); }
}
async function setMod(on) {
  const c = $("#ac").value.trim().toUpperCase(), u = await byCode(c); if (!u) return toast("Code inconnu");
  if (on) { await set(ref(db, "moderators/" + u), true); toast("Modérateur nommé ⭐"); } else { await remove(ref(db, "moderators/" + u)); toast("Modérateur retiré"); }
}
async function okRech(k) {
  const r = A.rech[k]; if (!r || r.status !== "pending" || !confirm("Créditer " + kc(r.amountKC) + " à @" + r.name + " ?")) return;
  const U = {}, now = TS();
  U[`users/${r.uid}/bal`] = increment(r.amountKC);
  U[`users/${r.uid}/hist/${nid("h")}`] = { t: "topup", txt: "Recharge validée", a: r.amountKC, ts: now };
  U[`recharges/${k}/status`] = "validated";
  notice(U, r.uid, `Recharge validée : +${kc(r.amountKC)}.`, now);
  logEntry(U, { t: "topup", f: r.name, a: r.amountKC, fee: 0 }, now);
  await update(ref(db), U); toast("Validé ✅");
}
async function noRech(k) {
  const r = A.rech[k]; if (!r || r.status !== "pending") return;
  const U = { [`recharges/${k}/status`]: "rejected" }; notice(U, r.uid, `Ta recharge de ${r.amountFCFA} FCFA n'a pas pu être validée. Contacte l'administration.`, TS());
  await update(ref(db), U);
}
async function okTr(k) {
  const r = A.tr[k]; if (!r || r.s !== "p") return;
  if (r.t === "tr" && !r.tu) return toast("Ancienne demande (format V20) : refuse-la, le membre la refera.");
  if (!confirm("Valider cette opération ?")) return;
  const fee = Math.round(r.a * (r.t === "wd" ? CFG.FEE_WD : CFG.FEE_TR)), D = {}, add = (u, x) => { D[u] = (D[u] || 0) + x; }, U = {}, now = TS();
  add(r.f, -r.a); if (r.t === "tr") add(r.tu, r.a - fee); add(S.uid, fee);   // cumul par compte : sûr même si l'admin est partie prenante
  for (const u in D) if (D[u]) U[`users/${u}/bal`] = increment(D[u]);
  U[`users/${r.f}/hist/${nid("h")}`] = { t: r.t, txt: r.t === "wd" ? "Retrait validé" : "Envoi vers " + (r.tc || "un membre"), a: -r.a, ts: now };
  notice(U, r.f, r.t === "wd" ? `Retrait de ${kc(r.a)} validé : tu recevras ${fc(r.a - fee)}.` : `Envoi de ${kc(r.a)} validé.`, now);
  if (r.t === "tr") { U[`users/${r.tu}/hist/${nid("h")}`] = { t: "tr", txt: "Reçu de @" + r.fn, a: r.a - fee, ts: now }; notice(U, r.tu, `Tu as reçu ${kc(r.a - fee)} de @${r.fn}.`, now); }
  U[`transfer_requests/${k}/s`] = "ok";
  logEntry(U, { t: r.t, f: r.fn, to: r.tc || "", a: r.a, fee }, now);
  try { await update(ref(db), U); toast(r.t === "wd" ? "Validé : pense à payer par Airtel Money" : "Validé ✅"); }
  catch (e) { toast("Refusé : solde de l'expéditeur insuffisant ou demande déjà traitée"); }
}
async function noTr(k) {
  const r = A.tr[k]; if (!r || r.s !== "p") return;
  const U = { [`transfer_requests/${k}/s`]: "no" }; notice(U, r.f, `Ta demande de ${kc(r.a)} n'a pas été acceptée.`, TS());
  await update(ref(db), U);
}
async function rmRep(k) {
  const r = A.rep[k]; if (!r) return;
  if (PUSHID.test(r.ref)) { if (r.kind === "post") await remove(ref(db, "posts/" + r.ref)); else if (r.kind === "listing") await remove(ref(db, "marketplace/" + r.ref)); }
  await update(ref(db), { [`reports/${k}/s`]: "done" }); toast("Contenu retiré");
}

/* ---------- Actions (délégation d'événements : aucun onclick inline, donc aucune injection par attribut) ---------- */
const ACT = {
  go: id => { tab = id; openT = null; if (tunOff) { tunOff(); tunOff = null; } draw(); scrollTo(0, 0); },
  reload: () => location.reload(),
  retry: () => { const u = auth.currentUser; if (u) initUser(u, ++authSeq); else location.reload(); },
  out, mode: id => { mode = id; amsg = ""; draw({ reset: true }); }, auth: submitAuth,
  notif: enableNotifs, later: () => { notifLater = true; draw({ reset: true }); },
  install: async () => { if (!installEv) return; installEv.prompt(); await installEv.userChoice.catch(() => {}); installEv = null; draw({ reset: true }); },
  setf: id => { feedF = id; tab = "feed"; draw(); },
  "focus-post": () => { tab = "feed"; draw(); $("#px")?.focus(); },
  pub, "del-post": async id => { if (confirm("Supprimer cette publication ?")) await remove(ref(db, "posts/" + id)); },
  "report-post": id => report("post", id), "report-listing": id => report("listing", id),
  sell, buy, "del-mk": async id => { if (confirm("Retirer cette annonce ?")) await remove(ref(db, "marketplace/" + id)); },
  "mk-t": mkT, "join-t": joinT, "open-t": id => openTunnel(id, false),
  "leave-t": id => { if (confirm("Retirer ce tunnel de ta liste ? (les messages restent chez les autres membres)")) { delete S.tun[id]; delete TK[id]; saveTun(); draw({ reset: true }); } },
  send: snd, "del-msg": async id => { if (confirm("Supprimer ce message ?")) await remove(ref(db, "tunnels/" + openT + "/" + id)); },
  rech: reqRech, tr: reqTr, wd: reqWd, "del-acc": delAcc,
  "read-notif": async id => { await remove(ref(db, "inbox/" + S.uid + "/" + id)); },
  "read-all": async () => { const U = {}; S.notifs.forEach(n => { U[`inbox/${S.uid}/${n.id}`] = null; }); await update(ref(db), U); },
  "save-profile": saveProfile, "reg-dir": regDir, "del-dir": async () => { await remove(ref(db, "directory/" + S.uid)); toast("Carte retirée"); draw({ reset: true }); },
  freeze: async () => { await set(ref(db, "config/freeze"), !S.freeze); },
  credit, suspend: id => suspend(id === "1"), mod: id => setMod(id === "1"),
  "ok-rech": okRech, "no-rech": noRech, "ok-tr": okTr, "no-tr": noTr,
  "done-rep": async id => { await update(ref(db), { [`reports/${id}/s`]: "done" }); }, "rm-rep": rmRep
};
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a]; if (!fn) return;
  const lock = el.tagName === "BUTTON"; if (lock) el.disabled = true;
  try { await fn(el.dataset.id, el); }
  catch (err) { console.error(err); toast(errMsg(err)); }
  finally { if (lock && el.isConnected) el.disabled = false; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && e.target.dataset?.enter) { e.preventDefault(); document.querySelector(e.target.dataset.enter)?.click(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute?.("role") === "button" && e.target.dataset.a) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => { if (e.target.dataset?.search !== undefined) { dirSearch = e.target.value; const dl = $("#dl"); if (dl) dl.innerHTML = dirList(); } });
// Plus jamais d'échec silencieux : toute erreur non gérée est signalée.
let lastErrAt = 0;
addEventListener("unhandledrejection", e => { console.error(e.reason); if (Date.now() - lastErrAt > 3000) { lastErrAt = Date.now(); toast("Erreur : " + errMsg(e.reason)); } });
draw();
</script>
</body>
</html>
